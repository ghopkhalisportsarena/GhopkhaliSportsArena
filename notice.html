<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ঘোপখালী স্পোর্টস অ্যারিনার অফিসিয়াল নোটিশ"
    >

    <title>
        Official Notice | Ghopkhali Sports Arena
    </title>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fa 0%,
                    #eef1f5 45%,
                    #ffffff 100%
                );

            color: #111827;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =================================================
           BACKGROUND
        ================================================= */

        body::before {

            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            right: -150px;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 122, 255, 0.12),
                    transparent 70%
                );

            filter: blur(20px);

            pointer-events: none;

            z-index: -1;
        }


        body::after {

            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            bottom: -180px;
            left: -150px;

            background:
                radial-gradient(
                    circle,
                    rgba(88, 86, 214, 0.10),
                    transparent 70%
                );

            filter: blur(25px);

            pointer-events: none;

            z-index: -1;
        }


        /* =================================================
           HEADER
        ================================================= */

        .notice-header {

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(255,255,255,0.78);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            border-bottom:
                1px solid rgba(0,0,0,0.07);

            padding:
                16px 22px;
        }


        .notice-header-inner {

            max-width: 1180px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .brand {

            text-decoration: none;

            color: #111827;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .brand-icon {

            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: grid;

            place-items: center;

            background:
                linear-gradient(
                    145deg,
                    #111827,
                    #374151
                );

            color: white;

            font-size: 20px;

            box-shadow:
                0 8px 24px
                rgba(0,0,0,0.15);
        }


        .brand-text strong {

            display: block;

            font-size: 15px;

            letter-spacing: -0.3px;
        }


        .brand-text span {

            display: block;

            font-size: 11px;

            color: #6b7280;

            margin-top: 2px;
        }


        .home-button {

            text-decoration: none;

            color: #111827;

            padding:
                10px 16px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.85);

            border:
                1px solid rgba(0,0,0,0.08);

            font-size: 13px;

            font-weight: 600;

            transition:
                0.25s ease;
        }


        .home-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);
        }


        /* =================================================
           HERO
        ================================================= */

        .notice-hero {

            max-width: 1180px;

            margin: auto;

            padding:
                80px 22px 55px;
        }


        .notice-eyebrow {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.7px;

            color: #007aff;

            text-transform: uppercase;

            margin-bottom: 18px;
        }


        .notice-eyebrow::before {

            content: "";

            width: 28px;
            height: 2px;

            background: #007aff;

            border-radius: 20px;
        }


        .notice-hero h1 {

            font-size:
                clamp(42px, 7vw, 82px);

            line-height: 0.98;

            letter-spacing:
                -4px;

            max-width: 820px;

            font-weight: 750;

            color: #111827;
        }


        .notice-hero h1 span {

            background:
                linear-gradient(
                    90deg,
                    #007aff,
                    #5856d6,
                    #af52de
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color: transparent;
        }


        .notice-hero p {

            max-width: 650px;

            margin-top: 24px;

            color: #6b7280;

            font-size: 17px;

            line-height: 1.7;
        }


        /* =================================================
           NOTICE AREA
        ================================================= */

        .notice-main {

            max-width: 1180px;

            margin: auto;

            padding:
                0 22px 100px;
        }


        .notice-toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 25px;
        }


        .notice-count {

            font-size: 13px;

            color: #6b7280;
        }


        .notice-count strong {

            color: #111827;
        }


        .notice-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        /* =================================================
           NOTICE CARD
        ================================================= */

        .notice-card {

            position: relative;

            overflow: hidden;

            padding: 27px;

            min-height: 250px;

            border-radius: 28px;

            background:
                rgba(255,255,255,0.72);

            border:
                1px solid
                rgba(255,255,255,0.9);

            box-shadow:
                0 18px 55px
                rgba(17,24,39,0.07);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            opacity: 0;

            transform:
                translateY(25px);

            animation:
                noticeReveal
                0.65s
                cubic-bezier(.2,.8,.2,1)
                forwards;

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }


        .notice-card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 25px 65px
                rgba(17,24,39,0.12);
        }


        .notice-card::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -90px;
            top: -90px;

            border-radius: 50%;

            background:
                rgba(0,122,255,0.07);
        }


        .notice-card.important {

            border:
                1px solid
                rgba(255,59,48,0.20);
        }


        .notice-card.important::before {

            background:
                rgba(255,59,48,0.07);
        }


        .notice-card-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 25px;
        }


        .notice-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px 11px;

            border-radius: 999px;

            background:
                rgba(0,122,255,0.09);

            color: #007aff;

            font-size: 10px;

            font-weight: 750;

            letter-spacing: 1px;
        }


        .important .notice-badge {

            background:
                rgba(255,59,48,0.09);

            color: #ff3b30;
        }


        .notice-date {

            font-size: 11px;

            color: #8a8f98;

            font-weight: 600;
        }


        .notice-icon {

            width: 50px;
            height: 50px;

            border-radius: 16px;

            display: grid;

            place-items: center;

            background:
                linear-gradient(
                    145deg,
                    #f2f4f7,
                    #ffffff
                );

            border:
                1px solid
                rgba(0,0,0,0.05);

            font-size: 23px;

            margin-bottom: 20px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.06);
        }


        .notice-card h2 {

            font-size: 23px;

            line-height: 1.25;

            letter-spacing: -0.7px;

            margin-bottom: 12px;
        }


        .notice-description {

            color: #6b7280;

            line-height: 1.7;

            font-size: 14px;

            white-space: pre-line;
        }


        .notice-image {

            width: 100%;

            max-height: 300px;

            object-fit: cover;

            border-radius: 18px;

            margin-top: 20px;

            display: block;
        }


        .notice-attachment {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 20px;

            padding:
                10px 15px;

            border-radius: 999px;

            text-decoration: none;

            color: white;

            background: #111827;

            font-size: 12px;

            font-weight: 650;

            transition: .25s ease;
        }


        .notice-attachment:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.15);
        }


        /* =================================================
           LOADING
        ================================================= */

        .notice-loading {

            grid-column: 1 / -1;

            min-height: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            color: #8a8f98;

            font-size: 13px;
        }


        .loader {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            border:
                3px solid
                rgba(0,122,255,0.12);

            border-top-color:
                #007aff;

            animation:
                spin .8s linear infinite;
        }


        .notice-message {

            grid-column: 1 / -1;

            padding: 60px 20px;

            text-align: center;

            color: #6b7280;
        }


        /* =================================================
           FOOTER
        ================================================= */

        .notice-footer {

            text-align: center;

            padding:
                35px 20px 45px;

            color: #9ca3af;

            font-size: 12px;
        }


        .notice-footer strong {

            color: #6b7280;
        }


        /* =================================================
           ANIMATION
        ================================================= */

        @keyframes noticeReveal {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 760px) {

            .notice-header {
                padding: 13px 15px;
            }


            .brand-icon {
                width: 38px;
                height: 38px;
                border-radius: 11px;
            }


            .brand-text span {
                display: none;
            }


            .home-button {
                padding: 9px 13px;
                font-size: 12px;
            }


            .notice-hero {
                padding:
                    55px 17px 40px;
            }


            .notice-hero h1 {

                font-size:
                    clamp(42px, 14vw, 62px);

                letter-spacing:
                    -2.5px;
            }


            .notice-hero p {
                font-size: 15px;
            }


            .notice-main {
                padding:
                    0 15px 70px;
            }


            .notice-grid {

                grid-template-columns:
                    1fr;

                gap: 15px;
            }


            .notice-card {

                padding: 22px;

                border-radius: 23px;
            }


            .notice-card h2 {
                font-size: 21px;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================= -->

    <header class="notice-header">

        <div class="notice-header-inner">


            <a
                href="index.html"
                class="brand"
            >

                <div class="brand-icon">
                    📢
                </div>

                <div class="brand-text">

                    <strong>
                        Ghopkhali Sports Arena
                    </strong>

                    <span>
                        Official Notice
                    </span>

                </div>

            </a>


            <a
                href="index.html"
                class="home-button"
            >
                ← Home
            </a>

        </div>

    </header>



    <!-- =================================================
         HERO
    ================================================= -->

    <section class="notice-hero">

        <div class="notice-eyebrow">
            GHOPKHALI SPORTS ARENA
        </div>


        <h1>
            Official
            <span>Notice.</span>
        </h1>


        <p>
            ঘোপখালী স্পোর্টস অ্যারিনার সকল
            অফিসিয়াল নোটিশ, ঘোষণা এবং গুরুত্বপূর্ণ
            তথ্য এখানে প্রকাশ করা হবে।
        </p>

    </section>



    <!-- =================================================
         MAIN
    ================================================= -->

    <main class="notice-main">


        <div class="notice-toolbar">

            <div class="notice-count">
                মোট নোটিশ:
                <strong id="noticeCount">—</strong>
            </div>

        </div>


        <div
            id="noticeGrid"
            class="notice-grid"
        >

            <div class="notice-loading">

                <div class="loader"></div>

                <span>
                    নোটিশ লোড হচ্ছে...
                </span>

            </div>

        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================= -->

    <footer class="notice-footer">

        © <span id="year"></span>

        <strong>
            Ghopkhali Sports Arena
        </strong>

        — Official Notice

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async () => {


                /* =========================================
                   YEAR
                ========================================= */

                document.getElementById(
                    "year"
                ).textContent =
                    new Date().getFullYear();



                /* =========================================
                   SUPABASE
                ========================================= */

                const SUPABASE_URL =
                    "https://cmygmswzokyrmgdnuszq.supabase.co";


                const SUPABASE_ANON_KEY =
                    "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


                if (!window.supabase) {

                    console.error(
                        "Supabase library not loaded."
                    );

                    return;
                }


                const supabaseClient =
                    window.supabase.createClient(
                        SUPABASE_URL,
                        SUPABASE_ANON_KEY
                    );



                /* =========================================
                   ELEMENTS
                ========================================= */

                const grid =
                    document.getElementById(
                        "noticeGrid"
                    );


                const count =
                    document.getElementById(
                        "noticeCount"
                    );



                /* =========================================
                   ESCAPE HTML
                ========================================= */

                function escapeHTML(value) {

                    return String(value ?? "")
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }



                /* =========================================
                   FORMAT DATE
                ========================================= */

                function formatDate(dateValue) {

                    if (!dateValue) {
                        return "";
                    }

                    const date =
                        new Date(dateValue);

                    if (
                        Number.isNaN(
                            date.getTime()
                        )
                    ) {
                        return escapeHTML(
                            dateValue
                        );
                    }

                    return date.toLocaleDateString(
                        "bn-BD",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );

                }



                /* =========================================
                   LOAD NOTICES
                ========================================= */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from("notices")
                            .select("*")
                            .eq(
                                "published",
                                true
                            )
                            .order(
                                "notice_date",
                                {
                                    ascending:
                                        false
                                }
                            )
                            .order(
                                "created_at",
                                {
                                    ascending:
                                        false
                                }
                            );


                    /* =====================================
                       ERROR
                    ===================================== */

                    if (error) {

                        console.error(
                            "Notice loading error:",
                            error
                        );

                        count.textContent = "0";

                        grid.innerHTML = `

                            <div
                                class="notice-message"
                            >

                                নোটিশ লোড করা যাচ্ছে না।

                                <br>

                                <small>
                                    Please try again later.
                                </small>

                            </div>

                        `;

                        return;
                    }


                    const notices =
                        data || [];


                    count.textContent =
                        notices.length;



                    /* =====================================
                       EMPTY
                    ===================================== */

                    if (!notices.length) {

                        grid.innerHTML = `

                            <div
                                class="notice-message"
                            >

                                📢

                                <br><br>

                                এখনো কোনো অফিসিয়াল
                                নোটিশ প্রকাশ করা হয়নি।

                            </div>

                        `;

                        return;
                    }



                    /* =====================================
                       RENDER
                    ===================================== */

                    grid.innerHTML =

                        notices
                            .map(
                                (
                                    notice,
                                    index
                                ) => {


                                    const title =
                                        escapeHTML(
                                            notice.title
                                        );


                                    const description =
                                        escapeHTML(
                                            notice.description
                                        );


                                    const category =
                                        escapeHTML(
                                            notice.category ||
                                            "OFFICIAL NOTICE"
                                        );


                                    const date =
                                        formatDate(
                                            notice.notice_date
                                        );


                                    const image =
                                        notice.image_url
                                            ? `

                                                <img
                                                    class="notice-image"
                                                    src="${escapeHTML(
                                                        notice.image_url
                                                    )}"
                                                    alt="${title}"
                                                    loading="lazy"
                                                >

                                              `
                                            : "";


                                    const attachment =
                                        notice.attachment_url
                                            ? `

                                                <a
                                                    class="notice-attachment"
                                                    href="${escapeHTML(
                                                        notice.attachment_url
                                                    )}"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                >
                                                    📄
                                                    View Attachment
                                                </a>

                                              `
                                            : "";


                                    return `

                                        <article
                                            class="
                                                notice-card
                                                ${notice.important
                                                    ? "important"
                                                    : ""}
                                            "
                                            style="
                                                animation-delay:
                                                ${index * 90}ms;
                                            "
                                        >

                                            <div
                                                class="
                                                    notice-card-top
                                                "
                                            >

                                                <span
                                                    class="
                                                        notice-badge
                                                    "
                                                >
                                                    ${notice.important
                                                        ? "⚠ IMPORTANT"
                                                        : "📢 "
                                                        + category}
                                                </span>


                                                <span
                                                    class="
                                                        notice-date
                                                    "
                                                >
                                                    ${date}
                                                </span>

                                            </div>


                                            <div
                                                class="
                                                    notice-icon
                                                "
                                            >
                                                ${notice.important
                                                    ? "⚠️"
                                                    : "📢"}
                                            </div>


                                            <h2>
                                                ${title}
                                            </h2>


                                            ${
                                                description
                                                    ? `
                                                        <div
                                                            class="
                                                                notice-description
                                                            "
                                                        >
                                                            ${description}
                                                        </div>
                                                      `
                                                    : ""
                                            }


                                            ${image}


                                            ${attachment}

                                        </article>

                                    `;

                                }
                            )
                            .join("");


                } catch (error) {

                    console.error(
                        "Unexpected notice error:",
                        error
                    );

                    grid.innerHTML = `

                        <div
                            class="notice-message"
                        >
                            নোটিশ লোড করা যাচ্ছে না।
                        </div>

                    `;

                }

            }
        );

    </script>


</body>

</html>
