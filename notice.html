<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f5f5f7">

<title>Notice | Ghopkhali Sports Arena</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f5f5f7;

    color: #1d1d1f;

    -webkit-font-smoothing: antialiased;

}


/* =====================================================
   NAVBAR
===================================================== */

.navbar {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 6%;

    background:
        rgba(245,245,247,0.78);

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);

    border-bottom:
        1px solid rgba(0,0,0,0.08);

}


.brand {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: -0.4px;

}


.home-link {

    text-decoration: none;

    color: #0071e3;

    font-size: 15px;

    font-weight: 600;

}


/* =====================================================
   PAGE
===================================================== */

.page {

    width:
        min(100% - 32px, 920px);

    margin:
        0 auto;

    padding:
        60px 0 80px;

}


/* =====================================================
   HEADER
===================================================== */

.page-header {

    text-align: center;

    margin-bottom: 45px;

}


.eyebrow {

    display: inline-block;

    color: #0071e3;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;

    margin-bottom: 12px;

}


.page-header h1 {

    font-size:
        clamp(40px, 7vw, 64px);

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 750;

}


.page-header p {

    margin-top: 15px;

    color: #6e6e73;

    font-size: 16px;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    text-align: center;

    padding: 80px 20px;

    color: #6e6e73;

    font-size: 16px;

}


/* =====================================================
   NOTICE CARD
===================================================== */

.notice-card {

    background:
        rgba(255,255,255,0.82);

    border:
        1px solid rgba(0,0,0,0.07);

    border-radius: 32px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.08);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

}


/* =====================================================
   NOTICE IMAGE
===================================================== */

.notice-image-wrapper {

    width: 100%;

    background: #e9e9eb;

}


.notice-image {

    display: block;

    width: 100%;

    max-height: 580px;

    object-fit: cover;

}


/* =====================================================
   CONTENT
===================================================== */

.notice-content {

    padding:
        clamp(28px, 6vw, 60px);

}


.meta-row {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 9px;

    margin-bottom: 20px;

}


/* =====================================================
   BADGES
===================================================== */

.category-badge {

    display: inline-flex;

    align-items: center;

    min-height: 30px;

    padding:
        6px 13px;

    border-radius: 999px;

    background:
        rgba(0,113,227,0.09);

    color: #0071e3;

    font-size: 12px;

    font-weight: 750;

    letter-spacing: .5px;

}


.important-badge {

    display: inline-flex;

    align-items: center;

    min-height: 30px;

    padding:
        6px 13px;

    border-radius: 999px;

    background:
        rgba(255,59,48,0.10);

    color: #ff3b30;

    font-size: 12px;

    font-weight: 750;

}


.date-badge {

    color: #6e6e73;

    font-size: 13px;

    font-weight: 500;

}


/* =====================================================
   TITLE
===================================================== */

.notice-title {

    font-size:
        clamp(30px, 5vw, 48px);

    line-height: 1.1;

    letter-spacing: -1.8px;

    font-weight: 750;

    margin-bottom: 30px;

}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    width: 100%;

    height: 1px;

    background:
        rgba(0,0,0,0.08);

    margin-bottom: 30px;

}


/* =====================================================
   NOTICE CONTENT
===================================================== */

.notice-text {

    color: #3a3a3c;

    font-size:
        clamp(16px, 2vw, 18px);

    line-height: 1.9;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =====================================================
   FOOTER
===================================================== */

.notice-footer {

    margin-top: 45px;

    padding-top: 25px;

    border-top:
        1px solid rgba(0,0,0,0.07);

    color: #6e6e73;

    font-size: 13px;

}


/* =====================================================
   ERROR
===================================================== */

.error-box {

    background:
        rgba(255,255,255,0.9);

    border:
        1px solid rgba(0,0,0,0.07);

    border-radius: 28px;

    padding: 55px 25px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.07);

}


.error-box h2 {

    font-size: 28px;

    letter-spacing: -1px;

    margin-bottom: 10px;

}


.error-box p {

    color: #6e6e73;

    margin-bottom: 25px;

}


.back-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 44px;

    padding:
        0 22px;

    border-radius: 999px;

    background: #0071e3;

    color: white;

    text-decoration: none;

    font-size: 15px;

    font-weight: 650;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .navbar {

        padding:
            0 20px;

    }


    .brand {

        font-size: 15px;

    }


    .home-link {

        font-size: 14px;

    }


    .page {

        width:
            calc(100% - 20px);

        padding:
            38px 0 60px;

    }


    .page-header {

        margin-bottom: 30px;

    }


    .page-header h1 {

        letter-spacing: -2px;

    }


    .notice-card {

        border-radius: 24px;

    }


    .notice-content {

        padding:
            25px 21px 30px;

    }


    .notice-title {

        font-size: 29px;

        letter-spacing: -1.2px;

    }


    .notice-text {

        font-size: 16px;

        line-height: 1.8;

    }


    .notice-image {

        max-height: 420px;

    }

}


/* =====================================================
   IMAGE ERROR
===================================================== */

.image-error {

    display: none;

    padding: 50px 20px;

    text-align: center;

    color: #6e6e73;

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <div class="brand">
        Ghopkhali Sports Arena
    </div>

    <a
        href="index.html"
        class="home-link"
    >
        ← Home
    </a>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <div class="eyebrow">
            GSA Official
        </div>

        <h1>
            Notice
        </h1>

        <p>
            Official announcements from Ghopkhali Sports Arena
        </p>

    </section>


    <!-- NOTICE -->

    <div id="noticeContainer">

        <div class="loading">
            Loading notice...
        </div>

    </div>


</main>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://cmygmswzokyrmgdnuszq.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENT
===================================================== */

const noticeContainer =
    document.getElementById(
        "noticeContainer"
    );


/* =====================================================
   GET NOTICE ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const noticeId =
    params.get("id");


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    if (!date) {
        return "";
    }

    return new Date(date).toLocaleDateString(
        "bn-BD",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   LOAD NOTICE
===================================================== */

async function loadNotice() {

    if (!noticeId) {

        showError(
            "নোটিশ পাওয়া যায়নি",
            "এই নোটিশের কোনো ID পাওয়া যায়নি।"
        );

        return;

    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("notices")

            .select(`
                id,
                title,
                content,
                category,
                image_url,
                published,
                created_at,
                updated_at,
                important
            `)

            .eq("id", noticeId)

            .eq("published", true)

            .single();


        if (error || !data) {

            console.error(
                "Notice error:",
                error
            );

            showError(
                "নোটিশ পাওয়া যায়নি",
                "এই নোটিশটি বর্তমানে প্রকাশিত নয় অথবা পাওয়া যায়নি।"
            );

            return;

        }


        renderNotice(data);


    } catch (error) {

        console.error(error);

        showError(
            "সমস্যা হয়েছে",
            "নোটিশটি লোড করা সম্ভব হয়নি।"
        );

    }

}


/* =====================================================
   RENDER NOTICE
===================================================== */

function renderNotice(notice) {


    const category =
        notice.category
            ? escapeHTML(
                notice.category
                    .replace(/_/g, " ")
            )
            : "NOTICE";


    const importantBadge =
        notice.important
            ? `
                <span class="important-badge">
                    ★ Important Notice
                </span>
              `
            : "";


    const imageHTML =
        notice.image_url
            ? `
                <div class="notice-image-wrapper">

                    <img
                        class="notice-image"
                        src="${escapeHTML(notice.image_url)}"
                        alt="${escapeHTML(notice.title)}"
                        onerror="this.parentElement.style.display='none';"
                    >

                </div>
              `
            : "";


    noticeContainer.innerHTML = `

        <article class="notice-card">

            ${imageHTML}

            <div class="notice-content">

                <div class="meta-row">

                    <span class="category-badge">

                        ${category}

                    </span>

                    ${importantBadge}

                    <span class="date-badge">

                        ${formatDate(
                            notice.created_at
                        )}

                    </span>

                </div>


                <h2 class="notice-title">

                    ${escapeHTML(
                        notice.title
                    )}

                </h2>


                <div class="divider"></div>


                <div class="notice-text">

                    ${escapeHTML(
                        notice.content || ""
                    )}

                </div>


                <div class="notice-footer">

                    Ghopkhali Sports Arena
                    · Official Notice

                </div>

            </div>

        </article>

    `;


    document.title =
        `${notice.title} | Ghopkhali Sports Arena`;

}


/* =====================================================
   ERROR
===================================================== */

function showError(title, message) {

    noticeContainer.innerHTML = `

        <div class="error-box">

            <h2>
                ${escapeHTML(title)}
            </h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <a
                href="index.html"
                class="back-button"
            >
                ← হোমপেজে ফিরে যান
            </a>

        </div>

    `;

}


/* =====================================================
   START
===================================================== */

loadNotice();

</script>


</body>

</html>
