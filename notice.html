<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#f5f5f7"
>

<title>Notice | Ghopkhali Sports Arena</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f5f7;
    --card: rgba(255,255,255,.78);
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --border: rgba(0,0,0,.08);
    --blue: #0071e3;
    --shadow:
        0 20px 60px rgba(0,0,0,.08);
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            rgba(0,113,227,.08),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    -webkit-font-smoothing: antialiased;
}


/* ===============================
   NAVBAR
================================ */

.navbar {

    position: sticky;

    top: 0;

    z-index: 100;

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 6%;

    background:
        rgba(245,245,247,.78);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid var(--border);
}

.brand {

    font-size: 18px;

    font-weight: 700;

    letter-spacing: -.4px;

}

.back-btn {

    text-decoration: none;

    color: var(--blue);

    font-size: 15px;

    font-weight: 600;

}


/* ===============================
   MAIN
================================ */

.page {

    width: min(
        100% - 32px,
        900px
    );

    margin: 0 auto;

    padding:
        55px 0 80px;
}


/* ===============================
   HEADER
================================ */

.page-header {

    text-align: center;

    margin-bottom: 45px;
}

.eyebrow {

    color: var(--blue);

    font-size: 13px;

    font-weight: 700;

    letter-spacing: .8px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.page-header h1 {

    font-size:
        clamp(34px, 7vw, 58px);

    line-height: 1.05;

    letter-spacing: -2.5px;

    font-weight: 750;
}

.page-header p {

    margin-top: 14px;

    color: var(--secondary);

    font-size: 16px;
}


/* ===============================
   LOADING
================================ */

.loading {

    text-align: center;

    padding: 80px 20px;

    color: var(--secondary);
}


/* ===============================
   NOTICE CARD
================================ */

.notice-card {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 30px;

    overflow: hidden;

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

}


/* ===============================
   IMAGE
================================ */

.notice-image {

    width: 100%;

    max-height: 560px;

    object-fit: cover;

    display: block;

    background: #e9e9eb;
}


/* ===============================
   CONTENT
================================ */

.notice-content {

    padding:
        clamp(25px, 5vw, 55px);
}

.notice-date {

    color: var(--blue);

    font-size: 14px;

    font-weight: 650;

    margin-bottom: 15px;
}

.notice-title {

    font-size:
        clamp(28px, 5vw, 46px);

    line-height: 1.08;

    letter-spacing: -1.5px;

    margin-bottom: 28px;
}

.notice-text {

    color: #3a3a3c;

    font-size: 17px;

    line-height: 1.85;

    white-space: pre-wrap;

    word-break: break-word;
}


/* ===============================
   ERROR
================================ */

.error-box {

    background: #fff;

    border:
        1px solid rgba(255,59,48,.15);

    border-radius: 24px;

    padding: 40px 25px;

    text-align: center;

    box-shadow: var(--shadow);
}

.error-box h2 {

    font-size: 25px;

    margin-bottom: 10px;
}

.error-box p {

    color: var(--secondary);

    margin-bottom: 25px;
}

.home-btn {

    display: inline-block;

    background: var(--blue);

    color: #fff;

    text-decoration: none;

    padding:
        12px 22px;

    border-radius: 999px;

    font-weight: 650;
}


/* ===============================
   FOOTER
================================ */

.footer {

    text-align: center;

    color: var(--secondary);

    font-size: 13px;

    margin-top: 45px;
}


/* ===============================
   MOBILE
================================ */

@media (max-width: 600px) {

    .navbar {
        padding: 0 20px;
    }

    .brand {
        font-size: 16px;
    }

    .page {
        width: min(
            100% - 20px,
            900px
        );

        padding-top: 35px;
    }

    .page-header {
        margin-bottom: 30px;
    }

    .page-header h1 {
        letter-spacing: -1.5px;
    }

    .notice-card {
        border-radius: 22px;
    }

    .notice-content {
        padding: 25px 21px 32px;
    }

    .notice-text {
        font-size: 16px;
        line-height: 1.75;
    }

}

</style>

</head>


<body>


<header class="navbar">

    <div class="brand">
        Ghopkhali Sports Arena
    </div>

    <a
        href="index.html"
        class="back-btn"
    >
        ← Home
    </a>

</header>


<main class="page">


    <section class="page-header">

        <div class="eyebrow">
            GSA Official
        </div>

        <h1>
            Notice
        </h1>

        <p>
            Official announcements from Ghopkhali Sports Arena
        </p>

    </section>


    <div id="noticeContainer">

        <div class="loading">
            Loading notice...
        </div>

    </div>


    <div class="footer">

        © Ghopkhali Sports Arena

    </div>


</main>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const noticeContainer =
    document.getElementById(
        "noticeContainer"
    );


/* ==========================================
   NOTICE ID
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const noticeId =
    params.get("id");


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(date) {

    return new Date(date).toLocaleDateString(
        "en-BD",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* ==========================================
   LOAD NOTICE
========================================== */

async function loadNotice() {

    if (!noticeId) {

        showError(
            "Notice not found",
            "No notice ID was provided."
        );

        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from("notices")

                .select(`
                    id,
                    title,
                    content,
                    image_url,
                    created_at
                `)

                .eq("id", noticeId)

                .eq("published", true)

                .single();


        if (error) {

            console.error(error);

            showError(
                "Notice unavailable",
                "This notice could not be found."
            );

            return;
        }


        renderNotice(data);


    } catch (error) {

        console.error(error);

        showError(
            "Something went wrong",
            "Please try again later."
        );

    }

}


/* ==========================================
   RENDER
========================================== */

function renderNotice(notice) {

    const imageHTML =
        notice.image_url
            ? `
                <img
                    class="notice-image"
                    src="${escapeAttribute(notice.image_url)}"
                    alt="${escapeAttribute(notice.title)}"
                    loading="lazy"
                >
              `
            : "";


    noticeContainer.innerHTML = `

        <article class="notice-card">

            ${imageHTML}

            <div class="notice-content">

                <div class="notice-date">

                    ${formatDate(notice.created_at)}

                </div>

                <h2 class="notice-title">

                    ${escapeHTML(notice.title)}

                </h2>

                <div class="notice-text">

                    ${escapeHTML(
                        notice.content || ""
                    )}

                </div>

            </div>

        </article>

    `;


    document.title =
        notice.title +
        " | Ghopkhali Sports Arena";

}


/* ==========================================
   ERROR
========================================== */

function showError(title, message) {

    noticeContainer.innerHTML = `

        <div class="error-box">

            <h2>
                ${escapeHTML(title)}
            </h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <a
                href="index.html"
                class="home-btn"
            >
                Back to Home
            </a>

        </div>

    `;

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* ==========================================
   START
========================================== */

loadNotice();

</script>


</body>

</html>
