<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tournament Details | Ghopkhali Sports Arena</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #111;
        }

        .page {
            width: min(1100px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        .tournament-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .poster {
            width: 100%;
            background: #eee;
        }

        .poster img {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 35px;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 30px;
            background: #111;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 52px);
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .description {
            color: #555;
            line-height: 1.8;
            white-space: pre-line;
            margin-bottom: 30px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-box {
            background: #f6f6f6;
            border-radius: 15px;
            padding: 18px;
        }

        .detail-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
        }

        .loading,
        .error {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .error strong {
            display: block;
            color: #111;
            font-size: 22px;
            margin-bottom: 10px;
        }

        @media (max-width: 650px) {

            .page {
                width: 94%;
                padding-top: 20px;
            }

            .content {
                padding: 24px 20px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <main class="page">

        <a
            href="index.html#fixtures"
            class="back-button"
        >
            ← Back to Tournaments
        </a>


        <div id="tournamentContainer">

            <div class="loading">
                Loading tournament...
            </div>

        </div>

    </main>


    <script>

        const SUPABASE_URL =
            "https://cmygmswzokyrmgdnuszq.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        const container =
            document.getElementById(
                "tournamentContainer"
            );


        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function getTournamentId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("id");

        }


        async function loadTournament() {

            const id =
                getTournamentId();


            if (!id) {

                container.innerHTML = `
                    <div class="error">

                        <strong>
                            Tournament not found
                        </strong>

                        No tournament ID was provided.

                    </div>
                `;

                return;
            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("tournaments")
                        .select("*")
                        .eq("id", id)
                        .eq("published", true)
                        .single();


                if (error) {
                    throw error;
                }


                if (!data) {

                    throw new Error(
                        "Tournament not found."
                    );

                }


                const poster =
                    data.image_url ||
                    data.poster_url ||
                    "gsa.png";


                document.title =
                    `${data.name || "Tournament"} | Ghopkhali Sports Arena`;


                container.innerHTML = `

                    <article class="tournament-card">

                        <div class="poster">

                            <img
                                src="${escapeHTML(poster)}"
                                alt="${escapeHTML(
                                    data.name ||
                                    "Tournament Poster"
                                )}"
                            >

                        </div>


                        <div class="content">

                            <span class="status">
                                ${escapeHTML(
                                    data.status ||
                                    "UPCOMING"
                                )}
                            </span>


                            <h1>
                                ${escapeHTML(
                                    data.name ||
                                    "Tournament"
                                )}
                            </h1>


                            ${
                                data.description
                                    ? `
                                    <div class="description">
                                        ${escapeHTML(
                                            data.description
                                        )}
                                    </div>
                                    `
                                    : ""
                            }


                            <div class="details">

                                ${
                                    data.season
                                        ? `
                                        <div class="detail-box">

                                            <span class="detail-label">
                                                Season
                                            </span>

                                            <span class="detail-value">
                                                ${escapeHTML(
                                                    data.season
                                                )}
                                            </span>

                                        </div>
                                        `
                                        : ""
                                }


                                ${
                                    data.venue
                                        ? `
                                        <div class="detail-box">

                                            <span class="detail-label">
                                                Venue
                                            </span>

                                            <span class="detail-value">
                                                ${escapeHTML(
                                                    data.venue
                                                )}
                                            </span>

                                        </div>
                                        `
                                        : ""
                                }


                                ${
                                    data.date_details
                                        ? `
                                        <div class="detail-box">

                                            <span class="detail-label">
                                                Date
                                            </span>

                                            <span class="detail-value">
                                                ${escapeHTML(
                                                    data.date_details
                                                )}
                                            </span>

                                        </div>
                                        `
                                        : ""
                                }


                                ${
                                    data.start_date
                                        ? `
                                        <div class="detail-box">

                                            <span class="detail-label">
                                                Start Date
                                            </span>

                                            <span class="detail-value">
                                                ${escapeHTML(
                                                    data.start_date
                                                )}
                                            </span>

                                        </div>
                                        `
                                        : ""
                                }


                                ${
                                    data.end_date
                                        ? `
                                        <div class="detail-box">

                                            <span class="detail-label">
                                                End Date
                                            </span>

                                            <span class="detail-value">
                                                ${escapeHTML(
                                                    data.end_date
                                                )}
                                            </span>

                                        </div>
                                        `
                                        : ""
                                }

                            </div>

                        </div>

                    </article>

                `;

            } catch (error) {

                console.error(
                    "Tournament details error:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        <strong>
                            Unable to load tournament
                        </strong>

                        ${escapeHTML(
                            error.message ||
                            "Something went wrong."
                        )}

                    </div>

                `;

            }

        }


        loadTournament();

    </script>

</body>

</html>
