name: Build Ghopkhali Sports Arena APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir apk-app
          cd apk-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Copy website
        run: |
          mkdir -p apk-app/www
          cp index.html apk-app/www/
          cp style.css apk-app/www/
          cp script.js apk-app/www/
          cp -r Images apk-app/www/ || true
          cp -r admin apk-app/www/ || true
          cp about.html apk-app/www/ || true
          cp activities.html apk-app/www/ || true
          cp club-membership-application.html apk-app/www/ || true
          cp committee.html apk-app/www/ || true
          cp complaint.html apk-app/www/ || true
          cp fixture.html apk-app/www/ || true
          cp friendly-match.html apk-app/www/ || true
          cp notice.html apk-app/www/ || true
          cp point-table.html apk-app/www/ || true
          cp rules.html apk-app/www/ || true
          cp tournament-details.html apk-app/www/ || true
          cp gsa.png apk-app/www/ || true
          cp advisor.jpg apk-app/www/ || true
          cp president.jpeg apk-app/www/ || true
          cp secretary.jpg apk-app/www/ || true

      - name: Create Capacitor configuration
        working-directory: ./apk-app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ghopkhalisportsarena.app",
            "appName": "Ghopkhali Sports Arena",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        working-directory: ./apk-app
        run: npx cap add android

      - name: Sync website with Android
        working-directory: ./apk-app
        run: npx cap sync android

      - name: Build APK
        working-directory: ./apk-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghopkhali-Sports-Arena-APK
          path: apk-app/android/app/build/outputs/apk/debug/app-debug.apk
