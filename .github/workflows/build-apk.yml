name: Build Ghopkhali Ludo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: ./ludo-app
        run: npm ci

      - name: Sync Capacitor
        working-directory: ./ludo-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./ludo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghopkhali-Ludo-APK
          path: ludo-app/android/app/build/outputs/apk/debug/app-debug.apk
