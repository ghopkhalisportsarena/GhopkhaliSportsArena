name: Build Ghopkhali Sports Arena APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Capacitor project
        run: |
          mkdir apk-app
          cd apk-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/assets

      - name: Copy main website
        run: |
          mkdir -p apk-app/www
          rsync -av ./ apk-app/www/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='apk-app' \
            --exclude='ludo-app' \
            --exclude='node_modules'

      - name: Create Capacitor configuration
        working-directory: ./apk-app
        run: |
          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.ghopkhalisportsarena.app",
            "appName": "Ghopkhali Sports Arena",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          CONFIG

      - name: Add Android platform
        working-directory: ./apk-app
        run: npx cap add android

      - name: Generate app icon
        working-directory: ./apk-app
        run: |
          mkdir -p resources
          cp www/gsa.png resources/icon.png
          npx capacitor-assets generate --android

      - name: Sync website and plugins
        working-directory: ./apk-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./apk-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp apk-app/android/app/build/outputs/apk/debug/app-debug.apk Ghopkhali-Sports-Arena.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghopkhali-Sports-Arena-APK
          path: Ghopkhali-Sports-Arena.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ghopkhali Sports Arena APK
          prerelease: false
          make_latest: true
          files: Ghopkhali-Sports-Arena.apk
