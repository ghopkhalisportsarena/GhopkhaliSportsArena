<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Friendly Match Application | Ghopkhali Sports Arena
    </title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #111;
        }

        .page {
            width: min(850px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        .form-container {
            background: #fff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .08);
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .intro {
            color: #666;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font: inherit;
            outline: none;
            background: #fff;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            background: #111;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-button:hover {
            opacity: .9;
        }

        .submit-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #eaf7ee;
            color: #176b35;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #a11;
        }

        @media (max-width: 600px) {

            .page {
                width: 94%;
                padding-top: 20px;
            }

            .form-container {
                padding: 24px 20px;
                border-radius: 20px;
            }

        }

    </style>

</head>


<body>

    <main class="page">


        <a
            href="index.html#club-services"
            class="back-button"
        >
            ← Back to Club Services
        </a>


        <section class="form-container">


            <div class="label">
                GHOPKHALI SPORTS ARENA
            </div>


            <h1>
                Friendly Match
                Application
            </h1>


            <p class="intro">
                External clubs and teams can submit an official
                application to arrange a friendly match with
                Ghopkhali Sports Arena.
            </p>


            <form id="friendlyMatchForm">


                <!-- TEAM -->

                <div class="form-group">

                    <label for="teamName">
                        Team / Club Name *
                    </label>

                    <input
                        type="text"
                        id="teamName"
                        required
                        placeholder="Enter your team or club name"
                    >

                </div>


                <!-- CONTACT PERSON -->

                <div class="form-group">

                    <label for="contactPerson">
                        Contact Person *
                    </label>

                    <input
                        type="text"
                        id="contactPerson"
                        required
                        placeholder="Full name"
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Contact Number *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="01XXXXXXXXX"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                    >

                </div>


                <!-- SPORT -->

                <div class="form-group">

                    <label for="sport">
                        Sport *
                    </label>

                    <select
                        id="sport"
                        required
                    >

                        <option value="">
                            Select Sport
                        </option>

                        <option value="Football">
                            Football
                        </option>

                        <option value="Cricket">
                            Cricket
                        </option>

                    </select>

                </div>


                <!-- PLAYERS -->

                <div class="form-group">

                    <label for="players">
                        Number of Players *
                    </label>

                    <input
                        type="number"
                        id="players"
                        min="1"
                        required
                        placeholder="Enter number of players"
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="preferredDate">
                        Preferred Match Date *
                    </label>

                    <input
                        type="date"
                        id="preferredDate"
                        required
                    >

                </div>


                <!-- TIME -->

                <div class="form-group">

                    <label for="preferredTime">
                        Preferred Match Time
                    </label>

                    <input
                        type="time"
                        id="preferredTime"
                    >

                </div>


                <!-- VENUE -->

                <div class="form-group">

                    <label for="venue">
                        Preferred Venue
                    </label>

                    <input
                        type="text"
                        id="venue"
                        placeholder="Example: GSA Ground"
                    >

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Additional Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Tell us about your team, opponent, match requirements, etc."
                    ></textarea>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="submitButton"
                    class="submit-button"
                >
                    Submit Application
                </button>


                <!-- RESULT -->

                <div
                    id="formMessage"
                    class="message"
                ></div>


            </form>


        </section>


    </main>


    <script>

        // ==================================================
        // SUPABASE CONFIG
        // ==================================================

        const SUPABASE_URL =
            "https://cmygmswzokyrmgdnuszq.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        // ==================================================
        // ELEMENTS
        // ==================================================

        const form =
            document.getElementById(
                "friendlyMatchForm"
            );

        const submitButton =
            document.getElementById(
                "submitButton"
            );

        const formMessage =
            document.getElementById(
                "formMessage"
            );


        // ==================================================
        // SUBMIT
        // ==================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // ------------------------------------------
                // GET VALUES
                // ------------------------------------------

                const teamName =
                    document.getElementById(
                        "teamName"
                    ).value.trim();

                const contactPerson =
                    document.getElementById(
                        "contactPerson"
                    ).value.trim();

                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const sport =
                    document.getElementById(
                        "sport"
                    ).value;

                const players =
                    document.getElementById(
                        "players"
                    ).value;

                const preferredDate =
                    document.getElementById(
                        "preferredDate"
                    ).value;

                const preferredTime =
                    document.getElementById(
                        "preferredTime"
                    ).value;

                const venue =
                    document.getElementById(
                        "venue"
                    ).value.trim();

                const message =
                    document.getElementById(
                        "message"
                    ).value.trim();


                // ------------------------------------------
                // SHOW LOADING
                // ------------------------------------------

                submitButton.disabled = true;

                submitButton.textContent =
                    "Submitting...";


                formMessage.className =
                    "message";

                formMessage.style.display =
                    "block";

                formMessage.textContent =
                    "Submitting your application...";


                try {


                    // --------------------------------------
                    // COMBINE SPORT INFORMATION
                    // --------------------------------------

                    const fullMessage =
                        `Sport: ${sport}\n` +
                        `Number of Players: ${players}\n` +
                        `Additional Message: ${
                            message || "N/A"
                        }`;


                    // --------------------------------------
                    // INSERT
                    // --------------------------------------

                    const { error } =
                        await supabaseClient
                            .from(
                                "friendly_applications"
                            )
                            .insert({

                                team_name:
                                    teamName,

                                contact_person:
                                    contactPerson,

                                phone:
                                    phone,

                                email:
                                    email || null,

                                preferred_date:
                                    preferredDate,

                                preferred_time:
                                    preferredTime ||
                                    null,

                                venue:
                                    venue ||
                                    null,

                                message:
                                    fullMessage,

                                status:
                                    "pending"

                            });


                    // --------------------------------------
                    // SUPABASE ERROR
                    // --------------------------------------

                    if (error) {
                        throw error;
                    }


                    // --------------------------------------
                    // SUCCESS
                    // --------------------------------------

                    formMessage.className =
                        "message success";

                    formMessage.textContent =
                        "Application submitted successfully. Ghopkhali Sports Arena will review your application.";


                    // Clear form

                    form.reset();


                } catch (error) {


                    console.error(
                        "Friendly Match Application Error:",
                        error
                    );


                    formMessage.className =
                        "message error";

                    formMessage.textContent =
                        "Unable to submit application. " +
                        (
                            error.message ||
                            "Please try again."
                        );


                } finally {


                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Submit Application";

                }

            }
        );

    </script>

</body>

</html>
