<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friendly Match Application | Ghopkhali Sports Arena</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #111;
        }

        .page {
            width: min(850px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        .form-container {
            background: #fff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .08);
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .intro {
            color: #666;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font: inherit;
            outline: none;
            background: #fff;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            background: #111;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-button:hover {
            opacity: .9;
        }

        .message {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block;
            background: #eaf7ee;
            color: #176b35;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #a11;
        }

        @media (max-width: 600px) {

            .page {
                width: 94%;
                padding-top: 20px;
            }

            .form-container {
                padding: 24px 20px;
                border-radius: 20px;
            }

        }
    </style>
</head>

<body>

    <main class="page">

        <a href="index.html#club-services" class="back-button">
            ← Back to Club Services
        </a>

        <section class="form-container">

            <div class="label">
                GHOPKHALI SPORTS ARENA
            </div>

            <h1>
                Friendly Match
                Application
            </h1>

            <p class="intro">
                External clubs and teams can submit an official
                application to arrange a friendly match with
                Ghopkhali Sports Arena.
            </p>

            <form id="friendlyMatchForm">

    <!-- TEAM / CLUB NAME -->
    <div class="form-group">

        <label for="teamName">
            Team / Club Name *
        </label>

        <input
            type="text"
            id="teamName"
            name="teamName"
            placeholder="Enter your team or club name"
            required
        >

    </div>


    <!-- CONTACT PERSON -->
    <div class="form-group">

        <label for="contactPerson">
            Contact Person *
        </label>

        <input
            type="text"
            id="contactPerson"
            name="contactPerson"
            placeholder="Full name"
            required
        >

    </div>


    <!-- PHONE -->
    <div class="form-group">

        <label for="phone">
            Contact Number *
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="01XXXXXXXXX"
            required
        >

    </div>


    <!-- EMAIL -->
    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
        >

    </div>


    <!-- SPORT -->
    <div class="form-group">

        <label for="sport">
            Sport *
        </label>

        <select
            id="sport"
            name="sport"
            required
        >

            <option value="">
                Select Sport
            </option>

            <option value="Football">
                Football
            </option>

            <option value="Cricket">
                Cricket
            </option>

        </select>

    </div>


    <!-- NUMBER OF PLAYERS -->
    <div class="form-group">

        <label for="players">
            Number of Players *
        </label>

        <input
            type="number"
            id="players"
            name="players"
            min="1"
            placeholder="Enter number of players"
            required
        >

    </div>


    <!-- PREFERRED DATE -->
    <div class="form-group">

        <label for="preferredDate">
            Preferred Match Date *
        </label>

        <input
            type="date"
            id="preferredDate"
            name="preferredDate"
            required
        >

    </div>


    <!-- PREFERRED TIME -->
    <div class="form-group">

        <label for="preferredTime">
            Preferred Match Time
        </label>

        <input
            type="time"
            id="preferredTime"
            name="preferredTime"
        >

    </div>


    <!-- VENUE -->
    <div class="form-group">

        <label for="venue">
            Preferred Venue
        </label>

        <input
            type="text"
            id="venue"
            name="venue"
            placeholder="Example: GSA Ground"
        >

    </div>


    <!-- ADDITIONAL MESSAGE -->
    <div class="form-group">

        <label for="message">
            Additional Message
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="Tell us about your team, opponent, match requirements, etc."
        ></textarea>

    </div>


    <!-- SUBMIT -->
    <button
        type="submit"
        class="submit-button"
    >
        Submit Application
    </button>


    <!-- MESSAGE -->
    <div
        id="formMessage"
        class="message"
    ></div>

</form>
        </section>

    </main>

    <script>

alert("Friendly Match JavaScript is working!");

const SUPABASE_URL =
    "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

const form =
    document.getElementById("friendlyMatchForm");

const formMessage =
    document.getElementById("formMessage");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const submitButton =
        form.querySelector("button[type='submit']");

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    formMessage.className = "message";
    formMessage.style.display = "block";
    formMessage.textContent = "Submitting application...";

    try {

        const teamName =
            document.getElementById("teamName").value.trim();

        const contactPerson =
            document.getElementById("contactPerson").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const sport =
            document.getElementById("sport").value;

        const players =
            document.getElementById("players").value;

        const preferredDate =
            document.getElementById("preferredDate").value;

        const preferredTime =
            document.getElementById("preferredTime").value;

        const venue =
            document.getElementById("venue").value.trim();

        const message =
            document.getElementById("message").value.trim();


        if (
            !teamName ||
            !contactPerson ||
            !phone ||
            !sport ||
            !players ||
            !preferredDate
        ) {
            throw new Error(
                "Please fill in all required fields."
            );
        }


        const fullMessage =
            `Sport: ${sport}\n` +
            `Number of Players: ${players}\n` +
            `Additional Message: ${message || "N/A"}`;


        const { data, error } =
            await supabaseClient
                .from("friendly_applications")
                .insert({
                    team_name: teamName,
                    contact_person: contactPerson,
                    phone: phone,
                    email: email || null,
                    preferred_date: preferredDate,
                    preferred_time: preferredTime || null,
                    venue: venue || null,
                    message: fullMessage,
                    status: "pending"
                })
                .select();


        if (error) {
            console.error("SUPABASE ERROR:", error);
            throw new Error(
                error.message ||
                "Supabase submission failed."
            );
        }


        console.log(
            "APPLICATION SAVED:",
            data
        );


        formMessage.className =
            "message success";

        formMessage.style.display = "block";

        formMessage.textContent =
            "Application submitted successfully!";


        form.reset();


    } catch (error) {

        console.error(
            "FRIENDLY APPLICATION ERROR:",
            error
        );

        formMessage.className =
            "message error";

        formMessage.style.display = "block";

        formMessage.textContent =
            "Submission failed: " +
            error.message;


    } finally {

        submitButton.disabled = false;

        submitButton.textContent =
            "Submit Application";

    }

});

</script>

</body>

</html>
