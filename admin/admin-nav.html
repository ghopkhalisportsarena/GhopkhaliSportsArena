<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#111111"
>

<title>GSA Admin Navigation</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #111;
}


/* =========================================
   SIDEBAR
========================================= */

.admin-sidebar {

  width: 270px;
  min-height: 100vh;

  background: #111;
  color: #fff;

  padding: 24px 16px;

  display: flex;
  flex-direction: column;

  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;

  z-index: 1000;

}


/* =========================================
   BRAND
========================================= */

.admin-brand {

  display: flex;
  align-items: center;

  gap: 12px;

  padding: 8px 10px 24px;

  border-bottom: 1px solid #292929;

  text-decoration: none;
  color: #fff;

}

.admin-brand-logo {

  width: 44px;
  height: 44px;

  border-radius: 50%;

  background: #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

}

.admin-brand-logo img {

  width: 100%;
  height: 100%;

  object-fit: contain;

}

.admin-brand-text strong {

  display: block;

  font-size: 13px;

  letter-spacing: 1px;

}

.admin-brand-text span {

  display: block;

  color: #888;

  font-size: 9px;

  letter-spacing: 1.5px;

  margin-top: 4px;

}


/* =========================================
   NAVIGATION
========================================= */

.nav-title {

  color: #666;

  font-size: 9px;

  font-weight: 700;

  letter-spacing: 2px;

  padding: 24px 12px 9px;

}


.admin-nav {

  display: flex;

  flex-direction: column;

  gap: 4px;

}


.admin-nav a {

  display: flex;

  align-items: center;

  gap: 12px;

  min-height: 45px;

  padding: 0 12px;

  color: #aaa;

  text-decoration: none;

  border-radius: 8px;

  font-size: 12px;

  transition: .2s ease;

}


.admin-nav a:hover {

  background: #1f1f1f;

  color: #fff;

}


.admin-nav a.active {

  background: #fff;

  color: #111;

}


/* =========================================
   ICON
========================================= */

.nav-icon {

  width: 25px;

  text-align: center;

  font-size: 15px;

  flex-shrink: 0;

}


.nav-text {

  flex: 1;

}


/* =========================================
   APPLICATIONS
========================================= */

.application-link {

  position: relative;

}


.application-badge {

  min-width: 20px;

  height: 20px;

  padding: 0 5px;

  border-radius: 10px;

  background: #d71920;

  color: #fff;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 9px;

  font-weight: 700;

}


/* =========================================
   DIVIDER
========================================= */

.nav-divider {

  height: 1px;

  background: #292929;

  margin: 15px 8px;

}


/* =========================================
   BOTTOM
========================================= */

.admin-sidebar-bottom {

  margin-top: auto;

}


.profile-link {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px;

  color: #aaa;

  text-decoration: none;

  border-radius: 8px;

}


.profile-link:hover {

  background: #1f1f1f;

  color: #fff;

}


.profile-avatar {

  width: 34px;
  height: 34px;

  border-radius: 50%;

  background: #fff;

  color: #111;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 12px;

  font-weight: 700;

}


.profile-info {

  overflow: hidden;

}


.profile-info strong {

  display: block;

  color: #fff;

  font-size: 11px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.profile-info span {

  display: block;

  color: #777;

  font-size: 9px;

  margin-top: 3px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

  .admin-sidebar {

    width: 240px;

    transform: translateX(-100%);

    transition: transform .25s ease;

  }

  .admin-sidebar.open {

    transform: translateX(0);

  }

}

</style>

</head>


<body>


<aside
  class="admin-sidebar"
  id="adminSidebar"
>


<!-- =======================================

======================================== -->

<a

<!-- =======================================

======================================== -->

<div class="nav-title">

<nav class="admin-nav">

<!-- =======================================

<div class="nav-title">

<nav class="admin-nav">


<a

</nav>


<!-- =======================================
     SYSTEM
======================================== -->

<div class="nav-title">
  SYSTEM
</div>


<nav class="admin-nav">


<a
  href="admin-users.html"

  <span class="nav-icon">♙</span>

</nav>


<div class="nav-divider"></div>


<!-- =======================================
     BOTTOM PROFILE
======================================== -->

<div class="admin-sidebar-bottom">


<a
  href="admin-profile.html"
  class="profile-link"
>

  <div
    class="profile-avatar"
    id="profileAvatar"
  >
    A
  </div>


  <div class="profile-info">

    <strong id="profileName">
      Administrator
    </strong>

    <span>

    </span>

</a>

</div>


</aside>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   ACTIVE PAGE
========================================= */

const currentPage =
  location.pathname
    .split("/")
    .pop();


document
  .querySelectorAll(".admin-nav a")
  .forEach(link => {

    const href =
      link.getAttribute("href");

    if (
      href === currentPage
    ) {

      link.classList.add("active");

    }

  });


/* =========================================
   LOAD USER
========================================= */

async function loadAdminProfile() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (error || !data.user) {

      return;

    }


    const email =
      data.user.email ||
      "Administrator";


    const name =
      email.split("@")[0] ||
      "Administrator";


    const nameElement =
      document.getElementById(
        "profileName"
      );


    const avatarElement =
      document.getElementById(
        "profileAvatar"
      );


    if (nameElement) {

      nameElement.textContent =
        name;

    }


    if (avatarElement) {

      avatarElement.textContent =
        name
          .charAt(0)
          .toUpperCase();

    }

  } catch (error) {

    console.error(
      "Profile loading error:",
      error
    );

  }

}


loadAdminProfile();


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "SIGNED_OUT"
    ) {

      window.location.replace(
        "admin-login.html"
      );

    }

  }
);

</script>

</body>

</html>
