<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">

  <title>Admin Leadership | Ghopkhali Sports Arena</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .admin-topbar h1 {
      margin: 5px 0 0;
    }

    .admin-topbar h1 span {
      color: #d71920;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-button {
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .admin-button-dark {
      background: #111;
      color: #fff;
    }

    .admin-button-outline {
      background: transparent;
      color: #111;
      border: 1px solid #ccc;
    }

    .admin-button-danger {
      background: #d71920;
      color: #fff;
    }

    .leadership-admin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .leader-admin-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .leader-admin-photo {
      height: 300px;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .leader-admin-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .leader-admin-placeholder {
      font-size: 50px;
      font-weight: 800;
      color: #bbb;
    }

    .leader-admin-content {
      padding: 22px;
    }

    .leader-admin-number {
      font-size: 12px;
      font-weight: 800;
      color: #999;
    }

    .leader-admin-role {
      margin: 8px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #d71920;
    }

    .leader-admin-content h3 {
      margin: 0 0 5px;
      font-size: 23px;
    }

    .leader-admin-club {
      color: #777;
      font-size: 14px;
    }

    .leader-admin-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .leader-admin-actions button {
      flex: 1;
      border: 0;
      padding: 11px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .edit-btn {
      background: #111;
      color: #fff;
    }

    .delete-btn {
      background: #f2f2f2;
      color: #d71920;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 14px;
    }

    .empty-state-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 30px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f1f1f1;
      font-size: 25px;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .full-input {
      grid-column: 1 / -1;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font: inherit;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #111;
    }

    .form-submit {
      margin-top: 22px;
      width: 100%;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
    }

    @media (max-width: 900px) {
      .leadership-admin-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .admin-page-wrap {
        padding: 25px 15px 60px;
      }

      .leadership-admin-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-input {
        grid-column: auto;
      }

      .leader-admin-photo {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-page-wrap">

    <!-- TOP BAR -->
    <div class="admin-topbar">

      <div>
        <p class="section-kicker">GSA ADMIN PANEL</p>

        <h1>
          Club <span>Leadership.</span>
        </h1>

        <p>
          Manage Ghopkhali Sports Arena leadership members.
        </p>
      </div>

      <div class="admin-actions">

        <a
          href="admin-dashboard.html"
          class="admin-button admin-button-outline"
        >
          ← Dashboard
        </a>

        <button
          class="admin-button admin-button-dark"
          id="addLeaderButton"
        >
          + Add Leader
        </button>

      </div>

    </div>


    <!-- LEADERSHIP LIST -->

    <section>

      <div
        id="leadershipAdminGrid"
        class="leadership-admin-grid"
      >

        <div class="loading">
          Loading leadership...
        </div>

      </div>

    </section>

  </main>


  <!-- ADD / EDIT MODAL -->

  <div
    id="leaderModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-box">

      <button
        id="closeLeaderModal"
        class="modal-close"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

      <p class="section-kicker">
        GSA ADMIN
      </p>

      <h2 id="leaderModalTitle">
        Add <span>Leader.</span>
      </h2>


      <form id="leaderForm">

        <input
          type="hidden"
          id="leaderId"
        >


        <div class="form-grid">

          <div class="input-group">

            <label>NAME</label>

            <input
              type="text"
              id="leaderName"
              placeholder="Enter leader name"
              required
            >

          </div>


          <div class="input-group">

            <label>POSITION / ROLE</label>

            <input
              type="text"
              id="leaderRole"
              placeholder="e.g. President"
              required
            >

          </div>


          <div class="input-group">

            <label>ORDER NUMBER</label>

            <input
              type="number"
              id="leaderOrder"
              min="1"
              value="1"
              required
            >

          </div>


          <div class="input-group">

            <label>IMAGE URL</label>

            <input
              type="url"
              id="leaderImage"
              placeholder="https://..."
            >

          </div>


          <div class="input-group full-input">

            <label>CLUB / DEPARTMENT</label>

            <input
              type="text"
              id="leaderClub"
              value="Ghopkhali Sports Arena"
              placeholder="Ghopkhali Sports Arena"
            >

          </div>

        </div>


        <button
          type="submit"
          class="admin-button admin-button-dark form-submit"
          id="saveLeaderButton"
        >
          Save Leader
        </button>

      </form>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://cmygmswzokyrmgdnuszq.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       GLOBAL
    ===================================================== */

    let leaders = [];

    const grid =
      document.getElementById(
        "leadershipAdminGrid"
      );

    const modal =
      document.getElementById(
        "leaderModal"
      );

    const form =
      document.getElementById(
        "leaderForm"
      );


    /* =====================================================
       SESSION
    ===================================================== */

    async function checkAdminSession() {

      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();


        if (!session) {

          window.location.href =
            "admin.html";

          return false;

        }

        return true;

      } catch (error) {

        console.error(
          "Session error:",
          error
        );

        window.location.href =
          "admin.html";

        return false;

      }

    }


    /* =====================================================
       LOAD LEADERSHIP
    ===================================================== */

    async function loadLeadership() {

      grid.innerHTML = `
        <div class="loading">
          Loading leadership...
        </div>
      `;


      try {

        /*
          This page expects a table named:

          leadership

          Suggested columns:

          id
          name
          role
          club
          image_url
          display_order
          created_at
        */


        const {
          data,
          error
        } =
          await supabaseClient
            .from("leadership")
            .select("*")
            .order(
              "display_order",
              {
                ascending: true
              }
            );


        if (error) {

          throw error;

        }


        leaders = data || [];


        if (!leaders.length) {

          grid.innerHTML = `
            <div class="empty-state">

              <div class="empty-state-icon">
                ★
              </div>

              <h3>
                No leadership members
              </h3>

              <p>
                Add your first leadership member.
              </p>

            </div>
          `;

          return;

        }


        grid.innerHTML =
          leaders
            .map(renderLeader)
            .join("");


      } catch (error) {

        console.error(
          "Leadership loading error:",
          error
        );


        grid.innerHTML = `
          <div class="empty-state">

            <div class="empty-state-icon">
              ⚠
            </div>

            <h3>
              Could not load leadership
            </h3>

            <p>
              ${escapeHTML(
                error.message
              )}
            </p>

          </div>
        `;

      }

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderLeader(leader) {

      const image =
        leader.image_url ||
        leader.image ||
        "";


      const name =
        leader.name ||
        "Unnamed";


      const role =
        leader.role ||
        leader.position ||
        "Leadership";


      const club =
        leader.club ||
        "Ghopkhali Sports Arena";


      const order =
        leader.display_order ||
        leader.order ||
        "";


      return `

        <article class="leader-admin-card">

          <div class="leader-admin-photo">

            ${
              image
                ? `
                  <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                  >
                `
                : `
                  <div class="leader-admin-placeholder">
                    ★
                  </div>
                `
            }

          </div>


          <div class="leader-admin-content">

            <span class="leader-admin-number">
              ${escapeHTML(
                String(order).padStart(2, "0")
              )}
            </span>


            <p class="leader-admin-role">
              ${escapeHTML(role)}
            </p>


            <h3>
              ${escapeHTML(name)}
            </h3>


            <span class="leader-admin-club">
              ${escapeHTML(club)}
            </span>


            <div class="leader-admin-actions">

              <button
                class="edit-btn"
                type="button"
                onclick="editLeader('${escapeAttribute(leader.id)}')"
              >
                Edit
              </button>


              <button
                class="delete-btn"
                type="button"
                onclick="deleteLeader('${escapeAttribute(leader.id)}')"
              >
                Delete
              </button>

            </div>

          </div>

        </article>

      `;

    }


    /* =====================================================
       OPEN ADD MODAL
    ===================================================== */

    function openAddLeader() {

      form.reset();

      document.getElementById(
        "leaderId"
      ).value = "";


      document.getElementById(
        "leaderClub"
      ).value =
        "Ghopkhali Sports Arena";


      document.getElementById(
        "leaderOrder"
      ).value =
        leaders.length + 1;


      document.getElementById(
        "leaderModalTitle"
      ).innerHTML =
        'Add <span>Leader.</span>';


      document.getElementById(
        "saveLeaderButton"
      ).textContent =
        "Save Leader";


      modal.classList.add("open");

      modal.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    /* =====================================================
       EDIT LEADER
    ===================================================== */

    window.editLeader =
      function(id) {

        const leader =
          leaders.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if (!leader) {

          alert(
            "Leadership member not found."
          );

          return;

        }


        document.getElementById(
          "leaderId"
        ).value =
          leader.id;


        document.getElementById(
          "leaderName"
        ).value =
          leader.name || "";


        document.getElementById(
          "leaderRole"
        ).value =
          leader.role ||
          leader.position ||
          "";


        document.getElementById(
          "leaderOrder"
        ).value =
          leader.display_order ||
          leader.order ||
          1;


        document.getElementById(
          "leaderImage"
        ).value =
          leader.image_url ||
          leader.image ||
          "";


        document.getElementById(
          "leaderClub"
        ).value =
          leader.club ||
          "Ghopkhali Sports Arena";


        document.getElementById(
          "leaderModalTitle"
        ).innerHTML =
          'Edit <span>Leader.</span>';


        document.getElementById(
          "saveLeaderButton"
        ).textContent =
          "Save Changes";


        modal.classList.add("open");

        modal.setAttribute(
          "aria-hidden",
          "false"
        );

      };


    /* =====================================================
       SAVE LEADER
    ===================================================== */

    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const id =
          document.getElementById(
            "leaderId"
          ).value;


        const name =
          document.getElementById(
            "leaderName"
          ).value.trim();


        const role =
          document.getElementById(
            "leaderRole"
          ).value.trim();


        const order =
          Number(
            document.getElementById(
              "leaderOrder"
            ).value
          );


        const image =
          document.getElementById(
            "leaderImage"
          ).value.trim();


        const club =
          document.getElementById(
            "leaderClub"
          ).value.trim();


        if (!name || !role) {

          alert(
            "Please enter name and role."
          );

          return;

        }


        const button =
          document.getElementById(
            "saveLeaderButton"
          );


        button.disabled = true;

        button.textContent =
          "Saving...";


        try {

          const payload = {

            name,

            role,

            club:
              club ||
              "Ghopkhali Sports Arena",

            image_url:
              image || null,

            display_order:
              order || 1

          };


          let result;


          if (id) {

            result =
              await supabaseClient
                .from("leadership")
                .update(payload)
                .eq("id", id);

          } else {

            result =
              await supabaseClient
                .from("leadership")
                .insert(payload);

          }


          if (result.error) {

            throw result.error;

          }


          closeModal();

          await loadLeadership();


          alert(
            id
              ? "Leadership member updated successfully."
              : "Leadership member added successfully."
          );


        } catch (error) {

          console.error(
            "Save leader error:",
            error
          );


          alert(
            error.message ||
            "Failed to save leadership member."
          );


        } finally {

          button.disabled = false;

          button.textContent =
            id
              ? "Save Changes"
              : "Save Leader";

        }

      }
    );


    /* =====================================================
       DELETE LEADER
    ===================================================== */

    window.deleteLeader =
      async function(id) {

        const leader =
          leaders.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if (!leader) return;


        const confirmed =
          confirm(
            `Delete "${leader.name}" from leadership?`
          );


        if (!confirmed) return;


        try {

          const {
            error
          } =
            await supabaseClient
              .from("leadership")
              .delete()
              .eq("id", id);


          if (error) {

            throw error;

          }


          await loadLeadership();


          alert(
            "Leadership member deleted successfully."
          );


        } catch (error) {

          console.error(
            "Delete leader error:",
            error
          );


          alert(
            error.message ||
            "Failed to delete leadership member."
          );

        }

      };


    /* =====================================================
       MODAL
    ===================================================== */

    function closeModal() {

      modal.classList.remove("open");

      modal.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    document.getElementById(
      "addLeaderButton"
    ).addEventListener(
      "click",
      openAddLeader
    );


    document.getElementById(
      "closeLeaderModal"
    ).addEventListener(
      "click",
      closeModal
    );


    modal.addEventListener(
      "click",
      function(e) {

        if (e.target === modal) {

          closeModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(e) {

        if (
          e.key === "Escape" &&
          modal.classList.contains("open")
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       SECURITY HELPERS
    ===================================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return escapeHTML(value);

    }


    /* =====================================================
       START
    ===================================================== */

    (async function() {

      const authenticated =
        await checkAdminSession();


      if (authenticated) {

        await loadLeadership();

      }

    })();

  </script>

</body>
</html>
