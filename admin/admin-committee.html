<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f5f5f7"
>

<title>Admin Committee | Ghopkhali Sports Arena</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #111;
  min-height: 100vh;
}

/* HEADER */

.admin-header {
  background: #111;
  color: #fff;
  padding: 18px 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  background: #fff;
  border-radius: 50%;
}

.brand-text strong {
  display: block;
  font-size: 16px;
  letter-spacing: 1px;
}

.brand-text span {
  display: block;
  font-size: 11px;
  color: #bbb;
  margin-top: 3px;
}

.back-button {
  color: #fff;
  text-decoration: none;
  border: 1px solid #555;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 13px;
}

.back-button:hover {
  background: #fff;
  color: #111;
}

/* MAIN */

.container {
  width: min(1200px, 92%);
  margin: 35px auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 25px;
}

.page-label {
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;
  color: #777;
  margin-bottom: 8px;
}

h1 {
  font-size: clamp(30px, 5vw, 48px);
  line-height: 1;
}

h1 span {
  color: #d71920;
}

.page-description {
  margin-top: 10px;
  color: #666;
  max-width: 600px;
  line-height: 1.6;
}

.add-button {
  border: none;
  background: #111;
  color: #fff;
  padding: 13px 20px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.add-button:hover {
  background: #d71920;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat-card {
  background: #fff;
  border: 1px solid #ddd;
  padding: 20px;
  border-radius: 10px;
}

.stat-card span {
  display: block;
  font-size: 12px;
  color: #777;
  margin-bottom: 8px;
}

.stat-card strong {
  font-size: 28px;
}

/* LIST */

.list-container {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow: hidden;
}

.list-header {
  padding: 18px 20px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.list-header h2 {
  font-size: 18px;
}

.refresh-button {
  border: 1px solid #ccc;
  background: #fff;
  padding: 8px 13px;
  border-radius: 5px;
  cursor: pointer;
}

.refresh-button:hover {
  background: #f0f0f0;
}

/* COMMITTEE ITEM */

.committee-item {
  padding: 20px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
}

.committee-item:last-child {
  border-bottom: none;
}

.member-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.member-number {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #111;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.member-info h3 {
  font-size: 18px;
  margin-bottom: 5px;
}

.member-info p {
  color: #d71920;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

.member-info small {
  display: block;
  color: #777;
  margin-top: 4px;
}

.member-actions {
  display: flex;
  gap: 8px;
}

.action-button {
  padding: 9px 13px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 5px;
  cursor: pointer;
}

.action-button:hover {
  background: #eee;
}

.action-button.delete {
  color: #d71920;
  border-color: #e3a4a7;
}

.action-button.delete:hover {
  background: #d71920;
  color: #fff;
}

/* EMPTY */

.empty {
  padding: 60px 20px;
  text-align: center;
  color: #777;
}

.empty strong {
  display: block;
  color: #111;
  font-size: 18px;
  margin-bottom: 8px;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: min(600px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 12px;
  padding: 28px;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 35px;
  height: 35px;
  border: none;
  background: #eee;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
}

.modal-header {
  margin-bottom: 25px;
}

.modal-header p {
  font-size: 11px;
  color: #777;
  letter-spacing: 2px;
  font-weight: bold;
}

.modal-header h2 {
  font-size: 30px;
  margin-top: 8px;
}

.modal-header h2 span {
  color: #d71920;
}

/* FORM */

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 7px;
  letter-spacing: .5px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: #111;
}

.submit-button {
  width: 100%;
  border: none;
  background: #111;
  color: #fff;
  padding: 14px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.submit-button:hover {
  background: #d71920;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 50px 20px;
  color: #777;
}

/* TOAST */

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: #111;
  color: #fff;
  padding: 14px 20px;
  border-radius: 7px;
  z-index: 2000;
  max-width: 350px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.toast.error {
  background: #d71920;
}

/* MOBILE */

@media (max-width: 700px) {

  .admin-header {
    padding: 14px;
  }

  .brand img {
    width: 40px;
    height: 40px;
  }

  .page-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .add-button {
    width: 100%;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .committee-item {
    align-items: flex-start;
    flex-direction: column;
  }

  .member-actions {
    width: 100%;
  }

  .action-button {
    flex: 1;
  }

  .modal-box {
    padding: 22px;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<header class="admin-header">

<div class="brand">

<img
src="gsa.png"
alt="Ghopkhali Sports Arena"
>

<div class="brand-text">

<strong>GSA ADMIN</strong>

<span>GHOPKHALI SPORTS ARENA</span>

</div>

</div>

<a
href="admin-dashboard.html"
class="back-button"
>
← Dashboard
</a>

</header>



<!-- MAIN -->

<main class="container">


<div class="page-header">

<div>

<div class="page-label">
GSA ADMINISTRATION
</div>

<h1>
Committee <span>Members.</span>
</h1>

<p class="page-description">
Manage the official committee members of
Ghopkhali Sports Arena.
</p>

</div>


<button
class="add-button"
id="addMemberButton"
>
+ Add Member
</button>

</div>



<!-- STATS -->

<div class="stats">

<div class="stat-card">

<span>TOTAL MEMBERS</span>

<strong id="totalMembers">
0
</strong>

</div>


<div class="stat-card">

<span>ACTIVE POSITIONS</span>

<strong id="totalPositions">
0
</strong>

</div>


<div class="stat-card">

<span>LAST UPDATED</span>

<strong id="lastUpdated">
—
</strong>

</div>

</div>



<!-- LIST -->

<section class="list-container">

<div class="list-header">

<h2>
Committee List
</h2>

<button
class="refresh-button"
id="refreshButton"
>
↻ Refresh
</button>

</div>


<div id="committeeList">

<div class="loading">
Loading committee members...
</div>

</div>

</section>


</main>



<!-- MODAL -->

<div
class="modal"
id="memberModal"
aria-hidden="true"
>

<div class="modal-box">

<button
class="modal-close"
id="closeModal"
>
×
</button>


<div class="modal-header">

<p>
GHOPKHALI SPORTS ARENA
</p>

<h2>
Add <span>Member.</span>
</h2>

</div>


<form id="memberForm">


<div class="form-group">

<label>
FULL NAME
</label>

<input
type="text"
id="memberName"
placeholder="Enter member name"
required
>

</div>


<div class="form-group">

<label>
POSITION / ROLE
</label>

<input
type="text"
id="memberRole"
placeholder="e.g. President"
required
>

</div>


<div class="form-group">

<label>
DEPARTMENT / RESPONSIBILITY
</label>

<input
type="text"
id="memberDepartment"
placeholder="e.g. Administration"
>

</div>


<div class="form-group">

<label>
PHONE NUMBER
</label>

<input
type="tel"
id="memberPhone"
placeholder="01XXXXXXXXX"
>

</div>


<div class="form-group">

<label>
EMAIL
</label>

<input
type="email"
id="memberEmail"
placeholder="member@example.com"
>

</div>


<div class="form-group">

<label>
PHOTO URL
</label>

<input
type="text"
id="memberPhoto"
placeholder="https://..."
>

</div>


<div class="form-group">

<label>
DISPLAY ORDER
</label>

<input
type="number"
id="memberOrder"
value="1"
min="1"
>

</div>


<button
type="submit"
class="submit-button"
id="submitButton"
>
Save Member
</button>


</form>

</div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let members = [];

let editingId = null;


/* ================================
   DOM
================================ */

const committeeList =
document.getElementById(
  "committeeList"
);

const memberModal =
document.getElementById(
  "memberModal"
);

const memberForm =
document.getElementById(
  "memberForm"
);


/* ================================
   LOAD
================================ */

async function loadCommittee() {

  committeeList.innerHTML = `
    <div class="loading">
      Loading committee members...
    </div>
  `;

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("committee")
      .select("*")
      .order(
        "display_order",
        {
          ascending: true
        }
      );

    if (error) throw error;

    members = data || [];

    updateStats();

    renderCommittee();

  } catch (error) {

    console.error(
      "Committee loading error:",
      error
    );

    committeeList.innerHTML = `
      <div class="empty">
        <strong>
          Could not load committee
        </strong>

        <p>
          ${escapeHTML(error.message)}
        </p>
      </div>
    `;

  }

}


/* ================================
   RENDER
================================ */

function renderCommittee() {

  if (!members.length) {

    committeeList.innerHTML = `
      <div class="empty">

        <strong>
          No committee members found
        </strong>

        <p>
          Click "Add Member" to create
          the first committee member.
        </p>

      </div>
    `;

    return;

  }


  committeeList.innerHTML =
    members.map(
      (member, index) => {

        return `

          <div class="committee-item">

            <div class="member-left">

              <div class="member-number">
                ${String(index + 1).padStart(2, "0")}
              </div>

              <div class="member-info">

                <h3>
                  ${escapeHTML(
                    member.name || "Unnamed"
                  )}
                </h3>

                <p>
                  ${escapeHTML(
                    member.role || "Committee Member"
                  )}
                </p>

                <small>
                  ${escapeHTML(
                    member.department || ""
                  )}
                </small>

              </div>

            </div>


            <div class="member-actions">

              <button
                class="action-button"
                onclick="editMember('${member.id}')"
              >
                Edit
              </button>

              <button
                class="action-button delete"
                onclick="deleteMember('${member.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* ================================
   STATS
================================ */

function updateStats() {

  document.getElementById(
    "totalMembers"
  ).textContent = members.length;


  const positions =
    new Set(
      members
        .map(
          item =>
            item.role
        )
        .filter(Boolean)
    );

  document.getElementById(
    "totalPositions"
  ).textContent =
    positions.size;


  if (members.length) {

    const latest =
      members.reduce(
        (latest, item) => {

          if (
            !item.updated_at
          ) return latest;

          if (
            !latest ||
            new Date(item.updated_at)
            >
            new Date(latest)
          ) {
            return item.updated_at;
          }

          return latest;

        },
        null
      );

    document.getElementById(
      "lastUpdated"
    ).textContent =
      latest
        ? formatDate(latest)
        : "—";

  } else {

    document.getElementById(
      "lastUpdated"
    ).textContent =
      "—";

  }

}


/* ================================
   ADD BUTTON
================================ */

document
.getElementById(
  "addMemberButton"
)
.addEventListener(
  "click",
  () => {

    editingId = null;

    resetForm();

    document.querySelector(
      ".modal-header h2"
    ).innerHTML =
      'Add <span>Member.</span>';

    document.getElementById(
      "submitButton"
    ).textContent =
      "Save Member";

    openModal();

  }
);


/* ================================
   EDIT
================================ */

window.editMember =
async function(id) {

  const member =
    members.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!member) return;

  editingId = id;


  document.getElementById(
    "memberName"
  ).value =
    member.name || "";


  document.getElementById(
    "memberRole"
  ).value =
    member.role || "";


  document.getElementById(
    "memberDepartment"
  ).value =
    member.department || "";


  document.getElementById(
    "memberPhone"
  ).value =
    member.phone || "";


  document.getElementById(
    "memberEmail"
  ).value =
    member.email || "";


  document.getElementById(
    "memberPhoto"
  ).value =
    member.photo_url || "";


  document.getElementById(
    "memberOrder"
  ).value =
    member.display_order || 1;


  document.querySelector(
    ".modal-header h2"
  ).innerHTML =
    'Edit <span>Member.</span>';


  document.getElementById(
    "submitButton"
  ).textContent =
    "Save Changes";


  openModal();

};


/* ================================
   DELETE
================================ */

window.deleteMember =
async function(id) {

  const member =
    members.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!member) return;


  const confirmed =
    confirm(
      `Delete "${member.name}" from committee?`
    );

  if (!confirmed) return;


  try {

    const {
      error
    } = await supabaseClient
      .from("committee")
      .delete()
      .eq("id", id);

    if (error) throw error;

    showToast(
      "Committee member deleted successfully."
    );

    await loadCommittee();

  } catch (error) {

    console.error(
      error
    );

    showToast(
      error.message ||
      "Failed to delete member.",
      true
    );

  }

};


/* ================================
   FORM SUBMIT
================================ */

memberForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const memberData = {

      name:
        document.getElementById(
          "memberName"
        ).value.trim(),

      role:
        document.getElementById(
          "memberRole"
        ).value.trim(),

      department:
        document.getElementById(
          "memberDepartment"
        ).value.trim(),

      phone:
        document.getElementById(
          "memberPhone"
        ).value.trim(),

      email:
        document.getElementById(
          "memberEmail"
        ).value.trim(),

      photo_url:
        document.getElementById(
          "memberPhoto"
        ).value.trim() || null,

      display_order:
        Number(
          document.getElementById(
            "memberOrder"
          ).value
        ) || 1,

      updated_at:
        new Date().toISOString()

    };


    const submitButton =
      document.getElementById(
        "submitButton"
      );

    submitButton.disabled = true;

    submitButton.textContent =
      "Saving...";


    try {

      if (editingId) {

        const {
          error
        } = await supabaseClient
          .from("committee")
          .update(memberData)
          .eq(
            "id",
            editingId
          );

        if (error) throw error;


        showToast(
          "Committee member updated successfully."
        );

      } else {

        const {
          error
        } = await supabaseClient
          .from("committee")
          .insert(
            memberData
          );

        if (error) throw error;


        showToast(
          "Committee member added successfully."
        );

      }


      closeModal();

      await loadCommittee();


    } catch (error) {

      console.error(
        "Save committee error:",
        error
      );

      showToast(
        error.message ||
        "Failed to save committee member.",
        true
      );

    } finally {

      submitButton.disabled =
        false;

      submitButton.textContent =
        editingId
          ? "Save Changes"
          : "Save Member";

    }

  }
);


/* ================================
   MODAL
================================ */

function openModal() {

  memberModal.classList.add(
    "open"
  );

  memberModal.setAttribute(
    "aria-hidden",
    "false"
  );

}


function closeModal() {

  memberModal.classList.remove(
    "open"
  );

  memberModal.setAttribute(
    "aria-hidden",
    "true"
  );

  editingId = null;

}


document
.getElementById(
  "closeModal"
)
.addEventListener(
  "click",
  closeModal
);


memberModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      memberModal
    ) {
      closeModal();
    }

  }
);


/* ================================
   RESET
================================ */

function resetForm() {

  memberForm.reset();

  document.getElementById(
    "memberOrder"
  ).value = 1;

}


/* ================================
   REFRESH
================================ */

document
.getElementById(
  "refreshButton"
)
.addEventListener(
  "click",
  loadCommittee
);


/* ================================
   HELPERS
================================ */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatDate(date) {

  if (!date) return "—";

  return new Date(date)
    .toLocaleDateString(
      "en-US",
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

}


/* ================================
   TOAST
================================ */

function showToast(
  message,
  error = false
) {

  const old =
    document.querySelector(
      ".toast"
    );

  if (old) old.remove();


  const toast =
    document.createElement(
      "div"
    );

  toast.className =
    error
      ? "toast error"
      : "toast";

  toast.textContent =
    message;

  document.body.appendChild(
    toast
  );


  setTimeout(
    () => toast.remove(),
    3500
  );

}


/* ================================
   START
================================ */

loadCommittee();

</script>

</body>
</html>
