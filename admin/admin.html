<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f5f5f7"
>

<meta
  name="description"
  content="Ghopkhali Sports Arena Administration"
>

<title>GSA Admin | Ghopkhali Sports Arena</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

/* ==================================================
   GSA ADMIN LOGIN
================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f5f5f7;
}

.gsa-admin-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.gsa-admin-login {
  width: 100%;
  max-width: 460px;
  background: #ffffff;
  border: 1px solid #e5e5e5;
  padding: 42px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
}

.gsa-admin-brand {
  text-align: center;
  margin-bottom: 34px;
}

.gsa-admin-logo {
  width: 86px;
  height: 86px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gsa-admin-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.gsa-admin-brand small {
  display: block;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 700;
  margin-bottom: 8px;
}

.gsa-admin-brand h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1.1;
}

.gsa-admin-brand p {
  margin: 10px 0 0;
  color: #777;
  font-size: 14px;
}

.gsa-admin-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.gsa-admin-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.gsa-admin-field label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

.gsa-admin-field input {
  width: 100%;
  padding: 15px 16px;
  border: 1px solid #d9d9d9;
  background: #fafafa;
  outline: none;
  font: inherit;
  transition: border-color 0.2s, background 0.2s;
}

.gsa-admin-field input:focus {
  border-color: #111;
  background: #fff;
}

.gsa-admin-login-button {
  width: 100%;
  border: 0;
  background: #111;
  color: #fff;
  padding: 16px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.gsa-admin-login-button:hover {
  opacity: 0.88;
}

.gsa-admin-login-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.gsa-admin-error {
  min-height: 20px;
  color: #c40000;
  font-size: 13px;
  line-height: 1.5;
}

.gsa-admin-footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid #eeeeee;
}

.gsa-admin-footer a {
  color: #111;
  text-decoration: none;
  font-size: 13px;
}

.gsa-admin-footer a:hover {
  text-decoration: underline;
}


/* ==================================================
   LOADING
================================================== */

.gsa-admin-loading {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(245, 245, 247, 0.94);
}

.gsa-admin-loading-box {
  text-align: center;
}

.gsa-admin-spinner {
  width: 38px;
  height: 38px;
  border: 3px solid #ddd;
  border-top-color: #111;
  border-radius: 50%;
  animation: gsaSpin 0.8s linear infinite;
  margin: 0 auto 15px;
}

.gsa-admin-loading-box p {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

@keyframes gsaSpin {
  to {
    transform: rotate(360deg);
  }
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

  .gsa-admin-page {
    padding: 16px;
  }

  .gsa-admin-login {
    padding: 30px 22px;
  }

  .gsa-admin-brand h1 {
    font-size: 25px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN PAGE
================================================== -->

<main class="gsa-admin-page">


<div class="gsa-admin-login">


<!-- BRAND -->

<div class="gsa-admin-brand">

<div class="gsa-admin-logo">

<img
  src="gsa.png"
  alt="Ghopkhali Sports Arena"
>

</div>


<small>
GSA ADMINISTRATION
</small>


<h1>
GHOPKHALI
</h1>


<p>
SPORTS ARENA • ADMIN PANEL
</p>

</div>



<!-- ==================================================
     LOGIN FORM
================================================== -->

<form
  id="gsaAdminLoginForm"
  class="gsa-admin-form"
>


<div class="gsa-admin-field">

<label for="gsaAdminEmail">
EMAIL ADDRESS
</label>

<input
  type="email"
  id="gsaAdminEmail"
  autocomplete="email"
  placeholder="admin@example.com"
  required
>

</div>



<div class="gsa-admin-field">

<label for="gsaAdminPassword">
PASSWORD
</label>

<input
  type="password"
  id="gsaAdminPassword"
  autocomplete="current-password"
  placeholder="Enter your password"
  required
>

</div>



<div
  id="gsaAdminError"
  class="gsa-admin-error"
  role="alert"
></div>



<button
  type="submit"
  id="gsaAdminLoginButton"
  class="gsa-admin-login-button"
>
LOGIN TO ADMIN PANEL
</button>


</form>



<!-- FOOTER -->

<div class="gsa-admin-footer">

<a href="index.html">
← Back to Ghopkhali Sports Arena
</a>

</div>


</div>

</main>



<!-- ==================================================
     LOADING
================================================== -->

<div
  id="gsaAdminLoading"
  class="gsa-admin-loading"
  aria-hidden="true"
>

<div class="gsa-admin-loading-box">

<div class="gsa-admin-spinner"></div>

<p>
Signing in...
</p>

</div>

</div>



<!-- ==================================================
     SUPABASE
================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<!-- ==================================================
     ADMIN LOGIN SCRIPT
================================================== -->

<script>

"use strict";


/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
  "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


/* ==================================================
   CREATE CLIENT
================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const loginForm =
  document.getElementById(
    "gsaAdminLoginForm"
  );

const emailInput =
  document.getElementById(
    "gsaAdminEmail"
  );

const passwordInput =
  document.getElementById(
    "gsaAdminPassword"
  );

const loginButton =
  document.getElementById(
    "gsaAdminLoginButton"
  );

const errorBox =
  document.getElementById(
    "gsaAdminError"
  );

const loading =
  document.getElementById(
    "gsaAdminLoading"
  );


/* ==================================================
   LOADING
================================================== */

function setLoading(isLoading) {

  if (loading) {

    loading.style.display =
      isLoading ? "flex" : "none";

    loading.setAttribute(
      "aria-hidden",
      isLoading ? "false" : "true"
    );

  }


  if (loginButton) {

    loginButton.disabled =
      isLoading;

    loginButton.textContent =
      isLoading
        ? "SIGNING IN..."
        : "LOGIN TO ADMIN PANEL";

  }

}


/* ==================================================
   ERROR
================================================== */

function showError(message) {

  if (!errorBox) return;

  errorBox.textContent =
    message || "";

}


/* ==================================================
   CHECK EXISTING SESSION
================================================== */

async function checkExistingSession() {

  try {

    const result =
      await supabaseClient.auth.getSession();

    const session =
      result?.data?.session;


    if (session && session.user) {

      /*
       * User is already logged in.
       * Send directly to the dashboard.
       */

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  } catch (error) {

    console.error(
      "Session check failed:",
      error
    );

  }

}


/* ==================================================
   LOGIN
================================================== */

if (loginForm) {

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      showError("");


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showError(
          "Please enter your email and password."
        );

        return;

      }


      setLoading(true);


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });


        if (error) {

          throw error;

        }


        if (!data || !data.user) {

          throw new Error(
            "Login failed. Please try again."
          );

        }


        /*
         * Login successful.
         * Move to separate dashboard.
         */

        window.location.replace(
          "admin-dashboard.html"
        );


      } catch (error) {

        console.error(
          "GSA Admin Login Error:",
          error
        );


        let message =
          "Login failed. Please check your email and password.";


        if (error?.message) {

          message =
            error.message;

        }


        showError(message);

        setLoading(false);

      }

    }
  );

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    if (
      event === "SIGNED_IN" &&
      session?.user
    ) {

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  }
);


/* ==================================================
   START
================================================== */

checkExistingSession();

</script>


</body>

</html>
