<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">
<title>GSA Admin | Login</title>
<link rel="stylesheet" href="admin.css">
</head>

<body class="login-page">

<main class="login-shell">

<section class="login-card">

<div class="login-logo">
<img src="gsa.png" alt="Ghopkhali Sports Arena">
</div>

<p class="eyebrow">GHOPKHALI SPORTS ARENA</p>

<h1>Admin<br><span>Administration.</span></h1>

<p class="login-subtitle">
Secure access to the GSA management panel.
</p>

<form id="gsaAdminLoginForm">

<label>
EMAIL ADDRESS
<input
type="email"
id="gsaAdminEmail"
placeholder="admin@example.com"
autocomplete="email"
required>
</label>

<label>
PASSWORD
<input
type="password"
id="gsaAdminPassword"
placeholder="Enter your password"
autocomplete="current-password"
required>
</label>

<div id="gsaAdminError" class="login-error"></div>

<button
type="submit"
id="gsaAdminLoginButton"
class="primary-button">
Login to Admin Panel
</button>

</form>

<a href="../index.html" class="back-link">
← Back to Ghopkhali Sports Arena
</a>

</section>

</main>

<div id="gsaAdminLoading" class="loading-screen">
<div class="loading-box">
<div class="spinner"></div>
<p>Signing in...</p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>
</html>
