<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111111"><meta
name="description"
content="Ghopkhali Sports Arena Administration"
/>

<title>GSA Admin | Login</title><link rel="stylesheet" href="admin.css"></head><body><!-- ==================================================
     LOGIN PAGE
================================================== --><main class="gsa-login-page">  <section class="gsa-login-card"><!-- BRAND -->

<div class="gsa-login-brand">

  <div class="gsa-login-logo">
    <img
      src="gsa.png"
      alt="Ghopkhali Sports Arena"
    >
  </div>

  <span class="gsa-login-kicker">
    GSA ADMINISTRATION
  </span>

  <h1>
    GHOPKHALI
  </h1>

  <p>
    SPORTS ARENA
    <span>•</span>
    ADMIN PANEL
  </p>

</div>


<!-- LOGIN FORM -->

<form
  id="gsaAdminLoginForm"
  class="gsa-login-form"
>

  <div class="gsa-input-group">

    <label for="gsaAdminEmail">
      EMAIL ADDRESS
    </label>

    <input
      type="email"
      id="gsaAdminEmail"
      name="email"
      placeholder="admin@example.com"
      autocomplete="email"
      required
    >

  </div>


  <div class="gsa-input-group">

    <div class="gsa-password-label">

      <label for="gsaAdminPassword">
        PASSWORD
      </label>

    </div>

    <input
      type="password"
      id="gsaAdminPassword"
      name="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

  </div>


  <!-- ERROR -->

  <div
    id="gsaAdminError"
    class="gsa-login-error"
    role="alert"
    aria-live="polite"
  ></div>


  <!-- LOGIN BUTTON -->

  <button
    type="submit"
    id="gsaAdminLoginButton"
    class="gsa-login-button"
  >

    <span class="login-button-text">
      LOGIN TO ADMIN PANEL
    </span>

    <span
      class="login-button-spinner"
      aria-hidden="true"
    ></span>

  </button>

</form>


<!-- FOOTER -->

<div class="gsa-login-footer">

  <a href="index.html">
    <span>←</span>
    Back to Ghopkhali Sports Arena
  </a>

</div>

  </section></main><!-- ==================================================
     LOGIN LOADING
================================================== --><div
  id="gsaAdminLoading"
  class="gsa-loading"
  aria-hidden="true"
>  <div class="gsa-loading-box"><div class="gsa-loading-spinner"></div>

<strong>
  Signing in
</strong>

<span>
  Please wait...
</span>

  </div></div><!-- ==================================================
     SUPABASE
================================================== --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

"use strict";


/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
  "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


/* ==================================================
   SUPABASE CLIENT
================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const loginForm =
  document.getElementById(
    "gsaAdminLoginForm"
  );

const emailInput =
  document.getElementById(
    "gsaAdminEmail"
  );

const passwordInput =
  document.getElementById(
    "gsaAdminPassword"
  );

const loginButton =
  document.getElementById(
    "gsaAdminLoginButton"
  );

const errorBox =
  document.getElementById(
    "gsaAdminError"
  );

const loading =
  document.getElementById(
    "gsaAdminLoading"
  );


/* ==================================================
   ERROR
================================================== */

function showLoginError(message) {

  if (!errorBox) return;

  errorBox.textContent =
    message || "";

  if (message) {

    errorBox.classList.add(
      "show"
    );

  } else {

    errorBox.classList.remove(
      "show"
    );

  }

}


/* ==================================================
   LOADING
================================================== */

function setLoginLoading(status) {

  if (loading) {

    loading.classList.toggle(
      "show",
      status
    );

    loading.setAttribute(
      "aria-hidden",
      status ? "false" : "true"
    );

  }


  if (loginButton) {

    loginButton.disabled =
      status;

    loginButton.classList.toggle(
      "loading",
      status
    );

  }

}


/* ==================================================
   CHECK EXISTING SESSION
================================================== */

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      return;

    }


    const session =
      data?.session;


    if (
      session &&
      session.user
    ) {

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  } catch (error) {

    console.error(
      "Session check failed:",
      error
    );

  }

}


/* ==================================================
   LOGIN
================================================== */

if (loginForm) {

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      showLoginError("");


      const email =
        emailInput
          ?.value
          .trim();

      const password =
        passwordInput
          ?.value || "";


      if (!email) {

        showLoginError(
          "Please enter your email address."
        );

        emailInput?.focus();

        return;

      }


      if (!password) {

        showLoginError(
          "Please enter your password."
        );

        passwordInput?.focus();

        return;

      }


      setLoginLoading(true);


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          throw error;

        }


        if (
          !data ||
          !data.user
        ) {

          throw new Error(
            "Unable to sign in. Please try again."
          );

        }


        /*
         * Login successful
         */

        window.location.replace(
          "admin-dashboard.html"
        );


      } catch (error) {

        console.error(
          "GSA Admin Login Error:",
          error
        );


        let message =
          "Login failed. Please check your email and password.";


        if (
          error &&
          error.message
        ) {

          const errorMessage =
            error.message.toLowerCase();


          if (
            errorMessage.includes(
              "invalid login credentials"
            )
          ) {

            message =
              "Invalid email or password.";

          } else if (
            errorMessage.includes(
              "email not confirmed"
            )
          ) {

            message =
              "Please confirm your email before signing in.";

          } else {

            message =
              error.message;

          }

        }


        showLoginError(
          message
        );

        setLoginLoading(false);

      }

    }
  );

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    if (
      event === "SIGNED_IN" &&
      session?.user
    ) {

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  }
);


/* ==================================================
   START
================================================== */

checkExistingSession();

</script>
</body>
</html>
