<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f5f5f7"
>

<meta
  name="description"
  content="GSA Admin Users — Ghopkhali Sports Arena"
>

<title>Admin Users | Ghopkhali Sports Arena</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==================================================
   ADMIN USERS PAGE
================================================== */

.users-page {
  min-height: 100vh;
  background: #f5f5f7;
  padding: 40px;
}

.users-container {
  max-width: 1200px;
  margin: 0 auto;
}

.users-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 35px;
}

.users-header h1 {
  margin: 8px 0 0;
  font-size: clamp(32px, 5vw, 56px);
  line-height: 1;
}

.users-header h1 span {
  color: #e11d2e;
}

.users-header p {
  max-width: 600px;
  margin-top: 15px;
  color: #666;
  line-height: 1.7;
}

.users-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.admin-users-button {
  border: 1px solid #111;
  background: #111;
  color: #fff;
  padding: 13px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
}

.admin-users-button.outline {
  background: transparent;
  color: #111;
}

.admin-users-button:hover {
  opacity: .85;
}


/* ==================================================
   STATS
================================================== */

.users-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

.user-stat-card {
  background: #fff;
  border: 1px solid #e5e5e5;
  padding: 25px;
  border-radius: 18px;
}

.user-stat-card span {
  display: block;
  font-size: 12px;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: #777;
  margin-bottom: 12px;
}

.user-stat-card strong {
  display: block;
  font-size: 36px;
}


/* ==================================================
   USERS CARD
================================================== */

.users-card {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 22px;
  overflow: hidden;
}

.users-card-header {
  padding: 25px;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.users-card-header h2 {
  margin: 0;
}

.users-search {
  width: 280px;
  max-width: 100%;
  border: 1px solid #ddd;
  border-radius: 999px;
  padding: 12px 16px;
  outline: none;
  background: #fafafa;
}

.users-search:focus {
  border-color: #111;
}


/* ==================================================
   TABLE
================================================== */

.users-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.users-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

.users-table th,
.users-table td {
  text-align: left;
  padding: 18px 22px;
  border-bottom: 1px solid #eee;
}

.users-table th {
  font-size: 11px;
  letter-spacing: 1.2px;
  color: #777;
  text-transform: uppercase;
  background: #fafafa;
}

.users-table td {
  font-size: 14px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 50%;
  background: #111;
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
}

.user-name {
  font-weight: 700;
}

.user-email {
  color: #777;
  font-size: 12px;
  margin-top: 3px;
}

.role-badge,
.status-badge {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;
}

.role-admin {
  background: #111;
  color: #fff;
}

.role-editor {
  background: #eee;
  color: #111;
}

.role-member {
  background: #f2f2f2;
  color: #555;
}

.status-active {
  background: #e9f8ee;
  color: #18733a;
}

.status-inactive {
  background: #fcebec;
  color: #b4232f;
}

.user-actions {
  display: flex;
  gap: 8px;
}

.user-action {
  border: 1px solid #ddd;
  background: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.user-action.danger {
  color: #c62828;
  border-color: #f0caca;
}


/* ==================================================
   EMPTY / LOADING
================================================== */

.users-message {
  padding: 60px 25px;
  text-align: center;
  color: #777;
}

.users-message strong {
  display: block;
  color: #111;
  font-size: 20px;
  margin-bottom: 8px;
}


/* ==================================================
   MODAL
================================================== */

.user-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.user-modal.open {
  display: flex;
}

.user-modal-box {
  width: 100%;
  max-width: 520px;
  background: #fff;
  border-radius: 22px;
  padding: 30px;
  position: relative;
}

.user-modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: #f1f1f1;
  font-size: 22px;
  cursor: pointer;
}

.user-modal-box h2 {
  margin: 10px 0 25px;
}

.user-form-group {
  margin-bottom: 18px;
}

.user-form-group label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.user-form-group input,
.user-form-group select {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #ddd;
  padding: 13px 14px;
  border-radius: 10px;
  outline: none;
}

.user-form-group input:focus,
.user-form-group select:focus {
  border-color: #111;
}

.user-form-submit {
  width: 100%;
  border: 0;
  background: #111;
  color: #fff;
  padding: 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 800;
}


/* ==================================================
   TOAST
================================================== */

.users-toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: #111;
  color: #fff;
  padding: 14px 20px;
  border-radius: 10px;
  display: none;
  z-index: 10000;
}

.users-toast.show {
  display: block;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 800px) {

  .users-page {
    padding: 25px 15px;
  }

  .users-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .users-stats {
    grid-template-columns: 1fr;
  }

  .users-card-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .users-search {
    width: 100%;
  }

}

</style>

</head>


<body>

<div class="users-container">

<span>ADMIN USERS</span>

<section class="users-card">

<!-- ==================================================
     SUPABASE
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
"https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ==================================================
   STATE
================================================== */

let users = [];


/* ==================================================
   INIT
================================================== */

document.addEventListener(
"DOMContentLoaded",
async () => {

  await checkAuth();

  setupSearch();

  setupForm();

});


/* ==================================================
   AUTH CHECK
================================================== */

async function checkAuth() {

  try {

    const {
      data: { session },
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) throw error;


    if (!session?.user) {

      window.location.href =
        "admin.html";

      return;

    }


    await loadUsers();

  } catch (error) {

    console.error(
      "Authentication error:",
      error
    );

    window.location.href =
      "admin.html";

  }

}


/* ==================================================
   LOAD USERS
================================================== */

async function loadUsers() {

  const tbody =
    document.getElementById(
      "usersTableBody"
    );


  tbody.innerHTML = `

    <tr>

      <td colspan="5">

        <div class="users-message">

          <strong>
            Loading users...
          </strong>

          Please wait.

        </div>

      </td>

    </tr>

  `;


  try {

    /*
      Expected table:

      admin_users

      id
      name
      email
      role
      status
      created_at

    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("admin_users")
        .select(
          "id,name,email,role,status,created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      /*
        If the table does not exist yet,
        show a useful message instead of
        freezing the page.
      */

      console.error(
        "Users database error:",
        error
      );


      tbody.innerHTML = `

        <tr>

          <td colspan="5">

            <div class="users-message">

              <strong>
                User database is not connected
              </strong>

              <p>
                Create the
                <b>admin_users</b>
                table in Supabase first.
              </p>

            </div>

          </td>

        </tr>

      `;

      updateStats([]);

      return;

    }


    users = data || [];

    renderUsers(users);

    updateStats(users);


  } catch (error) {

    console.error(
      "Load users error:",
      error
    );

    tbody.innerHTML = `

      <tr>

        <td colspan="5">

          <div class="users-message">

            <strong>
              Could not load users
            </strong>

            <p>
              ${escapeHTML(
                error.message
              )}
            </p>

          </div>

        </td>

      </tr>

    `;

  }

}


/* ==================================================
   RENDER USERS
================================================== */

function renderUsers(list) {

  const tbody =
    document.getElementById(
      "usersTableBody"
    );


  if (!list.length) {

    tbody.innerHTML = `

      <tr>

        <td colspan="5">

          <div class="users-message">

            <strong>
              No users found
            </strong>

            Add your first authorised user.

          </div>

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    list.map(user => {

      const name =
        user.name ||
        user.email?.split("@")[0] ||
        "User";


      const initial =
        name
          .charAt(0)
          .toUpperCase();


      const role =
        String(
          user.role || "member"
        ).toLowerCase();


      const status =
        String(
          user.status || "active"
        ).toLowerCase();


      return `

        <tr>

          <td>

            <div class="user-info">

              <div class="user-avatar">
                ${escapeHTML(initial)}
              </div>

              <div>

                <div class="user-name">
                  ${escapeHTML(name)}
                </div>

                <div class="user-email">
                  ${escapeHTML(
                    user.email || ""
                  )}
                </div>

              </div>

            </div>

          </td>


          <td>

            <span
              class="role-badge role-${escapeHTML(role)}"
            >
              ${escapeHTML(
                role.toUpperCase()
              )}
            </span>

          </td>


          <td>

            <span
              class="status-badge status-${escapeHTML(status)}"
            >
              ${escapeHTML(
                status.toUpperCase()
              )}
            </span>

          </td>


          <td>
            ${formatDate(
              user.created_at
            )}
          </td>


          <td>

            <div class="user-actions">

              <button
                class="user-action"
                onclick="editUser('${escapeAttribute(user.id)}')"
              >
                Edit
              </button>

              <button
                class="user-action danger"
                onclick="deleteUser('${escapeAttribute(user.id)}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* ==================================================
   STATS
================================================== */

function updateStats(list) {

  const total =
    list.length;


  const active =
    list.filter(
      user =>
        String(
          user.status
        ).toLowerCase() ===
        "active"
    ).length;


  const admins =
    list.filter(
      user =>
        String(
          user.role
        ).toLowerCase() ===
        "admin"
    ).length;


  document.getElementById(
    "totalUsers"
  ).textContent = total;


  document.getElementById(
    "activeUsers"
  ).textContent = active;


  document.getElementById(
    "adminUsers"
  ).textContent = admins;

}


/* ==================================================
   SEARCH
================================================== */

function setupSearch() {

  const search =
    document.getElementById(
      "userSearch"
    );


  search.addEventListener(
    "input",
    () => {

      const query =
        search.value
          .trim()
          .toLowerCase();


      if (!query) {

        renderUsers(users);

        return;

      }


      const filtered =
        users.filter(user => {

          return (

            String(
              user.name || ""
            )
              .toLowerCase()
              .includes(query)

            ||

            String(
              user.email || ""
            )
              .toLowerCase()
              .includes(query)

            ||

            String(
              user.role || ""
            )
              .toLowerCase()
              .includes(query)

            ||

            String(
              user.status || ""
            )
              .toLowerCase()
              .includes(query)

          );

        });


      renderUsers(filtered);

    }
  );

}


/* ==================================================
   ADD USER
================================================== */

function openAddUserModal() {

  const modal =
    document.getElementById(
      "userModal"
    );


  modal.classList.add("open");

  modal.setAttribute(
    "aria-hidden",
    "false"
  );

}


function closeUserModal() {

  const modal =
    document.getElementById(
      "userModal"
    );


  modal.classList.remove("open");

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

}


function setupForm() {

  const form =
    document.getElementById(
      "addUserForm"
    );


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        document.getElementById(
          "newUserName"
        ).value.trim();


      const email =
        document.getElementById(
          "newUserEmail"
        ).value.trim();


      const role =
        document.getElementById(
          "newUserRole"
        ).value;


      const status =
        document.getElementById(
          "newUserStatus"
        ).value;


      if (!name || !email) {

        showToast(
          "Please fill in all required fields."
        );

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("admin_users")
            .insert({
              name,
              email,
              role,
              status
            });


        if (error) throw error;


        form.reset();

        closeUserModal();

        showToast(
          "User added successfully."
        );


        await loadUsers();


      } catch (error) {

        console.error(
          "Add user error:",
          error
        );

        showToast(
          error.message ||
          "Could not add user."
        );

      }

    }
  );

}


/* ==================================================
   EDIT USER
================================================== */

window.editUser =
async function(id) {

  const user =
    users.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!user) return;


  const name =
    prompt(
      "Enter user name:",
      user.name || ""
    );


  if (name === null) return;


  const role =
    prompt(
      "Enter role (admin/editor/member):",
      user.role || "member"
    );


  if (role === null) return;


  const status =
    prompt(
      "Enter status (active/inactive):",
      user.status || "active"
    );


  if (status === null) return;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("admin_users")
        .update({
          name: name.trim(),
          role:
            role.trim().toLowerCase(),
          status:
            status.trim().toLowerCase()
        })
        .eq("id", id);


    if (error) throw error;


    showToast(
      "User updated successfully."
    );


    await loadUsers();


  } catch (error) {

    console.error(
      "Update user error:",
      error
    );

    showToast(
      error.message ||
      "Could not update user."
    );

  }

};


/* ==================================================
   DELETE USER
================================================== */

window.deleteUser =
async function(id) {

  const user =
    users.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!user) return;


  const confirmed =
    confirm(
      `Delete "${user.name || user.email}"?`
    );


  if (!confirmed) return;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("admin_users")
        .delete()
        .eq("id", id);


    if (error) throw error;


    showToast(
      "User deleted successfully."
    );


    await loadUsers();


  } catch (error) {

    console.error(
      "Delete user error:",
      error
    );

    showToast(
      error.message ||
      "Could not delete user."
    );

  }

};


/* ==================================================
   DASHBOARD
================================================== */

function goDashboard() {

  window.location.href =
    "admin-dashboard.html";

}


/* ==================================================
   TOAST
================================================== */

function showToast(message) {

  const toast =
    document.getElementById(
      "usersToast"
    );


  toast.textContent =
    message;


  toast.classList.add("show");


  setTimeout(() => {

    toast.classList.remove("show");

  }, 3000);

}


/* ==================================================
   HELPERS
================================================== */

function formatDate(date) {

  if (!date) return "—";


  const parsed =
    new Date(date);


  if (
    Number.isNaN(
      parsed.getTime()
    )
  ) {

    return "—";

  }


  return parsed.toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );

}


function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


/* ==================================================
   CLOSE MODAL ON BACKDROP
================================================== */

document.getElementById(
  "userModal"
).addEventListener(
  "click",
  event => {

    if (
      event.target.id ===
      "userModal"
    ) {

      closeUserModal();

    }

  }
);
