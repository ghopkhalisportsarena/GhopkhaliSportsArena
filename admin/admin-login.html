<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <title>Admin Login | Ghopkhali Sports Arena</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f7;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 38px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .eyebrow {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    h1 span {
      color: #d71920;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d8d8d8;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }

    input:focus {
      border-color: #111;
      background: #fff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 7px;
      height: 38px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #555;
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-button:hover {
      background: #222;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error-box {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      color: #c00;
      font-size: 13px;
      line-height: 1.5;
    }

    .success-box {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      background: #effff2;
      border: 1px solid #ccefd2;
      color: #16852b;
      font-size: 13px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #666;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover {
      color: #111;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="logo">
        <img
          src="gsa.png"
          alt="Ghopkhali Sports Arena"
        >
      </div>

      <div class="eyebrow">
        GHOPKHALI SPORTS ARENA
      </div>

      <h1>
        Admin <span>Login.</span>
      </h1>

      <p class="subtitle">
        Sign in to access the GSA administration panel.
      </p>

      <div
        id="errorBox"
        class="error-box"
      ></div>

      <div
        id="successBox"
        class="success-box"
      ></div>

      <form id="loginForm">

        <div class="input-group">

          <label for="email">
            ADMIN EMAIL
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="input-group">

          <label for="password">
            PASSWORD
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              SHOW
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >

          <span id="loginText">
            Sign In →
          </span>

          <span
            id="loadingText"
            class="loading"
          >
            <span class="spinner"></span>
            Signing in...
          </span>

        </button>

      </form>

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to Ghopkhali Sports Arena
      </a>

    </div>

    <div class="footer">
      © <span id="year"></span>
      Ghopkhali Sports Arena.
      Admin Portal.
    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const SUPABASE_URL =
      "https://cmygmswzokyrmgdnuszq.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginText =
      document.getElementById("loginText");

    const loadingText =
      document.getElementById("loadingText");

    const errorBox =
      document.getElementById("errorBox");

    const successBox =
      document.getElementById("successBox");

    const showPassword =
      document.getElementById("showPassword");

    const year =
      document.getElementById("year");


    year.textContent =
      new Date().getFullYear();


    /* =========================================
       SHOW / HIDE PASSWORD
    ========================================= */

    showPassword.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          showPassword.textContent =
            "HIDE";

        } else {

          passwordInput.type = "password";

          showPassword.textContent =
            "SHOW";

        }

      }
    );


    /* =========================================
       MESSAGE
    ========================================= */

    function showError(message) {

      errorBox.textContent = message;

      errorBox.style.display = "block";

      successBox.style.display = "none";

    }


    function showSuccess(message) {

      successBox.textContent = message;

      successBox.style.display = "block";

      errorBox.style.display = "none";

    }


    function clearMessages() {

      errorBox.style.display = "none";

      successBox.style.display = "none";

    }


    /* =========================================
       LOADING
    ========================================= */

    function setLoading(loading) {

      loginButton.disabled = loading;

      if (loading) {

        loginText.style.display = "none";

        loadingText.style.display = "flex";

      } else {

        loginText.style.display = "inline";

        loadingText.style.display = "none";

      }

    }


    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();

        if (error) {

          console.error(
            "Session check error:",
            error
          );

          return;

        }

        if (data?.session?.user) {

          window.location.replace(
            "admin-dashboard.html"
          );

        }

      } catch (error) {

        console.error(
          "Session error:",
          error
        );

      }

    }


    checkExistingSession();


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessages();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showError(
            "Please enter your email and password."
          );

          return;

        }


        setLoading(true);


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email,
                password
              });


          if (error) {

            throw error;

          }


          if (!data?.session) {

            throw new Error(
              "Login successful, but no active session was created."
            );

          }


          showSuccess(
            "Login successful. Opening dashboard..."
          );


          setTimeout(
            () => {

              window.location.replace(
                "admin-dashboard.html"
              );

            },
            500
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          let message =
            "Login failed. Please try again.";


          if (
            error.message
              ?.toLowerCase()
              .includes("invalid login credentials")
          ) {

            message =
              "Invalid email or password.";

          } else if (
            error.message
          ) {

            message =
              error.message;

          }


          showError(message);

          setLoading(false);

        }

      }
    );


    /* =========================================
       AUTH STATE
    ========================================= */

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === "SIGNED_IN" &&
          session?.user
        ) {

          console.log(
            "Admin authenticated:",
            session.user.email
          );

        }

      }
    );

  </script>

</body>
</html>
