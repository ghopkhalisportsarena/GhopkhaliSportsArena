<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f5f5f7"
>

<title>Gallery | GSA Admin</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #111;
}

.admin-header {
  background: #111;
  color: #fff;
  padding: 18px 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 50%;
  background: #fff;
}

.brand strong {
  display: block;
  font-size: 16px;
  letter-spacing: 1px;
}

.brand span {
  display: block;
  font-size: 11px;
  color: #aaa;
  margin-top: 3px;
}

.back-button {
  text-decoration: none;
  color: #111;
  background: #fff;
  padding: 11px 17px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 20px 60px;
}

.page-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 30px;
}

.label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #777;
  margin-bottom: 10px;
}

h1 {
  font-size: clamp(30px, 5vw, 52px);
  line-height: 1;
}

h1 span {
  color: #e21b23;
}

.description {
  margin-top: 12px;
  color: #666;
  max-width: 600px;
  line-height: 1.6;
}

.add-button {
  border: 0;
  background: #111;
  color: #fff;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  white-space: nowrap;
}

.add-button:hover {
  background: #e21b23;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.gallery-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e5e5e5;
}

.gallery-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #eee;
  overflow: hidden;
}

.gallery-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.gallery-info {
  padding: 15px;
}

.gallery-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
}

.gallery-date {
  color: #888;
  font-size: 12px;
}

.gallery-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.small-button {
  flex: 1;
  border: 0;
  padding: 9px;
  border-radius: 7px;
  background: #eee;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.small-button.delete {
  background: #ffe7e7;
  color: #c40000;
}

.empty {
  grid-column: 1 / -1;
  background: #fff;
  border: 1px dashed #ccc;
  border-radius: 14px;
  padding: 60px 20px;
  text-align: center;
  color: #777;
}

.empty strong {
  display: block;
  color: #111;
  font-size: 18px;
  margin-bottom: 8px;
}

.loading {
  text-align: center;
  padding: 60px;
  color: #777;
  grid-column: 1 / -1;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 560px;
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}

.close {
  position: absolute;
  right: 18px;
  top: 14px;
  border: 0;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
}

.modal-box h2 {
  margin-bottom: 25px;
  font-size: 28px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: .5px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
  outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #111;
}

.submit-button {
  width: 100%;
  border: 0;
  background: #111;
  color: #fff;
  padding: 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

.submit-button:hover {
  background: #e21b23;
}

.message {
  margin-top: 15px;
  font-size: 13px;
  text-align: center;
}

@media (max-width: 900px) {

  .gallery-grid {
    grid-template-columns: repeat(3, 1fr);
  }

}

@media (max-width: 650px) {

  .admin-header {
    padding: 14px 16px;
  }

  .brand img {
    width: 40px;
    height: 40px;
  }

  .back-button {
    padding: 9px 12px;
  }

  main {
    padding: 25px 15px 50px;
  }

  .page-top {
    align-items: flex-start;
    flex-direction: column;
  }

  .add-button {
    width: 100%;
  }

  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

}

@media (max-width: 400px) {

  .gallery-grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header class="admin-header">

  <div class="brand">

    <img
      src="gsa.png"
      alt="GSA"
    >

    <div>

      <strong>
        GSA ADMIN
      </strong>

      <span>
        GHOPKHALI SPORTS ARENA
      </span>

    </div>

  </div>


  <a
    href="admin-dashboard.html"
    class="back-button"
  >
    ← Dashboard
  </a>

</header>



<main>


  <div class="page-top">

    <div>

      <div class="label">
        GSA ADMINISTRATION / GALLERY
      </div>

      <h1>
        Club <span>Gallery.</span>
      </h1>

      <p class="description">
        Manage photos from matches, tournaments,
        training sessions and Ghopkhali Sports Arena
        community activities.
      </p>

    </div>


    <button
      class="add-button"
      id="openAddButton"
    >
      + Add Photo
    </button>

  </div>



  <section
    class="gallery-grid"
    id="galleryGrid"
  >

    <div class="loading">
      Loading gallery...
    </div>

  </section>


</main>



<!-- ADD PHOTO MODAL -->

<div
  class="modal"
  id="galleryModal"
>

  <div class="modal-box">

    <button
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      ×
    </button>


    <div class="label">
      CONTENT MANAGEMENT
    </div>

    <h2>
      Add Gallery Photo
    </h2>


    <form id="galleryForm">

      <div class="form-group">

        <label>
          PHOTO URL
        </label>

        <input
          type="url"
          id="photoUrl"
          placeholder="https://example.com/photo.jpg"
          required
        >

      </div>


      <div class="form-group">

        <label>
          TITLE
        </label>

        <input
          type="text"
          id="photoTitle"
          placeholder="Enter photo title"
          required
        >

      </div>


      <div class="form-group">

        <label>
          DESCRIPTION
        </label>

        <textarea
          id="photoDescription"
          rows="4"
          placeholder="Optional description"
        ></textarea>

      </div>


      <button
        type="submit"
        class="submit-button"
      >
        Add Photo
      </button>


      <div
        class="message"
        id="formMessage"
      ></div>

    </form>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://cmygmswzokyrmgdnuszq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1l";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const galleryGrid =
  document.getElementById("galleryGrid");

const modal =
  document.getElementById("galleryModal");

const openButton =
  document.getElementById("openAddButton");

const closeButton =
  document.getElementById("closeModal");

const form =
  document.getElementById("galleryForm");

const message =
  document.getElementById("formMessage");



/* =========================================
   MODAL
========================================= */

openButton.addEventListener("click", () => {

  modal.classList.add("open");

});


closeButton.addEventListener("click", () => {

  modal.classList.remove("open");

});


modal.addEventListener("click", (event) => {

  if (event.target === modal) {

    modal.classList.remove("open");

  }

});



/* =========================================
   LOAD GALLERY
========================================= */

async function loadGallery() {

  galleryGrid.innerHTML = `
    <div class="loading">
      Loading gallery...
    </div>
  `;


  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("gallery")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      throw error;

    }


    if (!data || data.length === 0) {

      galleryGrid.innerHTML = `
        <div class="empty">

          <strong>
            No gallery photos yet
          </strong>

          <p>
            Click "Add Photo" to add your first
            gallery image.
          </p>

        </div>
      `;

      return;

    }


    galleryGrid.innerHTML =
      data.map(renderPhoto).join("");


  } catch (error) {

    console.error(
      "Gallery loading error:",
      error
    );


    galleryGrid.innerHTML = `
      <div class="empty">

        <strong>
          Could not load gallery
        </strong>

        <p>
          ${escapeHTML(error.message)}
        </p>

      </div>
    `;

  }

}



/* =========================================
   RENDER PHOTO
========================================= */

function renderPhoto(photo) {

  const id =
    escapeAttribute(photo.id);

  const title =
    escapeHTML(
      photo.title || "GSA Photo"
    );

  const description =
    escapeHTML(
      photo.description || ""
    );

  const imageUrl =
    escapeAttribute(
      photo.image_url ||
      photo.url ||
      ""
    );

  const date =
    photo.created_at
      ? new Date(
          photo.created_at
        ).toLocaleDateString(
          "en-US",
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        )
      : "";


  return `

    <article
      class="gallery-card"
      data-id="${id}"
    >

      <div class="gallery-image">

        <img
          src="${imageUrl}"
          alt="${title}"
          loading="lazy"
          onerror="this.src='gsa.png'"
        >

      </div>


      <div class="gallery-info">

        <div class="gallery-title">
          ${title}
        </div>

        <div class="gallery-date">
          ${date}
        </div>

        ${
          description
            ? `<p style="font-size:12px;color:#777;margin-top:8px;">
                ${description}
              </p>`
            : ""
        }


        <div class="gallery-actions">

          <button
            class="small-button delete"
            onclick="deletePhoto('${id}')"
          >
            Delete
          </button>

        </div>

      </div>

    </article>

  `;

}



/* =========================================
   ADD PHOTO
========================================= */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const imageUrl =
      document
        .getElementById("photoUrl")
        .value
        .trim();


    const title =
      document
        .getElementById("photoTitle")
        .value
        .trim();


    const description =
      document
        .getElementById("photoDescription")
        .value
        .trim();


    message.textContent =
      "Saving...";


    try {

      const {
        error
      } = await supabaseClient
        .from("gallery")
        .insert({

          title,

          description,

          image_url:
            imageUrl

        });


      if (error) {

        throw error;

      }


      message.textContent =
        "Photo added successfully.";


      form.reset();


      await loadGallery();


      setTimeout(() => {

        modal.classList.remove("open");

        message.textContent = "";

      }, 800);


    } catch (error) {

      console.error(
        "Add photo error:",
        error
      );


      message.textContent =
        error.message ||
        "Failed to add photo.";

    }

  }
);



/* =========================================
   DELETE PHOTO
========================================= */

window.deletePhoto =
  async function(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this photo?"
      );


    if (!confirmed) return;


    try {

      const {
        error
      } = await supabaseClient
        .from("gallery")
        .delete()
        .eq("id", id);


      if (error) {

        throw error;

      }


      await loadGallery();


    } catch (error) {

      console.error(
        "Delete photo error:",
        error
      );


      alert(
        error.message ||
        "Failed to delete photo."
      );

    }

  };



/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHTML(value);

}



/* =========================================
   START
========================================= */

loadGallery();

</script>


</body>

</html>
