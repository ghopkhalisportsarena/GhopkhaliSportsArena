    <script>

        async function startSingleMatchmaking(
            playerId,
            tournamentId,
            playerCode
        ) {

            const maxWaitTime =
                10 * 60 * 1000;

            const startedAt =
                Date.now();

            let checking = false;

            function showMatchStatus(text) {

                let status =
                    document.getElementById(
                        "matchStatus"
                    );

                if (!status) {

                    status =
                        document.createElement(
                            "div"
                        );

                    status.id =
                        "matchStatus";

                    status.style.marginTop =
                        "15px";

                    status.style.padding =
                        "12px";

                    status.style.borderRadius =
                        "10px";

                    status.style.background =
                        "#f1f5f9";

                    status.style.color =
                        "#334155";

                    status.style.textAlign =
                        "center";

                    const parent =
                        playerCodeElement
                            ?.parentElement ||
                        document.body;

                    parent.appendChild(
                        status
                    );
                }

                status.textContent =
                    text;
            }


            async function checkForMatch() {

                if (checking) {
                    return;
                }

                checking = true;

                try {

                    /* -----------------------------------------
                       FIRST: CHECK WHETHER PLAYER ALREADY HAS
                       A MATCH
                    ----------------------------------------- */

                    const existing =
                        await supabaseClient
                            .from("ludo_matches")
                            .select(
                                "id, match_code, status, players"
                            )
                            .eq(
                                "tournament_id",
                                tournamentId
                            )
                            .in(
                                "status",
                                [
                                    "ready",
                                    "playing"
                                ]
                            )
                            .contains(
                                "players",
                                [
                                    {
                                        player_id:
                                            String(
                                                playerId
                                            )
                                    }
                                ]
                            )
                            .limit(1);

                    if (
                        existing.data &&
                        existing.data.length
                    ) {

                        const match =
                            existing.data[0];

                        openSingleMatch(
                            match,
                            playerCode
                        );

                        return;
                    }


                    /* -----------------------------------------
                       ASK SERVER TO MATCH PLAYER
                    ----------------------------------------- */

                    const rpc =
                        await supabaseClient
                            .rpc(
                                "create_single_ludo_match",
                                {
                                    p_tournament_id:
                                        tournamentId,

                                    p_player_id:
                                        playerId
                                }
                            );


                    if (rpc.error) {

                        console.error(
                            "MATCHMAKING RPC ERROR:",
                            rpc.error
                        );

                        showMatchStatus(
                            "Opponent খোঁজা হচ্ছে..."
                        );

                    } else {

                        const result =
                            rpc.data;

                        console.log(
                            "MATCHMAKING RESULT:",
                            result
                        );


                        if (
                            result &&
                            result.matched === true
                        ) {

                            openSingleMatch(
                                result,
                                playerCode
                            );

                            return;
                        }


                        showMatchStatus(
                            "Opponent খোঁজা হচ্ছে..."
                        );
                    }


                    /* -----------------------------------------
                       CHECK AGAIN AFTER RPC
                    ----------------------------------------- */

                    const afterRpc =
                        await supabaseClient
                            .from("ludo_matches")
                            .select(
                                "id, match_code, status, players"
                            )
                            .eq(
                                "tournament_id",
                                tournamentId
                            )
                            .in(
                                "status",
                                [
                                    "ready",
                                    "playing"
                                ]
                            )
                            .contains(
                                "players",
                                [
                                    {
                                        player_id:
                                            String(
                                                playerId
                                            )
                                    }
                                ]
                            )
                            .limit(1);


                    if (
                        afterRpc.data &&
                        afterRpc.data.length
                    ) {

                        openSingleMatch(
                            afterRpc.data[0],
                            playerCode
                        );

                        return;
                    }


                } catch (error) {

                    console.error(
                        "MATCHMAKING ERROR:",
                        error
                    );

                    showMatchStatus(
                        "Opponent খোঁজা হচ্ছে..."
                    );

                } finally {

                    checking = false;
                }
            }


            function openSingleMatch(
                match,
                code
            ) {

                if (!match) {
                    return;
                }


                const matchId =
                    match.id ||
                    match.match_id;

                const matchCode =
                    match.match_code ||
                    match.code ||
                    "";


                if (!matchId) {

                    console.error(
                        "MATCH ID NOT FOUND:",
                        match
                    );

                    return;
                }


                localStorage.setItem(
                    "gsa_ludo_match_id",
                    String(matchId)
                );

                localStorage.setItem(
                    "gsa_ludo_match_code",
                    String(matchCode)
                );

                localStorage.setItem(
                    "gsa_ludo_player_id",
                    String(playerId)
                );

                localStorage.setItem(
                    "gsa_ludo_player_code",
                    String(code)
                );


                showMatchStatus(
                    "✓ Opponent পাওয়া গেছে! Match শুরু হচ্ছে..."
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "./single.html?match=" +
                            encodeURIComponent(
                                matchId
                            ) +
                            "&code=" +
                            encodeURIComponent(
                                matchCode
                            );

                    },
                    700
                );
            }


            showMatchStatus(
                "Opponent খোঁজা হচ্ছে..."
            );


            await checkForMatch();


            const timer =
                setInterval(
                    async function () {

                        if (
                            Date.now() -
                            startedAt >
                            maxWaitTime
                        ) {

                            clearInterval(
                                timer
                            );

                            showMatchStatus(
                                "অনেকক্ষণ ধরে opponent পাওয়া যায়নি। আবার চেষ্টা করুন।"
                            );

                            return;
                        }


                        await checkForMatch();

                    },
                    2000
                );
        }




        /* =================================================
           SUPABASE CONFIG
        ================================================= */

        const SUPABASE_URL =
            "https://cmygmswzokyrmgdnuszq.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";


        const {
            createClient
        } = window.supabase;


        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =================================================
           ELEMENTS
        ================================================= */

        const form =
            document.getElementById(
                "joinForm"
            );


        const playerNameInput =
            document.getElementById(
                "playerName"
            );


        const joinBtn =
            document.getElementById(
                "joinBtn"
            );


        const message =
            document.getElementById(
                "message"
            );


        const codeBox =
            document.getElementById(
                "codeBox"
            );


        const playerCodeElement =
            document.getElementById(
                "playerCode"
            );


        const tournamentNameElement =
            document.getElementById(
                "tournamentName"
            );



        /* =================================================
           SHOW MESSAGE
        ================================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;


            message.className =
                "message show " +
                type;

        }



        /* =================================================
           GENERATE PLAYER CODE
        ================================================= */

        function generatePlayerCode() {

            const chars =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


            let code =
                "";


            for (
                let i = 0;
                i < 6;
                i++
            ) {

                code +=
                    chars[
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    ];

            }


            return "S-" + code;

        }



        /* =================================================
           LOAD TOURNAMENT
        ================================================= */

        async function loadTournament() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(
                        "ludo_tournaments"
                    )
                    .select(
                        "*"
                    )
                    .eq(
                        "tournament_type",
                        "single"
                    )
                    .order(
                        "created_at",
                        {
                            ascending:
                                true
                        }
                    )
                    .limit(
                        1
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Tournament Load Error:",
                    error
                );


                showMessage(
                    "Tournament তথ্য লোড করা যায়নি।",
                    "error"
                );


                return null;

            }


            if (!data) {

                showMessage(
                    "কোনো Single Tournament পাওয়া যায়নি।",
                    "error"
                );


                return null;

            }


            tournamentNameElement.textContent =
                data.tournament_name;


            if (
                data.status !==
                "registration"
            ) {

                showMessage(
                    "এই Tournament-এ বর্তমানে Registration বন্ধ আছে।",
                    "error"
                );


                joinBtn.disabled =
                    true;


                return null;

            }


            return data;

        }



        /* =================================================
           CHECK CAPACITY
        ================================================= */

        async function checkCapacity(
            tournamentId
        ) {

            const {
                count,
                error
            } =
                await supabaseClient
                    .from(
                        "ludo_players"
                    )
                    .select(
                        "id",
                        {
                            count:
                                "exact",

                            head:
                                true
                        }
                    )
                    .eq(
                        "tournament_id",
                        tournamentId
                    );


            if (error) {

                console.error(
                    "Capacity Error:",
                    error
                );


                throw error;

            }


            return count || 0;

        }



        /* =================================================
           CHECK PLAYER CODE
        ================================================= */

        async function playerCodeExists(
            code
        ) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(
                        "ludo_players"
                    )
                    .select(
                        "id"
                    )
                    .eq(
                        "player_code",
                        code
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Player Code Check Error:",
                    error
                );


                throw error;

            }


            return !!data;

        }



        /* =================================================
           CREATE UNIQUE PLAYER CODE
        ================================================= */

        function createUniquePlayerCode() {

            const chars =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            const timePart =
                Date.now().toString(36).toUpperCase();

            let randomPart = "";

            for (let i = 0; i < 8; i++) {
                randomPart += chars.charAt(
                    Math.floor(
                        Math.random() * chars.length
                    )
                );
            }

            return "S-" +
                timePart.slice(-6) +
                randomPart;
        }



        /* =================================================
           PLAYER JOIN
        ================================================= */

        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const name =
                    playerNameInput
                        .value
                        .trim();


                /* -----------------------------------------
                   NAME VALIDATION
                ----------------------------------------- */

                if (!name) {

                    showMessage(
                        "আপনার নাম লিখুন।",
                        "error"
                    );


                    return;

                }


                if (
                    name.length <
                    2
                ) {

                    showMessage(
                        "অনুগ্রহ করে সঠিক নাম লিখুন।",
                        "error"
                    );


                    return;

                }


                /* -----------------------------------------
                   LOADING
                ----------------------------------------- */

                joinBtn.disabled =
                    true;


                joinBtn.textContent =
                    "Join করা হচ্ছে...";


                try {


                    /* -------------------------------------
                       LOAD TOURNAMENT
                    ------------------------------------- */

                    const tournament =
                        await loadTournament();


                    if (!tournament) {

                        joinBtn.disabled =
                            false;


                        joinBtn.textContent =
                            "🎲 Tournament-এ Join করুন";


                        return;

                    }



                    /* -------------------------------------
                       CHECK CAPACITY
                    ------------------------------------- */

                    const count =
                        await checkCapacity(
                            tournament.id
                        );


                    if (
                        count >=
                        50
                    ) {

                        showMessage(
                            "দুঃখিত, Single Tournament-এর ৫০ জন Player পূর্ণ হয়ে গেছে।",
                            "error"
                        );


                        joinBtn.disabled =
                            true;


                        return;

                    }



                    /* -------------------------------------
                       CREATE PLAYER CODE
                    ------------------------------------- */

                    const generatedPlayerCode =
                        createUniquePlayerCode();

                    console.log(
                        "LUDO JOIN: tournament =",
                        tournament.id
                    );

                    console.log(
                        "LUDO JOIN: player code =",
                        generatedPlayerCode
                    );



                    /* -------------------------------------
                       INSERT PLAYER
                    ------------------------------------- */

                    const result =
                        await supabaseClient
                            .from("ludo_players")
                            .insert({
                                tournament_id:
                                    tournament.id,

                                player_name:
                                    name,

                                player_code:
                                    generatedPlayerCode,

                                status:
                                    "active"
                            })
                            .select()
                            .single();


                    if (result.error) {

                        console.error(
                            "LUDO PLAYER INSERT ERROR:",
                            result.error
                        );

                        throw new Error(
                            "Player insert failed: " +
                            result.error.message
                        );

                    }


                    const data =
                        result.data;



                    /* -------------------------------------
                       SHOW PLAYER CODE
                    ------------------------------------- */

                    const finalPlayerCode =
                        data?.player_code ||
                        generatedPlayerCode;

                    playerCodeElement.textContent =
                        finalPlayerCode;

                    console.log(
                        "LUDO PLAYER CODE:",
                        finalPlayerCode
                    );


                    codeBox.classList.add(
                        "show"
                    );


                    /* -------------------------------------
                       START AUTOMATIC 1 VS 1 MATCHMAKING
                    ------------------------------------- */

                    localStorage.setItem(
                        "gsa_ludo_player_id",
                        String(data.id)
                    );

                    localStorage.setItem(
                        "gsa_ludo_tournament_id",
                        String(tournament.id)
                    );

                    localStorage.setItem(
                        "gsa_ludo_player_code",
                        String(finalPlayerCode)
                    );


                    startSingleMatchmaking(
                        data.id,
                        tournament.id,
                        finalPlayerCode
                    );



                    /* -------------------------------------
                       SUCCESS MESSAGE
                    ------------------------------------- */

                    showMessage(
                        "🎉 অভিনন্দন! আপনি সফলভাবে Single Tournament-এ Join করেছেন।",
                        "success"
                    );



                    /* -------------------------------------
                       LOCK FORM
                    ------------------------------------- */

                    playerNameInput.disabled =
                        true;


                    joinBtn.disabled =
                        true;


                    joinBtn.textContent =
                        "✓ Successfully Joined";



                    /* -------------------------------------
                       CONSOLE
                    ------------------------------------- */

                    console.log(
                        "Player Joined Successfully:",
                        data
                    );

                }


                catch (error) {

                    console.error(
                        "Player Join Error:",
                        error
                    );


                    showMessage(
                        "Join করা যায়নি: " +
                        (
                            error?.message ||
                            "Unknown error"
                        ),
                        "error"
                    );


                    joinBtn.disabled =
                        false;


                    joinBtn.textContent =
                        "🎲 Tournament-এ Join করুন";

                }

            }
        );



        /* =================================================
           INITIAL LOAD
        ================================================= */

        loadTournament();


    </script>


</body>

</html>
