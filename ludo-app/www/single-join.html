         STYLE

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #e8f0ff 0%,
                    #f7f9fc 45%,
                    #ffffff 100%
                );

            color: #111827;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* =================================================
           CARD
        ================================================= */

        .card {

            width: 100%;

            max-width: 480px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .84
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .9
                );

            border-radius: 30px;

            padding: 30px;

            box-shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    .10
                ),

                inset 0 1px 0
                rgba(
                    255,
                    255,
                    255,
                    .9
                );

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            animation:
                cardEnter
                .45s
                ease;

        }


        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }

           LOGO
        ================================================= */

        .logo {

            width: 70px;

            height: 70px;

            margin:
                0 auto 18px;

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            background:
                #111827;

            color:
                #ffffff;

            box-shadow:
                0 12px 30px
                rgba(
                    0,
                    0,
                    0,
                    .15
                );

        }


        /* =================================================
           TITLE
        ================================================= */

        h1 {

            text-align: center;

            margin: 0;

            font-size: 28px;

            letter-spacing:
                -.7px;

        }


        .subtitle {

            text-align: center;

            color:
                #6b7280;

            margin:
                8px 0 28px;

            font-size: 14px;

        }

           TOURNAMENT INFO
        ================================================= */

        .tournament {

            background:
                #f3f4f6;

            border-radius:
                18px;

            padding:
                16px;

            margin-bottom:
                22px;

            text-align:
                center;

        }


        .tournament strong {

            display:
                block;

            font-size:
                17px;

            margin-bottom:
                5px;

        }


        .tournament span {

            font-size:
                13px;

            color:
                #6b7280;

        }


        /* =================================================
           FORM
        ================================================= */

        label {

            display:
                block;

            margin-bottom:
                8px;

            font-weight:
                600;

            font-size:
                14px;

        }


        input {

            width:
                100%;

            border:
                1px solid
                #d1d5db;

            background:
                #ffffff;

            border-radius:
                16px;

            padding:
                15px 16px;

            font-size:
                16px;

            outline:
                none;

            transition:
                .2s;

        input:focus {

            border-color:
                #111827;

            box-shadow:

                20px;

                0;

            border-radius:

            padding:
                16px;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                16px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                .2s;

        }


        .join-btn:hover {

            transform:
                translateY(-1px);

            opacity:
                .92;

        }


        .join-btn:active {

            transform:
                scale(.98);

        }


        .join-btn:disabled {

            opacity:
                .55;

            cursor:

        }


        /* =================================================

        ================================================= */

            margin-top:
                18px;

                block;

        }


        .success {

            background:

                #fef2f2;

            color:

        }

        .code-box {

                none;

                20px;

            text-align:
                center;

            padding:

            border-radius:
                20px;

            background:
                #f3f4f6;

            animation:
                codeEnter
                .35s
                ease;

        .code-box.show {

            display:
                block;

        }

                    0;

            to {

                opacity:

                break-all;

        .code-note {

            margin-top:
                8px;

            color:
                #6b7280;

            font-size:
                12px;

        }


        /* =================================================
           FOOTER
        ================================================= */

        .footer {

            text-align:
                center;

            margin-top:
                24px;

            color:
                #9ca3af;

            font-size:
                12px;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 480px

            body {

            }

    </style>

</head>

        function showMessage(

            type
        ) {

            message.textContent =
                text;


            message.className =
                "message show " +
                type;

        }



        /* =================================================
           GENERATE PLAYER CODE
        ================================================= */

        function generatePlayerCode() {

            const chars =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


            let code =
                "";


            for (
                let i = 0;
                i < 6;
                i++
            ) {

                code +=
                    chars[
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    ];

            }


            return "S-" + code;

        }



        /* =================================================
           LOAD TOURNAMENT
        ================================================= */

        async function loadTournament() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(
                        "ludo_tournaments"
                    )
                    .select(
                        "*"
                    )
                    .eq(
                        "tournament_type",
                        "single"
                    )
                    .order(
                        "created_at",
                        {
                            ascending:
                                true
                        }
                    )
                    .limit(
                        1
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Tournament Load Error:",
                    error
                );


                showMessage(
                    "Tournament তথ্য লোড করা যায়নি।",
                    "error"
                );


                return null;

            }


            if (!data) {

                showMessage(
                    "কোনো Single Tournament পাওয়া যায়নি।",
                    "error"
                );


                return null;

            }


            tournamentNameElement.textContent =
                data.tournament_name;


            if (
                data.status !==
                "registration"
            ) {

                showMessage(
                    "এই Tournament-এ বর্তমানে Registration বন্ধ আছে।",
                    "error"
                );


                joinBtn.disabled =
                    true;


                return null;

            }


            return data;

        }



        /* =================================================
           CHECK CAPACITY
        ================================================= */

        async function checkCapacity(
            tournamentId
        ) {

            const {
                count,
                error
            } =
                await supabaseClient
                    .from(
                        "ludo_players"
                    )
                    .select(
                        "id",
                        {
                            count:
                                "exact",

                            head:
                                true
                        }
                    )
                    .eq(
                        "tournament_id",
                        tournamentId
                    );


            if (error) {

                console.error(
                    "Capacity Error:",
                    error
                );


                throw error;

            }


            return count || 0;

        }



        /* =================================================
           CREATE UNIQUE PLAYER CODE
        ================================================= */

        function createUniquePlayerCode() {

            const chars =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            let code =
                "S-";

            for (let i = 0; i < 6; i++) {

                code +=
                    chars.charAt(
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    );

            }

            return code;

        }

                    );

                }


                /* -----------------------------------------

                joinBtn.disabled =
                    true;


                joinBtn.textContent =
                    "Join করা হচ্ছে...";


                try {

            }
