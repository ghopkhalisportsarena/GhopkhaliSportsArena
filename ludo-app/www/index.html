<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Ghopkhali Ludo</title>
<link rel="stylesheet" href="ludo-core.css">
</head>
<body>
<div class="app">
<header class="header">
<div class="brand">Ghopkhali Ludo</div>
<div class="subtitle">Premium multiplayer board gaming</div>
</header>

<div class="grid">
<div class="card primary" onclick="location.href='single-join.html'">
<div class="card-icon">◉</div>
<h2>Single · 1 vs 1</h2>
<p>Challenge another human player in a real-time match.</p>
</div>

<div class="card" onclick="location.href='double-join.html'">
<div class="card-icon">◉</div>
<h2>Double · 2 vs 2</h2>
<p>Build two teams and play together.</p>
</div>

<div class="card" onclick="location.href='verify.html'">
<div class="card-icon">✓</div>
<h2>Verify</h2>
<p>Check player and match information.</p>
</div>

<div class="card primary" onclick="location.href='single.html?demo=1'">
<div class="card-icon">◆</div>
<h2>Practice Board</h2>
<p>Open the complete Ludo board without joining a match.</p>
</div>
</div>
</div>

<script>
document.addEventListener("backbutton",function(){
    history.length>1 ? history.back() : navigator.app.exitApp();
});
</script>
</body>
</html>
