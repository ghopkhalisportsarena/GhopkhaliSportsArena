<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghopkhali Sports Arena - Practice Ludo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#090b10;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:14px;
}

.app{
    width:min(100%,520px);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.title{
    font-size:21px;
    font-weight:800;
}

.subtitle{
    margin-top:3px;
    color:#858c99;
    font-size:12px;
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#1b1f27;
    color:white;
    font-size:24px;
}

.game-card{
    background:#141820;
    border:1px solid #292f39;
    border-radius:22px;
    padding:12px;
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    overflow:hidden;
    border-radius:15px;
    background:white;
}

.board-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.token-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.token{
    position:absolute;
    width:7.2%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px solid rgba(255,255,255,.95);
    z-index:10;
    pointer-events:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:900;
    cursor:pointer;

    box-shadow:
        0 3px 5px rgba(0,0,0,.45),
        inset 0 2px 3px rgba(255,255,255,.65),
        inset 0 -3px 4px rgba(0,0,0,.25);

    transition:
        left .12s linear,
        top .12s linear,
        transform .12s ease;
}

.token::after{
    content:"";
    position:absolute;
    width:35%;
    height:35%;
    top:13%;
    left:20%;
    border-radius:50%;
    background:rgba(255,255,255,.48);
}

.token.red{
    background:
        radial-gradient(
            circle at 30% 25%,
            #ff7777 0%,
            #ed2525 35%,
            #a90000 100%
        );
}

.token.yellow{
    color:#4d3b00;
    background:
        radial-gradient(
            circle at 30% 25%,
            #fff59a 0%,
            #ffd600 35%,
            #d39d00 100%
        );
}

.token.movable{
    outline:3px solid white;
    box-shadow:
        0 0 0 4px rgba(255,255,255,.25),
        0 4px 12px rgba(0,0,0,.6);
    animation:tokenPulse .8s infinite;
}

@keyframes tokenPulse{
    50%{
        transform:translate(-50%,-50%) scale(1.14);
    }
}

.controls{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.player{
    background:#1b2029;
    border:1px solid #2b313c;
    border-radius:14px;
    padding:10px;
    text-align:center;
}

.player-name{
    font-size:13px;
    font-weight:800;
}

.player-status{
    margin-top:4px;
    font-size:11px;
    color:#8e96a4;
}

.red-text{
    color:#ff4545;
}

.yellow-text{
    color:#ffd400;
}

.dice-area{
    margin-top:10px;
    display:flex;
    gap:10px;
    align-items:center;
}

.dice{
    width:70px;
    height:70px;
    background:#fff;
    color:#111;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    line-height:1;
    box-shadow:
        0 5px 15px rgba(0,0,0,.4);
    user-select:none;
}

.dice.rolling{
    animation:diceRoll .12s linear infinite;
}

@keyframes diceRoll{
    0%{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(12deg) scale(1.08);
    }
    100%{
        transform:rotate(-12deg) scale(1);
    }
}

.roll{
    flex:1;
    height:58px;
    border:0;
    border-radius:16px;
    background:#fff;
    color:#111;
    font-size:16px;
    font-weight:900;
}

.roll:disabled{
    opacity:.35;
}

.message{
    margin-top:10px;
    background:#1b2029;
    border-radius:13px;
    padding:11px;
    text-align:center;
    font-size:12px;
    color:#aeb5c0;
}

.reset{
    width:100%;
    height:45px;
    margin-top:10px;
    border:1px solid #303742;
    border-radius:13px;
    background:#1b2029;
    color:#fff;
    font-weight:800;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

    <div>
        <div class="title">Practice Ludo</div>
        <div class="subtitle">
            Ghopkhali Sports Arena
        </div>
    </div>

    <button
        class="back"
        onclick="goBack()"
    >‹</button>

</div>

<div class="game-card">

<div class="board">

    <img
        src="images/Ludo-board.jpg"
        class="board-image"
        alt="Ludo Board"
    >

    <div
        id="tokenLayer"
        class="token-layer"
    ></div>

</div>

<div class="controls">

    <div class="player">
        <div class="player-name red-text">
            RED
        </div>

        <div
            id="redStatus"
            class="player-status"
        >
            Your turn
        </div>
    </div>

    <div class="player">
        <div class="player-name yellow-text">
            YELLOW
        </div>

        <div
            id="yellowStatus"
            class="player-status"
        >
            Waiting
        </div>
    </div>

</div>

<div class="dice-area">

    <div
        id="dice"
        class="dice"
    >🎲</div>

    <button
        id="rollButton"
        class="roll"
        onclick="rollDice()"
    >
        ROLL DICE
    </button>

</div>

<div
    id="message"
    class="message"
>
    Red player's turn. Roll the dice.
</div>

<button
    class="reset"
    onclick="resetGame()"
>
    Reset Practice Game
</button>

</div>
</div>

<script>

/* =====================================================
   GAME CONSTANTS
===================================================== */

const STORAGE_KEY =
    "gsa_practice_ludo_v2";

const TRACK = [

    [6,0],[6,1],[6,2],[6,3],[6,4],[6,5],

    [5,6],[4,6],[3,6],[2,6],[1,6],[0,6],

    [0,7],[0,8],

    [1,8],[2,8],[3,8],[4,8],[5,8],

    [6,9],[6,10],[6,11],[6,12],[6,13],[6,14],

    [7,14],[8,14],

    [8,13],[8,12],[8,11],[8,10],[8,9],

    [9,8],[10,8],[11,8],[12,8],[13,8],

    [14,8],[14,7],[14,6],

    [13,6],[12,6],[11,6],[10,6],[9,6],

    [8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0]

];


/*
   IMPORTANT:

   progress 0 = actual START cell.

   Red start:
   TRACK[0] = [6,0]

   Yellow start:
   TRACK[26] = [8,14]
*/

const START = {

    red:0,

    yellow:26

};


/* Home positions */

const HOME = {

    red:[
        [2,2],
        [2,4],
        [4,2],
        [4,4]
    ],

    yellow:[
        [10,10],
        [10,12],
        [12,10],
        [12,12]
    ]

};


/* Final coloured lanes */

const HOME_LANE = {

    red:[
        [7,1],
        [7,2],
        [7,3],
        [7,4],
        [7,5]
    ],

    yellow:[
        [7,13],
        [7,12],
        [7,11],
        [7,10],
        [7,9]
    ]

};


/* =====================================================
   GAME STATE
===================================================== */

let game =
    loadGame();


function defaultGame(){

    return {

        current:"red",

        dice:null,

        rolled:false,

        winner:null,

        moving:false,

        tokens:{

            red:[
                {progress:-1},
                {progress:-1},
                {progress:-1},
                {progress:-1}
            ],

            yellow:[
                {progress:-1},
                {progress:-1},
                {progress:-1},
                {progress:-1}
            ]

        }

    };

}


/* =====================================================
   SAVE / LOAD
===================================================== */

function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                parsed &&
                parsed.tokens &&
                parsed.tokens.red &&
                parsed.tokens.yellow
            ){

                return parsed;

            }

        }

    }catch(error){

        console.log(error);

    }

    return defaultGame();

}


function saveGame(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(game)
        );

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioContext = null;


function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

    return audioContext;

}


function soundTone(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    try{

        const ctx =
            getAudio();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + duration
        );

    }catch(error){}

}


function soundClick(){

    soundTone(
        520,
        .07,
        "square",
        .04
    );

}


function soundDice(){

    soundTone(
        180,
        .08,
        "square",
        .05
    );

    setTimeout(
        () => soundTone(
            260,
            .08,
            "square",
            .05
        ),
        80
    );

}


function soundStep(){

    soundTone(
        420,
        .055,
        "sine",
        .045
    );

}


function soundStart(){

    soundTone(
        620,
        .12,
        "triangle",
        .07
    );

    setTimeout(
        () => soundTone(
            820,
            .12,
            "triangle",
            .07
        ),
        100
    );

}


function soundCapture(){

    soundTone(
        180,
        .15,
        "sawtooth",
        .07
    );

}


function soundSix(){

    soundTone(
        650,
        .1,
        "triangle",
        .07
    );

    setTimeout(
        () => soundTone(
            900,
            .15,
            "triangle",
            .07
        ),
        100
    );

}


function soundWin(){

    const notes =
        [523,659,784,1046];

    notes.forEach(
        (note,index)=>{

            setTimeout(
                () =>
                    soundTone(
                        note,
                        .18,
                        "triangle",
                        .08
                    ),
                index * 130
            );

        }
    );

}


/* =====================================================
   COORDINATES
===================================================== */

function percent(row,col){

    return {

        left:
            ((col + .5) / 15 * 100) + "%",

        top:
            ((row + .5) / 15 * 100) + "%"

    };

}


function coordinateFor(
    color,
    token,
    index
){

    const progress =
        token.progress;


    /*
       HOME
    */

    if(progress < 0){

        return HOME[color][index];

    }


    /*
       MAIN TRACK

       progress 0 is START itself.
    */

    if(progress < 52){

        const trackIndex =
            (
                START[color] +
                progress
            ) % 52;

        return TRACK[trackIndex];

    }


    /*
       COLOURED HOME LANE
    */

    const laneIndex =
        progress - 52;

    if(laneIndex < 5){

        return HOME_LANE[color][laneIndex];

    }


    /*
       FINAL CENTER
    */

    return [7,7];

}


/* =====================================================
   MOVEMENT RULE
===================================================== */

function canMove(
    token,
    dice
){

    if(
        dice === null ||
        game.moving
    ){

        return false;

    }


    if(token.progress === -1){

        return dice === 6;

    }


    return (
        token.progress + dice
        <= 57
    );

}


/* =====================================================
   TOKEN CREATION
===================================================== */

function createToken(
    color,
    index
){

    const token =
        game.tokens[color][index];

    const position =
        coordinateFor(
            color,
            token,
            index
        );

    const element =
        document.createElement("button");

    element.className =
        "token " + color;

    element.textContent =
        index + 1;

    const p =
        percent(
            position[0],
            position[1]
        );

    element.style.left =
        p.left;

    element.style.top =
        p.top;


    if(
        game.current === color &&
        game.rolled &&
        canMove(
            token,
            game.dice
        )
    ){

        element.classList.add(
            "movable"
        );

        element.onclick =
            function(){

                moveToken(
                    color,
                    index
                );

            };

    }


    return element;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const layer =
        document.getElementById(
            "tokenLayer"
        );

    layer.innerHTML = "";


    ["red","yellow"].forEach(
        color=>{

            game.tokens[color]
                .forEach(
                    (_,index)=>{

                        layer.appendChild(
                            createToken(
                                color,
                                index
                            )
                        );

                    }
                );

        }
    );


    const dice =
        document.getElementById(
            "dice"
        );


    if(game.dice === null){

        dice.textContent = "🎲";

    }else{

        dice.textContent =
            diceEmoji(game.dice);

    }


    const rollButton =
        document.getElementById(
            "rollButton"
        );

    rollButton.disabled =
        game.rolled ||
        game.moving ||
        !!game.winner;


    document.getElementById(
        "redStatus"
    ).textContent =
        game.current === "red"
        ? "Your turn"
        : "Waiting";


    document.getElementById(
        "yellowStatus"
    ).textContent =
        game.current === "yellow"
        ? "Your turn"
        : "Waiting";


    const message =
        document.getElementById(
            "message"
        );


    if(game.winner){

        message.textContent =
            game.winner.toUpperCase()
            + " player wins!";

    }else if(game.rolled){

        message.textContent =
            "Select a highlighted token.";

    }else{

        message.textContent =
            game.current === "red"
            ? "Red player's turn. Roll the dice."
            : "Yellow player's turn. Roll the dice.";

    }


    saveGame();

}


/* =====================================================
   DICE VISUAL
===================================================== */

function diceEmoji(value){

    const faces = {

        1:"⚀",
        2:"⚁",
        3:"⚂",
        4:"⚃",
        5:"⚄",
        6:"⚅"

    };

    return faces[value];

}


/* =====================================================
   ROLL DICE
===================================================== */

function rollDice(){

    if(
        game.rolled ||
        game.moving ||
        game.winner
    ){

        return;

    }


    soundClick();


    const dice =
        document.getElementById(
            "dice"
        );

    dice.classList.add(
        "rolling"
    );


    const button =
        document.getElementById(
            "rollButton"
        );

    button.disabled=true;


    let count=0;


    const animation =
        setInterval(
            ()=>{

                const random =
                    Math.floor(
                        Math.random()*6
                    ) + 1;

                dice.textContent =
                    diceEmoji(random);

                soundDice();

                count++;


                if(count >= 12){

                    clearInterval(
                        animation
                    );

                    dice.classList.remove(
                        "rolling"
                    );


                    const value =
                        Math.floor(
                            Math.random()*6
                        ) + 1;


                    game.dice =
                        value;

                    game.rolled =
                        true;


                    dice.textContent =
                        diceEmoji(value);


                    if(value === 6){

                        soundSix();

                    }


                    const valid =
                        game.tokens[
                            game.current
                        ].some(
                            token =>
                                canMove(
                                    token,
                                    value
                                )
                        );


                    if(!valid){

                        game.rolled=false;


                        if(value !== 6){

                            setTimeout(
                                switchTurn,
                                450
                            );

                        }

                    }


                    render();

                }

            },
            75
        );

}


/* =====================================================
   MOVE TOKEN ONE CELL AT A TIME
===================================================== */

async function moveToken(
    color,
    index
){

    if(
        color !== game.current ||
        !game.rolled ||
        game.moving ||
        game.winner
    ){

        return;

    }


    const token =
        game.tokens[color][index];


    if(
        !canMove(
            token,
            game.dice
        )
    ){

        return;

    }


    game.moving=true;

    render();


    const dice =
        game.dice;


    /*
       HOME -> START

       With a 6, directly place the token
       on progress 0 = exact START cell.
    */

    if(token.progress === -1){

        token.progress=0;

        render();

        soundStart();

        await wait(250);

    }else{

        /*
           Move exactly one cell at a time.
        */

        for(
            let step=0;
            step<dice;
            step++
        ){

            token.progress++;

            render();

            soundStep();

            await wait(150);

        }

    }


    const captured =
        captureOpponents(
            color,
            token
        );


    if(captured){

        soundCapture();

    }


    const finished =
        token.progress >= 57;


    game.dice=null;

    game.rolled=false;

    game.moving=false;


    /*
       WIN
    */

    if(
        game.tokens[color]
        .every(
            token =>
                token.progress >= 57
        )
    ){

        game.winner=color;

        soundWin();

        render();

        return;

    }


    /*
       6 = extra turn
       Capture = extra turn
    */

    if(
        dice === 6 ||
        captured
    ){

        render();

        return;

    }


    switchTurn();

    render();

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   CAPTURE
===================================================== */

function captureOpponents(
    color,
    movedToken
){

    if(
        movedToken.progress < 0 ||
        movedToken.progress >= 52
    ){

        return false;

    }


    const index =
        (
            START[color] +
            movedToken.progress
        ) % 52;


    /*
       Standard safe positions.
    */

    const safe = [

        0,
        8,
        13,
        21,
        26,
        34,
        39,
        47

    ];


    if(
        safe.includes(index)
    ){

        return false;

    }


    const opponent =
        color === "red"
        ? "yellow"
        : "red";


    let captured=false;


    game.tokens[opponent]
        .forEach(
            token=>{

                if(
                    token.progress >= 0 &&
                    token.progress < 52
                ){

                    const otherIndex =
                        (
                            START[opponent] +
                            token.progress
                        ) % 52;


                    if(
                        otherIndex === index
                    ){

                        token.progress=-1;

                        captured=true;

                    }

                }

            }
        );


    return captured;

}


/* =====================================================
   TURN
===================================================== */

function switchTurn(){

    game.current =
        game.current === "red"
        ? "yellow"
        : "red";

    game.dice=null;

    game.rolled=false;

    game.moving=false;

    render();

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    soundClick();

    game =
        defaultGame();

    saveGame();

    render();

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

render();


/*
   Unlock audio after first user interaction.
*/

document.addEventListener(
    "click",
    function(){

        try{

            getAudio();

        }catch(error){}

    },
    {once:true}
);

</script>

</body>
</html>
