<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghopkhali Sports Arena - Practice Ludo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#0b0d12;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:14px;
}

.app{
    width:min(100%,520px);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.title{
    font-size:21px;
    font-weight:700;
}

.subtitle{
    color:#8f96a3;
    font-size:12px;
    margin-top:3px;
}

.back{
    border:0;
    background:#1b1f28;
    color:#fff;
    width:40px;
    height:40px;
    border-radius:12px;
    font-size:20px;
}

.game-card{
    background:#141820;
    border:1px solid #252b35;
    border-radius:22px;
    padding:12px;
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:15px;
    background:#fff;
}

.board-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.token-layer{
    position:absolute;
    inset:0;
}

.token{
    position:absolute;
    width:8%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px solid rgba(255,255,255,.95);
    box-shadow:
        0 3px 8px rgba(0,0,0,.45),
        inset 0 2px 2px rgba(255,255,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:800;
    color:#fff;
    z-index:5;
    cursor:pointer;
    transition:left .22s ease,top .22s ease,transform .15s ease;
}

.token:active{
    transform:translate(-50%,-50%) scale(.9);
}

.token.red{
    background:#e53935;
}

.token.yellow{
    background:#f6c400;
    color:#171717;
}

.token.movable{
    outline:3px solid #fff;
    box-shadow:
        0 0 0 4px rgba(255,255,255,.25),
        0 4px 12px rgba(0,0,0,.55);
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:translate(-50%,-50%) scale(1.12);
    }
}

.controls{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.player{
    background:#1b2029;
    border:1px solid #2a303b;
    border-radius:14px;
    padding:11px;
    text-align:center;
}

.player-name{
    font-size:13px;
    font-weight:700;
}

.player-status{
    margin-top:4px;
    font-size:11px;
    color:#9299a6;
}

.red-text{
    color:#ff4b47;
}

.yellow-text{
    color:#ffd21a;
}

.dice-area{
    margin-top:10px;
    display:flex;
    gap:10px;
}

.dice{
    width:72px;
    height:72px;
    background:#fff;
    color:#111;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:800;
    box-shadow:0 5px 16px rgba(0,0,0,.3);
}

.roll{
    flex:1;
    border:0;
    border-radius:16px;
    background:#fff;
    color:#111;
    font-size:16px;
    font-weight:800;
}

.roll:disabled{
    opacity:.35;
}

.message{
    margin-top:10px;
    background:#1b2029;
    border-radius:13px;
    padding:11px;
    text-align:center;
    font-size:12px;
    color:#aeb5c1;
}

.reset{
    margin-top:10px;
    width:100%;
    height:45px;
    border:1px solid #303642;
    border-radius:13px;
    background:#1b2029;
    color:#fff;
    font-weight:700;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <div class="title">Practice Ludo</div>
            <div class="subtitle">Ghopkhali Sports Arena</div>
        </div>

        <button class="back" onclick="goBack()">‹</button>
    </div>

    <div class="game-card">

        <div class="board">

            <img
                src="images/Ludo-board.jpg"
                class="board-image"
                alt="Ludo Board"
            >

            <div
                id="tokenLayer"
                class="token-layer"
            ></div>

        </div>

        <div class="controls">

            <div class="player">
                <div class="player-name red-text">
                    RED
                </div>
                <div
                    id="redStatus"
                    class="player-status"
                >
                    Your turn
                </div>
            </div>

            <div class="player">
                <div class="player-name yellow-text">
                    YELLOW
                </div>
                <div
                    id="yellowStatus"
                    class="player-status"
                >
                    Waiting
                </div>
            </div>

        </div>

        <div class="dice-area">

            <div
                id="dice"
                class="dice"
            >
                —
            </div>

            <button
                id="rollButton"
                class="roll"
                onclick="rollDice()"
            >
                ROLL DICE
            </button>

        </div>

        <div
            id="message"
            class="message"
        >
            Red player's turn. Roll the dice.
        </div>

        <button
            class="reset"
            onclick="resetGame()"
        >
            Reset Practice Game
        </button>

    </div>

</div>

<script>

const STORAGE_KEY = "gsa_practice_ludo_v1";

const TRACK = [
    [6,0],[6,1],[6,2],[6,3],[6,4],[6,5],
    [5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
    [0,7],[0,8],
    [1,8],[2,8],[3,8],[4,8],[5,8],
    [6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
    [7,14],[8,14],
    [8,13],[8,12],[8,11],[8,10],[8,9],
    [9,8],[10,8],[11,8],[12,8],[13,8],
    [14,8],[14,7],[14,6],
    [13,6],[12,6],[11,6],[10,6],[9,6],
    [8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0]
];

const START = {
    red:0,
    yellow:26
};

const HOME = {
    red:[
        [2,2],[2,4],[4,2],[4,4]
    ],
    yellow:[
        [10,10],[10,12],[12,10],[12,12]
    ]
};

const HOME_LANE = {
    red:[
        [7,1],[7,2],[7,3],[7,4],[7,5]
    ],
    yellow:[
        [7,13],[7,12],[7,11],[7,10],[7,9]
    ]
};

let game = loadGame();

function defaultGame(){

    return {
        current:"red",
        dice:null,
        rolled:false,
        winner:null,

        tokens:{
            red:[
                {progress:-1},
                {progress:-1},
                {progress:-1},
                {progress:-1}
            ],

            yellow:[
                {progress:-1},
                {progress:-1},
                {progress:-1},
                {progress:-1}
            ]
        }
    };
}

function loadGame(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){
            return JSON.parse(saved);
        }

    }catch(e){}

    return defaultGame();
}

function saveGame(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(game)
    );
}

function percent(row,col){

    return {
        left:((col+.5)/15*100)+"%",
        top:((row+.5)/15*100)+"%"
    };
}

function coordinateFor(color,token){

    const progress =
        token.progress;

    if(progress < 0){

        return HOME[color][
            game.tokens[color].indexOf(token)
        ];

    }

    if(progress < 52){

        const index =
            (START[color] + progress) % 52;

        return TRACK[index];

    }

    const laneIndex =
        progress - 52;

    if(laneIndex < 5){

        return HOME_LANE[color][laneIndex];

    }

    return [7,7];
}

function canMove(token,dice){

    if(dice === null){
        return false;
    }

    if(token.progress === -1){
        return dice === 6;
    }

    return token.progress + dice <= 57;
}

function createToken(color,index){

    const token =
        game.tokens[color][index];

    const pos =
        coordinateFor(color,token);

    const el =
        document.createElement("button");

    el.className =
        "token " + color;

    el.textContent =
        index + 1;

    const p =
        percent(pos[0],pos[1]);

    el.style.left =
        p.left;

    el.style.top =
        p.top;

    if(
        game.current === color &&
        game.rolled &&
        canMove(token,game.dice)
    ){

        el.classList.add("movable");

        el.onclick = function(){

            moveToken(color,index);

        };

    }

    return el;
}

function render(){

    const layer =
        document.getElementById("tokenLayer");

    layer.innerHTML="";

    ["red","yellow"].forEach(color=>{

        game.tokens[color].forEach(
            (_,index)=>{

                layer.appendChild(
                    createToken(color,index)
                );

            }
        );

    });

    document.getElementById("dice")
        .textContent =
        game.dice === null
        ? "—"
        : game.dice;

    const rollButton =
        document.getElementById("rollButton");

    rollButton.disabled =
        game.rolled ||
        !!game.winner;

    document.getElementById("redStatus")
        .textContent =
        game.current === "red"
        ? "Your turn"
        : "Waiting";

    document.getElementById("yellowStatus")
        .textContent =
        game.current === "yellow"
        ? "Your turn"
        : "Waiting";

    if(game.winner){

        document.getElementById("message")
            .textContent =
            game.winner.toUpperCase()
            + " player wins!";

    }else if(game.rolled){

        document.getElementById("message")
            .textContent =
            "Select a highlighted token.";

    }else{

        document.getElementById("message")
            .textContent =
            game.current === "red"
            ? "Red player's turn. Roll the dice."
            : "Yellow player's turn. Roll the dice.";

    }

    saveGame();
}

function rollDice(){

    if(game.rolled || game.winner){
        return;
    }

    const button =
        document.getElementById("rollButton");

    button.disabled=true;

    let count=0;

    const timer =
        setInterval(()=>{

            const n =
                Math.floor(
                    Math.random()*6
                )+1;

            document.getElementById("dice")
                .textContent=n;

            count++;

            if(count>=10){

                clearInterval(timer);

                game.dice =
                    Math.floor(
                        Math.random()*6
                    )+1;

                game.rolled=true;

                document.getElementById("dice")
                    .textContent =
                    game.dice;

                const valid =
                    game.tokens[game.current]
                    .some(t =>
                        canMove(
                            t,
                            game.dice
                        )
                    );

                if(!valid){

                    if(game.dice !== 6){

                        switchTurn();

                    }else{

                        game.rolled=false;

                    }

                }

                render();

            }

        },70);
}

function moveToken(color,index){

    if(
        color !== game.current ||
        !game.rolled ||
        game.winner
    ){
        return;
    }

    const token =
        game.tokens[color][index];

    if(!canMove(token,game.dice)){
        return;
    }

    const dice =
        game.dice;

    if(token.progress === -1){

        token.progress=0;

    }else{

        token.progress += dice;

    }

    const captured =
        captureOpponents(
            color,
            token
        );

    const finished =
        token.progress >= 57;

    game.dice=null;
    game.rolled=false;

    if(
        game.tokens[color]
        .every(t => t.progress >= 57)
    ){

        game.winner=color;

        render();

        return;
    }

    if(
        dice === 6 ||
        captured
    ){

        render();

        return;
    }

    switchTurn();

    render();
}

function captureOpponents(color,movedToken){

    if(
        movedToken.progress < 0 ||
        movedToken.progress >= 52
    ){
        return false;
    }

    const index =
        (START[color] +
         movedToken.progress) % 52;

    const safe =
        [0,8,13,21,26,34,39,47];

    if(safe.includes(index)){
        return false;
    }

    const opponent =
        color === "red"
        ? "yellow"
        : "red";

    let captured=false;

    game.tokens[opponent]
        .forEach(token=>{

            if(
                token.progress >= 0 &&
                token.progress < 52
            ){

                const otherIndex =
                    (START[opponent] +
                     token.progress) % 52;

                if(
                    otherIndex === index
                ){

                    token.progress=-1;
                    captured=true;

                }

            }

        });

    return captured;
}

function switchTurn(){

    game.current =
        game.current === "red"
        ? "yellow"
        : "red";

    game.dice=null;
    game.rolled=false;
}

function resetGame(){

    game=defaultGame();

    saveGame();

    render();
}

function goBack(){

    if(history.length>1){
        history.back();
    }else{
        window.location.href="index.html";
    }
}

render();

</script>

</body>
</html>
