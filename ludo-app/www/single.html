<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Ludo | Ghopkhali Sports Arena</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:#f2f2f7;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "SF Pro Text","Segoe UI",sans-serif;
}

.app{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:16px 12px 30px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.title{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.7px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.back{
    border:0;
    background:none;
    color:#007aff;
    font-size:16px;
    font-weight:700;
    padding:8px;
}

.status{
    padding:13px;
    margin-bottom:12px;
    text-align:center;
    background:#fff;
    border-radius:16px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.board-card{
    background:#fff;
    padding:7px;
    border-radius:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.14);
}

.board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1;
    overflow:hidden;
    border-radius:19px;
    background:#fff;
}

.board-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
}

.token-layer{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.token{
    position:absolute;
    width:6.5%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:
        0 3px 8px rgba(0,0,0,.32),
        inset 0 2px 3px rgba(255,255,255,.5);
    pointer-events:auto;
    transition:
        left .2s ease,
        top .2s ease,
        transform .2s ease;
    cursor:pointer;
}

.token.red{background:#e53935}
.token.green{background:#24a148}
.token.yellow{background:#f5c400}
.token.blue{background:#1677d2}

.token-highlight{
    transform:translate(-50%,-50%) scale(1.2);
    box-shadow:
        0 0 0 4px rgba(0,122,255,.28),
        0 5px 13px rgba(0,0,0,.35);
    animation:pulse .7s infinite alternate;
}

@keyframes pulse{
    from{filter:brightness(1)}
    to{filter:brightness(1.25)}
}

.controls{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:10px;
    margin-top:13px;
}

.dice-button,
.reset-button{
    min-height:58px;
    border-radius:18px;
    font-size:17px;
    font-weight:800;
}

.dice-button{
    border:0;
    background:#111;
    color:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.dice-button:disabled{
    opacity:.42;
}

.reset-button{
    border:1px solid #ddd;
    background:#fff;
    color:#111;
}

.dice{
    margin-top:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:64px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.dice-face{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#fff;
    border:2px solid #111;
    font-size:25px;
    font-weight:900;
}

.players{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.player{
    padding:13px;
    border-radius:16px;
    background:#fff;
    border:2px solid transparent;
    font-size:13px;
    font-weight:800;
    text-align:center;
}

.player.red{color:#d9231d}
.player.yellow{color:#9a7600}

.player.active{
    border-color:#007aff;
    box-shadow:0 5px 18px rgba(0,122,255,.13);
}

.winner{
    display:none;
    margin-top:12px;
    padding:16px;
    border-radius:17px;
    background:#111;
    color:#fff;
    text-align:center;
    font-weight:800;
}

@media(max-width:390px){
    .app{padding-left:8px;padding-right:8px}
    .title{font-size:22px}
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">
    <div>
        <div class="title">Practice Ludo</div>
        <div class="subtitle">1 vs 1 Human</div>
    </div>

    <button class="back" onclick="goBack()">Back</button>
</div>

<div id="status" class="status">
    Red Player's turn — Roll the dice
</div>

<div class="board-card">
    <div class="board-wrap">

        <img
            src="images/Ludo-board.jpg"
            class="board-image"
            alt="Ludo Board"
        >

        <div
            id="tokenLayer"
            class="token-layer"
        ></div>

    </div>
</div>

<div class="players">

    <div
        id="redPlayer"
        class="player red active"
    >
        RED — Player 1
    </div>

    <div
        id="yellowPlayer"
        class="player yellow"
    >
        YELLOW — Player 2
    </div>

</div>

<div class="dice">

    <span>Dice</span>

    <div
        id="diceFace"
        class="dice-face"
    >
        —
    </div>

</div>

<div class="controls">

<button
    id="rollButton"
    class="dice-button"
    onclick="rollGameDice()"
>
    Roll Dice
</button>

<button
    class="reset-button"
    onclick="resetPractice()"
>
    New Game
</button>

</div>

<div
    id="winner"
    class="winner"
></div>

</div>

<script src="ludo-board-v12.js"></script>

<script>

let gameStarted = false;

const BOARD_SIZE = 15;

function goBack(){

    if(window.history.length > 1){
        history.back();
    }else{
        location.href = "index.html";
    }
}

function coordinateToPercent(row,col){

    return {
        left:((col + .5) / BOARD_SIZE) * 100,
        top:((row + .5) / BOARD_SIZE) * 100
    };
}

function renderPracticeTokens(){

    const layer =
        document.getElementById("tokenLayer");

    if(!layer) return;

    layer.innerHTML = "";

    const state =
        window.LudoBoard.getState();

    Object.keys(state.tokens).forEach(color => {

        state.tokens[color].forEach((token,index) => {

            const coordinate =
                window.LudoBoard.getTokenCoordinate(
                    color,
                    token
                );

            if(!coordinate) return;

            const position =
                coordinateToPercent(
                    coordinate[0],
                    coordinate[1]
                );

            const el =
                document.createElement("div");

            el.className =
                "token " + color;

            el.dataset.color =
                color;

            el.dataset.index =
                index;

            el.style.left =
                position.left + "%";

            el.style.top =
                position.top + "%";

            if(
                color === state.currentPlayer &&
                state.diceRolled &&
                window.LudoBoard.canMove(
                    color,
                    token,
                    state.dice
                )
            ){

                el.classList.add(
                    "token-highlight"
                );
            }

            layer.appendChild(el);

        });

    });

}

function rollGameDice(){

    const state =
        window.LudoBoard.getState();

    if(
        state.winner ||
        state.diceRolled
    ){
        return;
    }

    const value =
        window.LudoBoard.rollDice();

    gameStarted = true;

    document.getElementById(
        "diceFace"
    ).textContent =
        value ?? "—";

    renderPracticeTokens();

    updateUI();
}

function tokenClick(event){

    const token =
        event.target.closest(".token");

    if(!token) return;

    const color =
        token.dataset.color;

    const index =
        Number(token.dataset.index);

    const moved =
        window.LudoBoard.moveToken(
            color,
            index
        );

    if(moved){

        renderPracticeTokens();

        updateUI();
    }

}

function updateUI(){

    const state =
        window.LudoBoard.getState();

    const status =
        document.getElementById("status");

    const roll =
        document.getElementById("rollButton");

    const red =
        document.getElementById("redPlayer");

    const yellow =
        document.getElementById("yellowPlayer");

    red.classList.toggle(
        "active",
        state.currentPlayer === "red"
    );

    yellow.classList.toggle(
        "active",
        state.currentPlayer === "yellow"
    );

    if(state.winner){

        status.textContent =
            state.winner.toUpperCase() +
            " PLAYER WINS!";

        roll.disabled = true;

        const winner =
            document.getElementById("winner");

        winner.style.display =
            "block";

        winner.textContent =
            state.winner.toUpperCase() +
            " PLAYER WINS!";

        return;
    }

    const player =
        state.currentPlayer === "red"
            ? "Red Player"
            : "Yellow Player";

    if(state.diceRolled){

        status.textContent =
            player +
            " — Select a highlighted token";

        roll.disabled = true;

    }else{

        status.textContent =
            player +
            "'s turn — Roll the dice";

        roll.disabled = false;
    }

}

function resetPractice(){

    window.LudoBoard.reset();

    document.getElementById(
        "diceFace"
    ).textContent = "—";

    document.getElementById(
        "winner"
    ).style.display = "none";

    renderPracticeTokens();

    updateUI();
}

document.addEventListener(
    "click",
    tokenClick
);

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderPracticeTokens();

        updateUI();

    }
);

document.addEventListener(
    "backbutton",
    goBack,
    false
);

</script>

</body>
</html>
