<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Ghopkhali Ludo · Single</title>
<link rel="stylesheet" href="ludo-core.css">
</head>

<body>
<div class="app">

<button class="back" onclick="history.back()">‹ Back</button>

<header class="header">
<div class="brand">Ludo Match</div>
<div class="subtitle">1 vs 1 · Human Match</div>
</header>

<div class="board-wrap">
<div id="board" class="board"></div>
</div>

<div class="controls">
<div id="turn" class="turn">Red's turn</div>
<button id="dice" class="dice">Roll</button>
</div>

</div>

<script src="ludo-board-v12.js"></script>
<script>
const board=document.getElementById("board");
const turn=document.getElementById("turn");
const dice=document.getElementById("dice");

LudoV12.renderGame(board,turn,dice);

dice.onclick=()=>{
    LudoV12.rollDice(board,turn,dice);
};
</script>
</body>
</html>
