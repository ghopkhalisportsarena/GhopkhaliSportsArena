<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Single Tournament — Player Join</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #e8f0ff 0%,
                    #f7f9fc 45%,
                    #ffffff 100%
                );

            color: #111827;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;

            background: rgba(255,255,255,.82);

            border: 1px solid rgba(255,255,255,.9);

            border-radius: 30px;

            padding: 30px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.10),
                inset 0 1px 0 rgba(255,255,255,.9);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            background: #111827;
            color: white;

            box-shadow: 0 12px 30px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            margin: 0;

            font-size: 28px;
            letter-spacing: -0.7px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 28px;
            font-size: 14px;
        }

        .tournament {
            background: #f3f4f6;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
            text-align: center;
        }

        .tournament strong {
            display: block;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .tournament span {
            font-size: 13px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;

            border: 1px solid #d1d5db;

            background: white;

            border-radius: 16px;

            padding: 15px 16px;

            font-size: 16px;

            outline: none;

            transition: .2s;
        }

        input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 4px rgba(17,24,39,.08);
        }

        .join-btn {
            width: 100%;

            margin-top: 20px;

            border: 0;

            border-radius: 17px;

            padding: 16px;

            background: #111827;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        .join-btn:hover {
            transform: translateY(-1px);
            opacity: .92;
        }

        .join-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 14px;

            display: none;

            font-size: 14px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .success {
            background: #ecfdf5;
            color: #047857;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .code-box {
            display: none;

            margin-top: 20px;

            text-align: center;

            padding: 18px;

            border-radius: 20px;

            background: #f3f4f6;
        }

        .code-box.show {
            display: block;
        }

        .code-label {
            color: #6b7280;
            font-size: 13px;
        }

        .player-code {
            margin-top: 7px;

            font-size: 25px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .footer {
            text-align: center;

            margin-top: 24px;

            color: #9ca3af;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        🎲
    </div>

    <h1>
        Single Tournament
    </h1>

    <div class="subtitle">
        Player Registration
    </div>

    <div class="tournament">
        <strong id="tournamentName">
            Ludo Single Tournament
        </strong>

        <span>
            ন্যূনতম ২ জন • সর্বোচ্চ ৫০ জন
        </span>
    </div>

    <form id="joinForm">

        <label for="playerName">
            আপনার নাম
        </label>

        <input
            id="playerName"
            type="text"
            placeholder="আপনার পূর্ণ নাম লিখুন"
            maxlength="80"
            required
            autocomplete="name"
        >

        <button
            class="join-btn"
            id="joinBtn"
            type="submit"
        >
            🎲 Tournament-এ Join করুন
        </button>

    </form>

    <div
        class="message"
        id="message"
    ></div>

    <div
        class="code-box"
        id="codeBox"
    >
        <div class="code-label">
            আপনার Player Code
        </div>

        <div
            class="player-code"
            id="playerCode"
        >
            —
        </div>
    </div>

    <div class="footer">
        Ghopkhali Sports Arena
    </div>

</div>


<script>

    const SUPABASE_URL =
        "https://cmygmswzokyrmgdnuszq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_w1Hq5KwIxMjyiWf7HL10qg_9bYRwz1L";

    const {
        createClient
    } = window.supabase;

    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const form =
        document.getElementById(
            "joinForm"
        );

    const playerName =
        document.getElementById(
            "playerName"
        );

    const joinBtn =
        document.getElementById(
            "joinBtn"
        );

    const message =
        document.getElementById(
            "message"
        );

    const codeBox =
        document.getElementById(
            "codeBox"
        );

    const playerCode =
        document.getElementById(
            "playerCode"
        );

    const tournamentName =
        document.getElementById(
            "tournamentName"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message show " +
            type;
    }


    function generateCode() {

        const chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            code +=
                chars[
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                ];
        }

        return "S-" + code;
    }


    async function loadTournament() {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "ludo_tournaments"
                )
                .select("*")
                .eq(
                    "tournament_type",
                    "single"
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(1)
                .maybeSingle();

        if (error) {

            console.error(error);

            showMessage(
                "Tournament তথ্য লোড করা যায়নি।",
                "error"
            );

            return null;
        }

        if (!data) {

            showMessage(
                "কোনো Single Tournament পাওয়া যায়নি।",
                "error"
            );

            return null;
        }

        tournamentName.textContent =
            data.tournament_name;

        if (
            data.status !==
            "registration"
        ) {

            showMessage(
                "এই Tournament-এ বর্তমানে Registration বন্ধ আছে।",
                "error"
            );

            joinBtn.disabled = true;

            return null;
        }

        return data;
    }


    async function checkCapacity(
        tournamentId
    ) {

        const {
            count,
            error
        } =
            await supabaseClient
                .from(
                    "ludo_players"
                )
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "tournament_id",
                    tournamentId
                );

        if (error) {

            console.error(error);

            throw error;
        }

        return count || 0;
    }


    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const name =
                playerName.value.trim();

            if (!name) {

                showMessage(
                    "আপনার নাম লিখুন।",
                    "error"
                );

                return;
            }

            joinBtn.disabled = true;

            joinBtn.textContent =
                "Join করা হচ্ছে...";


            try {

                const tournament =
                    await loadTournament();

                if (!tournament) {
                    return;
                }


                const count =
                    await checkCapacity(
                        tournament.id
                    );


                if (count >= 50) {

                    showMessage(
                        "দুঃখিত, Single Tournament-এর ৫০ জন Player পূর্ণ হয়ে গেছে।",
                        "error"
                    );

                    return;
                }


                const playerCode =
                    generateCode();


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from(
                            "ludo_players"
                        )
                        .insert({
                            tournament_id:
                                tournament.id,

                            player_name:
                                name,

                            player_code:
                                playerCode,

                            status:
                                "active"
                        })
                        .select()
                        .single();


                if (error) {

                    console.error(error);

                    throw error;
                }


                playerCode.textContent =
                    data.player_code;

                codeBox.classList.add(
                    "show"
                );


                showMessage(
                    "🎉 অভিনন্দন! আপনি সফলভাবে Single Tournament-এ Join করেছেন।",
                    "success"
                );


                playerName.disabled =
                    true;

                joinBtn.textContent =
                    "✓ Successfully Joined";

            }

            catch (error) {

                console.error(error);

                showMessage(
                    "Join করা যায়নি: " +
                    (
                        error.message ||
                        "Unknown error"
                    ),
                    "error"
                );

                joinBtn.disabled =
                    false;

                joinBtn.textContent =
                    "🎲 Tournament-এ Join করুন";
            }

        }
    );


    loadTournament();

</script>

</body>
</html>
