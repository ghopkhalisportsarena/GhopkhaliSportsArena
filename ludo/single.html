<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b16">

<title>Single Ludo — Ghopkhali Sports Arena</title>

<style>
:root{
    --bg:#070b16;
    --panel:#0e1424;
    --panel2:#121a2d;
    --text:#f8fafc;
    --muted:#94a3b8;

    --red:#ef4444;
    --green:#22c55e;
    --yellow:#facc15;
    --blue:#3b82f6;

    --cell:#f8fafc;
    --line:#cbd5e1;

    --shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at top,#18233c 0,#070b16 48%,#03050a 100%);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    padding:18px 10px 35px;
}

.app{
    width:min(760px,100%);
}

/* =====================================================
   HEADER
===================================================== */

.header{
    text-align:center;
    margin-bottom:15px;
}

.brand{
    font-size:clamp(21px,5vw,30px);
    font-weight:900;
    letter-spacing:.3px;
}

.brand span{
    display:block;
    margin-top:3px;
    font-size:12px;
    color:#94a3b8;
    font-weight:600;
}

.live{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
    padding:6px 11px;
    border-radius:999px;
    background:rgba(239,68,68,.10);
    border:1px solid rgba(239,68,68,.25);
    color:#fca5a5;
    font-size:11px;
    font-weight:800;
}

.live i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ef4444;
    box-shadow:0 0 12px #ef4444;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{opacity:.35;transform:scale(.7)}
}

/* =====================================================
   PLAYER STANDS
===================================================== */

.stands{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:10px;
    align-items:center;
    margin-bottom:13px;
}

.player{
    position:relative;
    min-height:67px;
    padding:10px 12px;
    border-radius:18px;
    background:linear-gradient(145deg,#121b2e,#0a101e);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.player::after{
    content:"";
    position:absolute;
    inset:auto -20px -30px auto;
    width:75px;
    height:75px;
    border-radius:50%;
    opacity:.13;
}

.player.red::after{
    background:var(--red);
}

.player.blue::after{
    background:var(--blue);
}

.player.active{
    border-color:rgba(255,255,255,.35);
    transform:translateY(-1px);
}

.player.active.red{
    box-shadow:
        0 0 0 1px rgba(239,68,68,.22),
        0 14px 40px rgba(239,68,68,.16);
}

.player.active.blue{
    box-shadow:
        0 0 0 1px rgba(59,130,246,.22),
        0 14px 40px rgba(59,130,246,.16);
}

.player-top{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:37px;
    height:37px;
    flex:none;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:white;
    font-weight:900;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.3),
        0 5px 12px rgba(0,0,0,.35);
}

.red .avatar{
    background:linear-gradient(145deg,#ff6262,#b91c1c);
}

.blue .avatar{
    background:linear-gradient(145deg,#60a5fa,#1d4ed8);
}

.player-name{
    font-size:13px;
    font-weight:900;
}

.player-status{
    margin-top:2px;
    color:var(--muted);
    font-size:10px;
}

.turn-badge{
    position:absolute;
    right:9px;
    top:9px;
    padding:3px 6px;
    border-radius:6px;
    background:rgba(255,255,255,.07);
    color:#64748b;
    font-size:8px;
    font-weight:900;
    opacity:0;
}

.player.active .turn-badge{
    opacity:1;
    color:#fff;
}

.vs{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#0c1322;
    border:1px solid rgba(255,255,255,.08);
    color:#64748b;
    font-size:11px;
    font-weight:900;
}

/* =====================================================
   GAME CARD
===================================================== */

.game-card{
    padding:10px;
    border-radius:27px;
    background:
        linear-gradient(145deg,#141d31,#090f1d);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
}

/* =====================================================
   LUDO BOARD
===================================================== */

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    overflow:hidden;
    border-radius:20px;
    background:#eef2f7;
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.13),
        0 15px 35px rgba(0,0,0,.28);
}

/* Cells */

.cell{
    position:relative;
    border:1px solid rgba(30,41,59,.15);
    background:#f8fafc;
}

/* =====================================================
   FOUR HOME BASES
===================================================== */

.base{
    position:absolute;
    width:40%;
    height:40%;
    padding:5.2%;
    z-index:2;
}

.base.red{
    left:0;
    top:0;
    background:linear-gradient(145deg,#ff5b5b,#dc2626);
}

.base.green{
    right:0;
    top:0;
    background:linear-gradient(145deg,#4ade80,#16a34a);
}

.base.blue{
    right:0;
    bottom:0;
    background:linear-gradient(145deg,#60a5fa,#2563eb);
}

.base.yellow{
    left:0;
    bottom:0;
    background:linear-gradient(145deg,#fde047,#eab308);
}

.base-inner{
    width:100%;
    height:100%;
    border-radius:18%;
    background:#fff;
    box-shadow:
        inset 0 5px 12px rgba(0,0,0,.13),
        0 4px 10px rgba(0,0,0,.12);
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:14%;
    padding:15%;
}

.base-slot{
    border-radius:50%;
    background:#e5e7eb;
    box-shadow:
        inset 0 3px 7px rgba(0,0,0,.22),
        0 1px 1px rgba(255,255,255,.8);
}

/* =====================================================
   TRACK / COLORED PATHS
===================================================== */

.track-red{
    background:#fecaca;
}

.track-green{
    background:#bbf7d0;
}

.track-blue{
    background:#bfdbfe;
}

.track-yellow{
    background:#fef08a;
}

.start-red{
    background:#ef4444 !important;
}

.start-green{
    background:#22c55e !important;
}

.start-blue{
    background:#3b82f6 !important;
}

.start-yellow{
    background:#eab308 !important;
}

/* =====================================================
   SAFE CELLS
===================================================== */

.safe::before{
    content:"★";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:#64748b;
    opacity:.55;
    font-size:clamp(8px,2.3vw,15px);
}

.start-red.safe::before,
.start-green.safe::before,
.start-blue.safe::before,
.start-yellow.safe::before{
    color:#fff;
    opacity:.9;
}

/* =====================================================
   HOME LANES
===================================================== */

.home-red{
    background:#ef4444 !important;
}

.home-green{
    background:#22c55e !important;
}

.home-blue{
    background:#3b82f6 !important;
}

.home-yellow{
    background:#eab308 !important;
}

/* =====================================================
   CENTER FINISH
===================================================== */

.center{
    position:absolute;
    left:40%;
    top:40%;
    width:20%;
    height:20%;
    z-index:6;
    overflow:hidden;
    background:#fff;
    clip-path:polygon(
        0 0,
        50% 50%,
        0 100%
    );
}

.center::before{
    content:"";
    position:absolute;
    inset:0;
    background:#22c55e;
    clip-path:polygon(
        0 0,
        100% 0,
        50% 50%
    );
}

.center::after{
    content:"";
    position:absolute;
    inset:0;
    background:#3b82f6;
    clip-path:polygon(
        100% 100%,
        0 100%,
        50% 50%
    );
}

.center-red{
    position:absolute;
    inset:0;
    background:#ef4444;
    clip-path:polygon(
        0 0,
        50% 50%,
        100% 0
    );
    z-index:2;
}

.center-yellow{
    position:absolute;
    inset:0;
    background:#eab308;
    clip-path:polygon(
        0 100%,
        50% 50%,
        100% 100%
    );
    z-index:3;
}

/* =====================================================
   TOKENS
===================================================== */

.token{
    position:absolute;
    width:5.4%;
    aspect-ratio:1;
    z-index:20;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.85);

    box-shadow:
        inset 0 4px 4px rgba(255,255,255,.38),
        inset 0 -5px 7px rgba(0,0,0,.25),
        0 4px 8px rgba(0,0,0,.38);

    transform:
        translate(-50%,-50%)
        scale(1);

    transition:
        left .16s ease,
        top .16s ease,
        transform .18s ease;

    cursor:pointer;
}

.token.red{
    background:
        radial-gradient(circle at 32% 25%,#ffb0b0 0 12%,transparent 13%),
        linear-gradient(145deg,#ff5555,#b91c1c);
}

.token.blue{
    background:
        radial-gradient(circle at 32% 25%,#dbeafe 0 12%,transparent 13%),
        linear-gradient(145deg,#60a5fa,#1d4ed8);
}

.token.selectable{
    animation:
        tokenPulse 1s infinite;
}

@keyframes tokenPulse{
    50%{
        transform:
            translate(-50%,-50%)
            scale(1.22);
        filter:brightness(1.18);
    }
}

.token.moving{
    transform:
        translate(-50%,-50%)
        scale(1.22);
    z-index:40;
}

.token.capture{
    animation:capture .45s ease;
}

@keyframes capture{
    30%{
        transform:translate(-50%,-50%) scale(1.5) rotate(15deg);
    }
    100%{
        transform:translate(-50%,-50%) scale(1) rotate(0);
    }
}

/* =====================================================
   DICE AREA
===================================================== */

.control{
    margin-top:13px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
}

.turn-info{
    min-height:70px;
    padding:11px 14px;
    border-radius:17px;
    background:#0c1424;
    border:1px solid rgba(255,255,255,.07);
}

.turn-title{
    color:#64748b;
    font-size:9px;
    font-weight:900;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.turn-player{
    margin-top:3px;
    font-size:16px;
    font-weight:900;
}

.turn-help{
    margin-top:2px;
    color:#94a3b8;
    font-size:10px;
}

.dice-wrap{
    display:flex;
    align-items:center;
    gap:9px;
}

.dice{
    width:65px;
    height:65px;
    display:grid;
    place-items:center;
    border-radius:17px;
    background:
        linear-gradient(145deg,#ffffff,#dce3ec);
    color:#111827;
    box-shadow:
        0 10px 20px rgba(0,0,0,.3),
        inset 0 2px 2px rgba(255,255,255,.8);
    font-size:35px;
    font-weight:900;
    user-select:none;
}

.dice.rolling{
    animation:diceRoll .55s ease;
}

@keyframes diceRoll{
    0%{transform:rotate(0) scale(1)}
    20%{transform:rotate(18deg) scale(1.08)}
    45%{transform:rotate(-18deg) scale(.92)}
    70%{transform:rotate(12deg) scale(1.06)}
    100%{transform:rotate(0) scale(1)}
}

.roll-btn{
    min-width:92px;
    height:65px;
    border:0;
    border-radius:17px;
    background:
        linear-gradient(145deg,#f8fafc,#cbd5e1);
    color:#0f172a;
    font-size:12px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:
        0 10px 20px rgba(0,0,0,.25),
        inset 0 2px 2px rgba(255,255,255,.8);
}

.roll-btn:active{
    transform:translateY(2px) scale(.98);
}

.roll-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    margin-top:11px;
    padding:10px 12px;
    border-radius:13px;
    text-align:center;
    background:rgba(255,255,255,.035);
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
}

/* =====================================================
   RESULT MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.result{
    width:min(360px,100%);
    padding:28px 22px;
    border-radius:28px;
    text-align:center;
    background:
        linear-gradient(145deg,#172238,#0a101d);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.trophy{
    font-size:52px;
}

.result h2{
    margin:8px 0 4px;
    font-size:25px;
}

.result p{
    margin:0 0 18px;
    color:#94a3b8;
    font-size:12px;
}

.restart{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    background:#fff;
    color:#0f172a;
    font-weight:900;
    cursor:pointer;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:480px){

    body{
        padding:10px 6px 25px;
    }

    .game-card{
        padding:7px;
        border-radius:22px;
    }

    .board{
        border-radius:16px;
    }

    .stands{
        gap:6px;
    }

    .player{
        min-height:61px;
        padding:8px;
        border-radius:15px;
    }

    .avatar{
        width:32px;
        height:32px;
        font-size:11px;
    }

    .player-name{
        font-size:11px;
    }

    .player-status{
        font-size:8px;
    }

    .vs{
        width:36px;
        height:36px;
        font-size:9px;
    }

    .control{
        grid-template-columns:1fr;
    }

    .dice-wrap{
        justify-content:center;
    }

    .turn-info{
        text-align:center;
    }

    .dice{
        width:61px;
        height:61px;
    }

    .roll-btn{
        height:61px;
    }
}
</style>
</head>

    8,
    13,
    21,
    26,
    34,
    39,
    47
]);


/* =====================================================
   ACTIVE PLAYERS
===================================================== */

const players = {

    red:{
        name:"Player A",
        color:"red",
        tokens:[-1,-1,-1,-1]
    },

    blue:{
        name:"Player B",
        color:"blue",
        tokens:[-1,-1,-1,-1]
    }

};


/*
    Progress:

    -1 = Base
     0-51 = Main track
    52-57 = Home path
    58 = Finished
*/


let currentPlayer = "red";
let currentDice = null;
let gameOver = false;


/* =====================================================
   CREATE GRID
===================================================== */

const cells = {};

for(let r=0;r<15;r++){

    for(let c=0;c<15;c++){

        const cell =
            document.createElement("div");

        cell.className = "cell";

        cell.dataset.row = r;
        cell.dataset.col = c;

        board.insertBefore(
            cell,
            board.firstElementChild
        );

        cells[`${r}-${c}`] = cell;
    }
}


/* =====================================================
   COLOR TRACK CELLS
===================================================== */

function paintCell(
    r,
    c,
    className
){

    const cell =
        cells[`${r}-${c}`];

    if(cell){
        cell.classList.add(className);
    }
}


/* =====================================================
   MAIN TRACK
===================================================== */

ring.forEach(
    ([r,c], index)=>{

        const cell =
            cells[`${r}-${c}`];

        if(!cell){
            return;
        }

        if(index === startIndex.red){
            cell.classList.add("start-red");
        }

        if(index === startIndex.green){
            cell.classList.add("start-green");
        }

        if(index === startIndex.blue){
            cell.classList.add("start-blue");
        }

        if(index === startIndex.yellow){
            cell.classList.add("start-yellow");
        }

        if(safeIndexes.has(index)){
            cell.classList.add("safe");
        }

    }
);


/* =====================================================
   HOME PATH PAINT
===================================================== */

Object.entries(homePaths)
.forEach(
    ([color,path])=>{

        path.forEach(
            ([r,c])=>{

                paintCell(
                    r,
                    c,
                    `home-${color}`
                );

            }
        );

    }
);


/* =====================================================
   TOKEN ELEMENTS
===================================================== */

const tokenElements = {

    red:[],
    blue:[]

};


for(
    const color of ["red","blue"]
){

    for(let i=0;i<4;i++){

        const token =
            document.createElement("div");

        token.className =
            `token ${color}`;

        token.dataset.color =
            color;

        token.dataset.index =
            i;

        token.addEventListener(
            "click",
            ()=>{
                handleTokenClick(
                    color,
                    i
                );
            }
        );

        board.appendChild(token);

        tokenElements[color].push(token);

    }

}


/* =====================================================
   BASE TOKEN POSITIONS
===================================================== */

const basePositions = {

    red:[
        [3.0,3.0],
        [3.0,12.0],
        [12.0,3.0],
        [12.0,12.0]
    ],

    blue:[
        [88.0,88.0],
        [88.0,97.0],
        [97.0,88.0],
        [97.0,97.0]
    ]

};


/*
    These are adjusted after first render.
*/

function setTokenPosition(
    token,
    row,
    col
){

    token.style.left =
        `${((col + .5)/15)*100}%`;

    token.style.top =
        `${((row + .5)/15)*100}%`;

}


/* =====================================================
   BASE POSITION USING PERCENTAGE
===================================================== */

function setBasePosition(
    token,
    color,
    index
){

    const positions =
        basePositions[color];

    const [x,y] =
        positions[index];

    token.style.left =
        `${x}%`;

    token.style.top =
        `${y}%`;

}


/* =====================================================
   GET TOKEN BOARD POSITION
===================================================== */

function getTokenCoordinate(
    color,
    progress
){

    if(progress < 0){
        return null;
    }


    if(progress >= 0 && progress <= 51){

        const start =
            startIndex[color];

        const index =
            (start + progress) % 52;

        return ring[index];

    }


    if(progress >= 52 && progress <= 57){

        return homePaths[color][
            progress - 52
        ];

    }


    return null;
}


/* =====================================================
   RENDER TOKEN
===================================================== */

function renderTokens(){

    for(
        const color of ["red","blue"]
    ){

        players[color]
        .tokens
        .forEach(
            (progress,index)=>{

                const token =
                    tokenElements[color][index];

                token.classList.remove(
                    "selectable"
                );

                if(progress === -1){

                    setBasePosition(
                        token,
                        color,
                        index
                    );

                    return;
                }


                if(progress === 58){

                    /*
                        Finished tokens stay
                        near the center.
                    */

                    const finish =
                        color === "red"
                        ? [7,7]
                        : [7,7];

                    setTokenPosition(
                        token,
                        finish[0],
                        finish[1]
                    );

                    token.style.opacity =
                        ".65";

                    return;
                }


                token.style.opacity =
                    "1";

                const coord =
                    getTokenCoordinate(
                        color,
                        progress
                    );

                if(coord){

                    setTokenPosition(
                        token,
                        coord[0],
                        coord[1]
                    );

                }

            }
        );

    }

}


/* =====================================================
   GET ABSOLUTE POSITION
===================================================== */

function absolutePosition(
    color,
    progress
){

    if(progress < 0){
        return null;
    }

    if(progress >= 52){

        const coord =
            homePaths[color][
                progress - 52
            ];

        return coord;
    }

    const index =
        (
            startIndex[color] +
            progress
        ) % 52;

    return ring[index];
}


/* =====================================================
   CHECK POSSIBLE MOVE
===================================================== */

function canMove(
    color,
    index,
    dice
){

    const progress =
        players[color].tokens[index];


    /*
        Finished token cannot move.
    */

    if(progress === 58){
        return false;
    }


    /*
        Base token requires 6.
    */

    if(progress === -1){

        return dice === 6;

    }


    /*
        Cannot exceed finish.
    */

    return progress + dice <= 58;
}


/* =====================================================
   GET POSSIBLE TOKENS
===================================================== */

function possibleTokens(
    color,
    dice
){

    const result = [];

    players[color]
    .tokens
    .forEach(
        (_,index)=>{

            if(
                canMove(
                    color,
                    index,
                    dice
                )
            ){

                result.push(index);

            }

        }
    );

    return result;
}


/* =====================================================
   DICE FACE
===================================================== */

const diceFaces = [
    "",
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];


/* =====================================================
   ROLL DICE
===================================================== */

rollBtn.addEventListener(
    "click",
    rollDice
);


function rollDice(){

    if(gameOver){
        return;
    }

    if(currentDice !== null){
        return;
    }


    rollBtn.disabled = true;

    diceEl.classList.add(
        "rolling"
    );


    let count = 0;

    const animation =
        setInterval(
            ()=>{

                const random =
                    Math.floor(
                        Math.random()*6
                    ) + 1;

                diceEl.textContent =
                    diceFaces[random];

                count++;

                if(count >= 8){

                    clearInterval(
                        animation
                    );

                    const result =
                        Math.floor(
                            Math.random()*6
                        ) + 1;

                    finishRoll(
                        result
                    );

                }

            },
            70
        );

}


/* =====================================================
   FINISH ROLL
===================================================== */

function finishRoll(
    value
){

    currentDice =
        value;

    diceEl.textContent =
        diceFaces[value];

    diceEl.classList.remove(
        "rolling"
    );


    const color =
        currentPlayer;

    const moves =
        possibleTokens(
            color,
            value
        );


    if(moves.length === 0){

        message.textContent =
            `${players[color].name} — এই Dice-এ কোনো valid move নেই`;

        turnHelp.textContent =
            "Turn পরিবর্তন হচ্ছে...";

        setTimeout(
            ()=>{

                if(value === 6){

                    /*
                        Classic rule:
                        6 = extra turn,
                        even if no move.
                    */

                    currentDice = null;

                    rollBtn.disabled =
                        false;

                    turnHelp.textContent =
                        "আবার Dice Roll করুন";

                    message.textContent =
                        `${players[color].name} — 6 পেয়েছেন, আবার Roll করুন`;

                }else{

                    changeTurn();

                }

            },
            850
        );

        return;
    }


    message.textContent =
        `${players[color].name} — একটি Token নির্বাচন করুন`;

    turnHelp.textContent =
        moves.length === 1
        ? "Highlighted Token-এ চাপ দিন"
        : "যে Token চালাতে চান সেটিতে চাপ দিন";


    moves.forEach(
        index=>{

            tokenElements[color][index]
            .classList.add(
                "selectable"
            );

        }
    );

}


/* =====================================================
   TOKEN CLICK
===================================================== */

function handleTokenClick(
    color,
    index
){

    if(gameOver){
        return;
    }

    if(color !== currentPlayer){
        return;
    }

    if(currentDice === null){
        return;
    }

    if(
        !canMove(
            color,
            index,
            currentDice
        )
    ){
        return;
    }


    const dice =
        currentDice;


    tokenElements[color][index]
    .classList.add(
        "moving"
    );


    moveToken(
        color,
        index,
        dice
    );

}


/* =====================================================
   MOVE TOKEN
===================================================== */

async function moveToken(
    color,
    index,
    dice
){

    const token =
        tokenElements[color][index];

    token.classList.remove(
        "selectable"
    );


    let progress =
        players[color].tokens[index];


    /*
        Base -> Start
    */

    if(progress === -1){

        players[color].tokens[index] =
            0;

        renderTokens();

        await wait(260);

    }else{

        /*
            Animate each step
        */

        for(
            let step=1;
            step<=dice;
            step++
        ){

            players[color].tokens[index] =
                progress + step;

            renderTokens();

            token.classList.add(
                "moving"
            );

            await wait(145);

        }

    }


    token.classList.remove(
        "moving"
    );


    /*
        Capture
    */

    const currentProgress =
        players[color].tokens[index];


    if(
        currentProgress >= 0 &&
        currentProgress <= 51
    ){

        captureOpponents(
            color,
            currentProgress
        );

    }


    /*
        Winner check
    */

    if(
        checkWinner(color)
    ){

        gameOver = true;

        showWinner(
            color
        );

        return;
    }


    /*
        6 = extra turn
    */

    currentDice = null;


    if(dice === 6){

        rollBtn.disabled =
            false;

        turnHelp.textContent =
            "6 পেয়েছেন — আবার Roll করুন";

        message.textContent =
            `${players[color].name} — আবার আপনার turn`;

        updatePlayerStand();

        return;

    }


    changeTurn();

}


/* =====================================================
   CAPTURE
===================================================== */

function captureOpponents(
    color,
    progress
){

    const coord =
        absolutePosition(
            color,
            progress
        );

    if(!coord){
        return;
    }


    /*
        Safe cell cannot capture.
    */

    const globalIndex =
        (
            startIndex[color] +
            progress
        ) % 52;


    if(
        safeIndexes.has(
            globalIndex
        )
    ){
        return;
    }


    const opponent =
        color === "red"
        ? "blue"
        : "red";


    players[opponent]
    .tokens
    .forEach(
        (opProgress,index)=>{

            if(opProgress < 0){
                return;
            }

            if(opProgress > 51){
                return;
            }


            const opGlobal =
                (
                    startIndex[opponent] +
                    opProgress
                ) % 52;


            if(
                opGlobal === globalIndex
            ){

                players[opponent]
                .tokens[index] =
                    -1;


                const token =
                    tokenElements[
                        opponent
                    ][index];


                token.classList.add(
                    "capture"
                );


                setTimeout(
                    ()=>{
                        token.classList.remove(
                            "capture"
                        );
                    },
                    500
                );


                message.textContent =
                    `${players[color].name} — Opponent Token কেটেছেন!`;


                renderTokens();

            }

        }
    );

}


/* =====================================================
   WINNER
===================================================== */

function checkWinner(
    color
){

    return players[color]
        .tokens
        .every(
            progress =>
                progress === 58
        );

}


/* =====================================================
   CHANGE TURN
===================================================== */

function changeTurn(){

    currentDice =
        null;

    currentPlayer =
        currentPlayer === "red"
        ? "blue"
        : "red";


    updatePlayerStand();


    rollBtn.disabled =
        false;


    const name =
        players[currentPlayer].name;


    turnHelp.textContent =
        "Dice roll করুন";


    message.textContent =
        `${name}-এর turn — Dice Roll করুন`;

}


/* =====================================================
   UPDATE PLAYER STAND
===================================================== */

function updatePlayerStand(){

    playerRed.classList.toggle(
        "active",
        currentPlayer === "red"
    );

    playerBlue.classList.toggle(
        "active",
        currentPlayer === "blue"
    );


    turnPlayer.textContent =
        players[currentPlayer].name;

}


/* =====================================================
   SHOW WINNER
===================================================== */

function showWinner(
    color
){

    const name =
        players[color].name;


    winnerText.textContent =
        `${name} Wins!`;


    modal.classList.add(
        "show"
    );


    rollBtn.disabled =
        true;


    message.textContent =
        `🏆 ${name} Tournament Match জিতেছেন`;

}


/* =====================================================
   RESTART
===================================================== */

restartBtn.addEventListener(
    "click",
    restartGame
);


function restartGame(){

    players.red.tokens =
        [-1,-1,-1,-1];

    players.blue.tokens =
        [-1,-1,-1,-1];


    currentPlayer =
        "red";

    currentDice =
        null;

    gameOver =
        false;


    diceEl.textContent =
        "⚄";


    modal.classList.remove(
        "show"
    );


    rollBtn.disabled =
        false;


    updatePlayerStand();

    turnHelp.textContent =
        "Dice roll করুন";

    message.textContent =
        "Player A-এর turn — Dice Roll করুন";


    renderTokens();

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   INITIAL RENDER
===================================================== */

renderTokens();

updatePlayerStand();

</script>

</body>
</html>
